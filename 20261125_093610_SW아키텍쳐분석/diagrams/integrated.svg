<rect x="975" y="520" width="235" height="105" class="node old"/>
<text x="995" y="552" class="label">ReviewResult</text><text x="995" y="579" class="small">측정 결과 CSV / Product</text><text x="995" y="603" class="small">측정과 보정은 다른 자료</text>
<path d="M305 572H365M610 572H670M915 572H975" class="edge"/>
