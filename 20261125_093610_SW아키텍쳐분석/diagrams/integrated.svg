<path d="M1093 625V728H915M487 679V625" class="edge"/>
<text x="40" y="852" class="small">운영 레코드·세션 값 비공개 · Script 원문/생성 자료 구분 · 장비/Script 실행 0 · 빌드 0</text>
<text x="40" y="878" class="small">초록: 새 식별정보 경로 / 파랑: 기존 계산 경로 / 노랑: 구분·검증이 필요한 경계</text>
</svg>
