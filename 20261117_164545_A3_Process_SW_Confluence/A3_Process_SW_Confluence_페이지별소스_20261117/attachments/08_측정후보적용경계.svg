<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-label="Review · 원측정에서 다음 가공의 적용값까지"><title>Review · 원측정에서 다음 가공의 적용값까지</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526985" stroke-width="1.5"/></marker></defs><rect width="1400" height="600" fill="#fff"/><g font-family="Malgun Gothic, sans-serif"><text x="35" y="44" font-size="29" fill="#123456" font-weight="bold">Review · 원측정에서 다음 가공의 적용값까지</text><rect x="40" y="110" width="350" height="160" rx="7" fill="#edf4fc" stroke="#526985" stroke-width="1.5"/><text x="58" y="144" font-size="23" fill="#142e50" font-weight="bold">1 원측정과 결과</text><text x="58" y="178" font-size="19" fill="#18263c" font-weight="normal">Glass / Run / Head / Point</text><text x="58" y="205" font-size="19" fill="#18263c" font-weight="normal">RAW · 단위 · OK/NG · 출처</text><text x="58" y="232" font-size="19" fill="#18263c" font-weight="normal">실측·EDIT·재검사 구분</text><line x1="405" y1="185" x2="455" y2="185" stroke="#526985" stroke-width="2" marker-end="url(#arrow)"/><rect x="470" y="110" width="420" height="160" rx="7" fill="#edf4fc" stroke="#526985" stroke-width="1.5"/><text x="488" y="144" font-size="23" fill="#142e50" font-weight="bold">2 보정 후보와 검증</text><text x="488" y="178" font-size="19" fill="#18263c" font-weight="normal">Current + Delta → Final</text><text x="488" y="205" font-size="19" fill="#18263c" font-weight="normal">기준본 · 결과 Revision · 적용범위</text><text x="488" y="232" font-size="19" fill="#18263c" font-weight="normal">실패/미완료·중복 계보 확인</text><line x1="905" y1="185" x2="955" y2="185" stroke="#526985" stroke-width="2" marker-end="url(#arrow)"/><rect x="970" y="110" width="390" height="160" rx="7" fill="#edf4fc" stroke="#526985" stroke-width="1.5"/><text x="988" y="144" font-size="23" fill="#142e50" font-weight="bold">3 적용본 저장</text><text x="988" y="178" font-size="19" fill="#18263c" font-weight="normal">새 Offset와 적용 이력</text><text x="988" y="205" font-size="19" fill="#18263c" font-weight="normal">다음 Prepare에서 다시 읽기</text><text x="988" y="232" font-size="19" fill="#18263c" font-weight="normal">기준본·실제 Script 대조</text><rect x="40" y="355" width="350" height="120" rx="7" fill="#edf8f3" stroke="#526985" stroke-width="1.5"/><text x="58" y="389" font-size="23" fill="#142e50" font-weight="bold">원기록은 근거로 보존</text><text x="58" y="423" font-size="19" fill="#18263c" font-weight="normal">후보 편집 ≠ 새 측정</text><rect x="470" y="355" width="420" height="120" rx="7" fill="#fff5e8" stroke="#526985" stroke-width="1.5"/><text x="488" y="389" font-size="23" fill="#142e50" font-weight="bold">Rollback 범위를 확인</text><text x="488" y="423" font-size="19" fill="#18263c" font-weight="normal">직전 Offset과 결과 Revision 분리</text><rect x="970" y="355" width="390" height="120" rx="7" fill="#f5f6f8" stroke="#526985" stroke-width="1.5"/><text x="988" y="389" font-size="23" fill="#142e50" font-weight="bold">독립 HTML ≠ 생산 Main</text><text x="988" y="423" font-size="19" fill="#18263c" font-weight="normal">교육 UI ≠ 생산 구현</text><text x="40" y="548" font-size="22" fill="#a3531c" font-weight="bold">숫자 0만으로 무오차 측정이라고 판단하지 않는다. 상태·출처·누락·파싱 결과를 함께 본다.</text></g></svg>