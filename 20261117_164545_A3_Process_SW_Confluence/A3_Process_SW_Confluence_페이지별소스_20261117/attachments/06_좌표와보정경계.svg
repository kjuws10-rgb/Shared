<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-label="좌표·단위·보정 · 단계별 중간값을 연결한다"><title>좌표·단위·보정 · 단계별 중간값을 연결한다</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526985" stroke-width="1.5"/></marker></defs><rect width="1400" height="620" fill="#fff"/><g font-family="Malgun Gothic, sans-serif"><text x="35" y="44" font-size="29" fill="#123456" font-weight="bold">좌표·단위·보정 · 단계별 중간값을 연결한다</text><rect x="40" y="100" width="360" height="130" rx="7" fill="#edf4fc" stroke="#526985" stroke-width="1.5"/><text x="58" y="134" font-size="23" fill="#142e50" font-weight="bold">설계 · Cell / Shot</text><text x="58" y="168" font-size="19" fill="#18263c" font-weight="normal">단위 mm · 모델 / Mask / DOE</text><text x="58" y="195" font-size="19" fill="#18263c" font-weight="normal">Head 담당 X 영역 결정</text><line x1="415" y1="165" x2="465" y2="165" stroke="#526985" stroke-width="2" marker-end="url(#arrow)"/><rect x="480" y="100" width="420" height="130" rx="7" fill="#edf4fc" stroke="#526985" stroke-width="1.5"/><text x="498" y="134" font-size="23" fill="#142e50" font-weight="bold">Stage · 진행 기준</text><text x="498" y="168" font-size="19" fill="#18263c" font-weight="normal">기준점 / 이동방향 / 대기거리</text><text x="498" y="195" font-size="19" fill="#18263c" font-weight="normal">Shift Y는 대기거리에도 반영</text><line x1="915" y1="165" x2="965" y2="165" stroke="#526985" stroke-width="2" marker-end="url(#arrow)"/><rect x="980" y="100" width="380" height="130" rx="7" fill="#edf4fc" stroke="#526985" stroke-width="1.5"/><text x="998" y="134" font-size="23" fill="#142e50" font-weight="bold">Scanner · GX / GY</text><text x="998" y="168" font-size="19" fill="#18263c" font-weight="normal">Head transform · swap / flip</text><text x="998" y="195" font-size="19" fill="#18263c" font-weight="normal">Offset 합성 후 실행 명령</text><rect x="40" y="320" width="360" height="130" rx="7" fill="#edf4fc" stroke="#526985" stroke-width="1.5"/><text x="58" y="354" font-size="23" fill="#142e50" font-weight="bold">Camera · 실제 측정</text><text x="58" y="388" font-size="19" fill="#18263c" font-weight="normal">단위 pixel · 해상도 mm/pixel</text><text x="58" y="415" font-size="19" fill="#18263c" font-weight="normal">찾기 결과와 공차 판정 분리</text><line x1="415" y1="385" x2="465" y2="385" stroke="#526985" stroke-width="2" marker-end="url(#arrow)"/><rect x="480" y="320" width="420" height="130" rx="7" fill="#edf4fc" stroke="#526985" stroke-width="1.5"/><text x="498" y="354" font-size="23" fill="#142e50" font-weight="bold">Review · 저장 기준과 기여분</text><text x="498" y="388" font-size="19" fill="#18263c" font-weight="normal">DESIGN / SCANNER 태그 확인</text><text x="498" y="415" font-size="19" fill="#18263c" font-weight="normal">측정 → Delta → Final → Revision</text><rect x="980" y="320" width="380" height="130" rx="7" fill="#edf4fc" stroke="#526985" stroke-width="1.5"/><text x="998" y="354" font-size="23" fill="#142e50" font-weight="bold">Encoder · AUX Count</text><text x="998" y="388" font-size="19" fill="#18263c" font-weight="normal">입력: Stage 대기거리</text><text x="998" y="415" font-size="19" fill="#18263c" font-weight="normal">거리 × count/mm × 진행부호</text><text x="998" y="442" font-size="19" fill="#18263c" font-weight="normal">GX/GY와 다른 물리량</text><text x="40" y="532" font-size="23" fill="#a3531c" font-weight="bold">고정 기하·Default·FirstBeam·Align·Review·Shift는 소유자와 적용 위치가 다르다.</text><text x="40" y="574" font-size="22" fill="#18263c" font-weight="normal">같은 Recipe · Head · Shot · 실행 회차 · 기준 Revision으로 값을 비교한다.</text></g></svg>