<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-label="장비 배치와 왕복 물류 · 설명용 개념도"><title>장비 배치와 왕복 물류 · 설명용 개념도</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526985" stroke-width="1.5"/></marker></defs><rect width="1400" height="790" fill="#fff"/><g font-family="Malgun Gothic, sans-serif"><text x="35" y="44" font-size="29" fill="#123456" font-weight="bold">장비 배치와 왕복 물류 · 설명용 개념도</text><text x="40" y="84" font-size="20" fill="#5a6677" font-weight="normal">X 방향은 Head 담당 영역, Y 방향은 기판 이송이다. 설치거리·축부호는 현장에서 확인한다.</text><line x1="155" y1="125" x2="1060" y2="125" stroke="#526985" stroke-width="2" marker-end="url(#arrow)"/><text x="562.5" y="113" font-size="18" fill="#18263c" font-weight="normal">X: 8개 Head가 폭을 분할</text><rect x="110" y="165" width="1050" height="485" rx="7" fill="#f6f7fa" stroke="#7e8da4"/><rect x="135" y="185" width="1000" height="75" fill="#e4f1e8" stroke="#548569"/><text x="475" y="230" font-size="25" fill="#18263c" font-weight="normal">기판 · Stage가 Y로 이동</text><rect x="465" y="305" width="345" height="95" rx="7" fill="#edf4fc" stroke="#526985" stroke-width="1.5"/><text x="483" y="339" font-size="23" fill="#142e50" font-weight="bold">Review Camera</text><text x="483" y="373" font-size="19" fill="#18263c" font-weight="normal">기준점·가공 후 측정</text><rect x="150" y="430" width="85" height="55" rx="4" fill="#e4eef9" stroke="#52739a"/><text x="174" y="465" font-size="22" fill="#18263c" font-weight="normal">H1</text><rect x="270" y="490" width="85" height="55" rx="4" fill="#e4eef9" stroke="#52739a"/><text x="294" y="525" font-size="22" fill="#18263c" font-weight="normal">H2</text><rect x="390" y="430" width="85" height="55" rx="4" fill="#e4eef9" stroke="#52739a"/><text x="414" y="465" font-size="22" fill="#18263c" font-weight="normal">H3</text><rect x="510" y="490" width="85" height="55" rx="4" fill="#e4eef9" stroke="#52739a"/><text x="534" y="525" font-size="22" fill="#18263c" font-weight="normal">H4</text><rect x="630" y="430" width="85" height="55" rx="4" fill="#e4eef9" stroke="#52739a"/><text x="654" y="465" font-size="22" fill="#18263c" font-weight="normal">H5</text><rect x="750" y="490" width="85" height="55" rx="4" fill="#e4eef9" stroke="#52739a"/><text x="774" y="525" font-size="22" fill="#18263c" font-weight="normal">H6</text><rect x="870" y="430" width="85" height="55" rx="4" fill="#e4eef9" stroke="#52739a"/><text x="894" y="465" font-size="22" fill="#18263c" font-weight="normal">H7</text><rect x="990" y="490" width="85" height="55" rx="4" fill="#e4eef9" stroke="#52739a"/><text x="1014" y="525" font-size="22" fill="#18263c" font-weight="normal">H8</text><line x1="1230" y1="180" x2="1230" y2="650" stroke="#526985" stroke-width="2" marker-end="url(#arrow)"/><text x="1248" y="330" font-size="20" fill="#18263c" font-weight="normal">정방향</text><text x="1248" y="362" font-size="20" fill="#18263c" font-weight="normal">이동</text><line x1="65" y1="650" x2="65" y2="180" stroke="#526985" stroke-width="2" marker-end="url(#arrow)"/><text x="115" y="705" font-size="24" fill="#123456" font-weight="bold">되돌아오는 Y 이동 중 MOF → Review 측정 → Home 복귀</text><text x="430" y="595" font-size="21" fill="#18263c" font-weight="normal">Head는 Y로 어긋나도 X 영역을 나누어 담당</text><text x="980" y="685" font-size="22" fill="#18263c" font-weight="normal">Turnaround</text></g></svg>