<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 640" role="img" aria-labelledby="title desc"><title id="title">결과 Revision: 재측정과 편집을 분리해 추적</title><desc id="desc">EDIT는 변환열을 우선 수정하며 raw가 함께 있으면 기존 raw를 유지합니다. ONE SHOT/Legacy처럼 RESULT_SOURCE 열이 없으면 EDITED 출처가 새로 생기지 않아 적용 정책이 달라집니다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#6b7f97"/></marker></defs><rect width="1260" height="640" rx="22" fill="#f4f7fb"/><text x="38" y="48" font-family="Malgun Gothic, sans-serif" font-size="25" font-weight="700" fill="#16324f">결과 Revision: 재측정과 편집을 분리해 추적</text><text x="40" y="80" font-family="Malgun Gothic, sans-serif" font-size="14" fill="#5e7087">Ver11.13.0 · dfa5920e6301 · 정적 소스 해설 · 실장비 검증 미실행</text><path d="M300 165L350 165" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M600 165L650 165" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M175 215V270H475V325" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M600 375L650 375" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M900 375L950 375" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M900 165L950 165" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M1075 325V270H1075V215" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M350 375L300 375" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="50" y="115" width="250" height="100" rx="13" fill="#ffffff" stroke="#b7cbdc" stroke-width="1.5"/><text x="175" y="155" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="700" fill="#234760">기존 BASE CSV</text><text x="175" y="183" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#234760">원본은 보존</text><rect x="350" y="115" width="250" height="100" rx="13" fill="#ffffff" stroke="#b7cbdc" stroke-width="1.5"/><text x="475" y="155" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="700" fill="#234760">RE-INSPECTION</text><text x="475" y="183" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#234760">선택 Shot 새 측정</text><rect x="650" y="115" width="250" height="100" rx="13" fill="#ffffff" stroke="#b7cbdc" stroke-width="1.5"/><text x="775" y="155" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="700" fill="#234760">새 _REINSP_ CSV</text><text x="775" y="183" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#234760">MEASURED·REINSPECTION_NG</text><rect x="350" y="325" width="250" height="100" rx="13" fill="#ffffff" stroke="#b7cbdc" stroke-width="1.5"/><text x="475" y="365" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="700" fill="#234760">KEY IN / COPY 후보</text><text x="475" y="393" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#234760">X/Y·JUDGE 독립 선택</text><rect x="650" y="325" width="250" height="100" rx="13" fill="#ffffff" stroke="#b7cbdc" stroke-width="1.5"/><text x="775" y="365" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="700" fill="#234760">새 _EDIT_ CSV</text><text x="775" y="393" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#234760">열이 있으면 EDITED</text><rect x="950" y="325" width="250" height="100" rx="13" fill="#ffffff" stroke="#b7cbdc" stroke-width="1.5"/><text x="1075" y="365" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="700" fill="#234760">선택하면 새 파일 LOAD</text><text x="1075" y="393" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#234760">산포도·표는 Judge 중심</text><rect x="950" y="115" width="250" height="100" rx="13" fill="#ffffff" stroke="#b7cbdc" stroke-width="1.5"/><text x="1075" y="155" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="700" fill="#234760">별도 OFFSET APPLY</text><text x="1075" y="183" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#234760">형식·출처에 따라 소비</text><rect x="50" y="325" width="250" height="100" rx="13" fill="#fff4df" stroke="#d6a04c" stroke-width="1.5"/><text x="175" y="365" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="700" fill="#8d5114">부모 hash·기준 Offset ID</text><text x="175" y="393" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#8d5114">전용 계보·작업자 기록 없음</text><rect x="38" y="487" width="1184" height="113" rx="13" fill="#e8eef5"/><text x="57" y="521" font-family="Malgun Gothic, sans-serif" font-size="16" fill="#3b5570">EDIT는 변환열을 우선 수정하며 raw가 함께 있으면 기존 raw를 유지합니다.</text><text x="57" y="550" font-family="Malgun Gothic, sans-serif" font-size="16" fill="#3b5570">ONE SHOT/Legacy처럼 RESULT_SOURCE 열이 없으면 EDITED 출처가 새로 생기지 않아 적용 정책이 달라집니다.</text></svg>
