<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 640" role="img" aria-labelledby="title desc"><title id="title">Masking·Sampling·ONE LINE: 점 선택과 경로의 경계</title><desc id="desc">Fine의 마스킹된 행 자동 대체와 이동 선분 우회는 이번 변경에 추가되지 않았습니다. 점/순서/실제 촬영 Count와 요청 LINE_COUNT를 함께 확인합니다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#6b7f97"/></marker></defs><rect width="1260" height="640" rx="22" fill="#f4f7fb"/><text x="38" y="48" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="700" fill="#16324f">Masking·Sampling·ONE LINE: 점 선택과 경로의 경계</text><text x="40" y="80" font-family="Malgun Gothic,sans-serif" font-size="14" fill="#5e7087">Ver11.19.0 · 28764c91d521 · 정적 소스 해설 · 실장비 검증 미실행</text><path d="M300.0 165.0L350.0 165.0" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M600.0 165.0L650.0 165.0" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M475.0 215.0V270.0H775.0V325.0" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M900.0 165.0L950.0 165.0" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M775.0 325.0V270.0H1075.0V215.0" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M1075.0 215.0V270.0H1075.0V325.0" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M950.0 375.0L600.0 375.0" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M350.0 375.0L300.0 375.0" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="50" y="115" width="250" height="100" rx="13" fill="#ffffff" stroke="#b7cbdc" stroke-width="1.5"/><text x="175.0" y="155" text-anchor="middle" font-family="Malgun Gothic,sans-serif" font-size="16" font-weight="700" fill="#234760">설계 Shot footprint</text><text x="175.0" y="183" text-anchor="middle" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#234760">Beam별 Masking 판정</text><rect x="350" y="115" width="250" height="100" rx="13" fill="#ffffff" stroke="#b7cbdc" stroke-width="1.5"/><text x="475.0" y="155" text-anchor="middle" font-family="Malgun Gothic,sans-serif" font-size="16" font-weight="700" fill="#234760">Masking·CHESS 제외</text><text x="475.0" y="183" text-anchor="middle" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#234760">가공 Head·Use 확인</text><rect x="650" y="115" width="250" height="100" rx="13" fill="#ffffff" stroke="#b7cbdc" stroke-width="1.5"/><text x="775.0" y="155" text-anchor="middle" font-family="Malgun Gothic,sans-serif" font-size="16" font-weight="700" fill="#234760">FINE 기하학 row Sampling</text><text x="775.0" y="183" text-anchor="middle" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#234760">그 뒤 Use로 제외점 제거</text><rect x="650" y="325" width="250" height="100" rx="13" fill="#ffffff" stroke="#b7cbdc" stroke-width="1.5"/><text x="775.0" y="365" text-anchor="middle" font-family="Malgun Gothic,sans-serif" font-size="16" font-weight="700" fill="#234760">ONE LINE: Glass Y 줄</text><text x="775.0" y="393" text-anchor="middle" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#234760">DIRECT_LINE 보정 지원</text><rect x="950" y="115" width="250" height="100" rx="13" fill="#ffffff" stroke="#b7cbdc" stroke-width="1.5"/><text x="1075.0" y="155" text-anchor="middle" font-family="Malgun Gothic,sans-serif" font-size="16" font-weight="700" fill="#234760">선택 키·Beam·순서 고정</text><text x="1075.0" y="183" text-anchor="middle" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#234760">1001은 검색 식별자</text><rect x="950" y="325" width="250" height="100" rx="13" fill="#ffffff" stroke="#b7cbdc" stroke-width="1.5"/><text x="1075.0" y="365" text-anchor="middle" font-family="Malgun Gothic,sans-serif" font-size="16" font-weight="700" fill="#234