<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 640" role="img" aria-labelledby="title desc"><title id="title">Vision: 픽셀·mm·판정·등급 분리</title><desc id="desc">L1~L4는 현재 OPTION 표시색이며 품질 Judge·보정 적격 판정을 바꾸지 않습니다. live는 VisionFind NG를 등급에서 빼지만 LOAD는 오차값만으로 등급을 계산합니다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#6b7f97"/></marker></defs><rect width="1260" height="640" rx="22" fill="#f4f7fb"/><text x="38" y="48" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="700" fill="#16324f">Vision: 픽셀·mm·판정·등급 분리</text><text x="40" y="80" font-family="Malgun Gothic,sans-serif" font-size="14" fill="#5e7087">Ver11.17.0 · 96e22cd027c8 · 정적 소스 해설 · 실장비 검증 미실행</text><path d="M300.0 165.0L350.0 165.0" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M600.0 165.0L650.0 165.0" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M900.0 165.0L950.0 165.0" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M1075.0 215.0V270.0H1075.0V325.0" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M950.0 375.0L900.0 375.0" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M650.0 375.0L600.0 375.0" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M650.0 375.0L300.0 375.0" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="50" y="115" width="250" height="100" rx="13" fill="#ffffff" stroke="#b7cbdc" stroke-width="1.5"/><text x="175.0" y="155" text-anchor="middle" font-family="Malgun Gothic,sans-serif" font-size="16" font-weight="700" fill="#234760">1001 검색 식별자</text><text x="175.0" y="183" text-anchor="middle" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#234760">24-byte record</text><rect x="350" y="115" width="250" height="100" rx="13" f