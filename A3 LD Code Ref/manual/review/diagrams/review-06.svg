<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 640" role="img" aria-labelledby="title desc"><title id="title">Default: AK 평균·1/16슬롯·새 가공 검증</title><desc id="desc">AK3 입력은 자동 새 측정이나 AK4점 글로벌 X/Y 회전 피팅이 아닙니다. 전역grid1/4 지원은 Head별 DOE3+원빔5 혼합구성·Beam11 자동대응 구현을 뜻하지 않습니다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#6b7f97"/></marker></defs><rect width="1260" height="640" rx="22" fill="#f4f7fb"/><text x="38" y="48" font-family="Malgun Gothic, sans-serif" font-size="25" font-weight="700" fill="#16324f">Default: AK 평균·1/16슬롯·새 가공 검증</text><text x="40" y="80" font-family="Malgun Gothic, sans-serif" font-size="14" fill="#5e7087">Ver11.13.0 · dfa5920e6301 · 정적 소스 해설 · 실장비 검증 미실행</text><path d="M300 165L350 165" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M600 165L650 165" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M900 165L950 165" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M1075 215V270H1075V325" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M950 375L900 375" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M650 375L600 375" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M350 375L300 375" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="263" y="353" width="124" height="23" rx="5" fill="#f4f7fb"/><text x="325" y="369" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="12" fill="#526981">실패·중단</text><rect x="50" y="115" width="250" height="100" rx="13" fill="#ffffff" stroke="#b7cbdc" stroke-width="1.5"/><text x="175" y="155" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="700" fill="#234760">AK1 Recipe + AK3 세션</text><text x="175" y="183" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#234760">AK3 기본은 설계값</text><rect x="350" y="115" width="250" height="100" rx="13" fill="#ffffff" stroke="#b7cbdc" stroke-width="1.5"/><text x="475" y="155" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="700" fill="#234760">Center=(AK1+AK3)/2</text><text x="475" y="183" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#234760">Head 목표=center+(h−4.5)×gap</text><rect x="650" y="115" width="250" height="100" rx="13" fill="#ffffff" stroke="#b7cbdc" stroke-width="1.5"/><text x="775" y="155" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="700" fill="#234760">현재 Default 포함 예상위치</text><text x="775" y="183" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#234760">최종 목표와 구별</text><rect x="950" y="115" width="250" height="100" rx="13" fill="#ffffff" stroke="#b7cbdc" stroke-width="1.5"/><text x="1075" y="155" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="700" fill="#234760">전역 DOE grid1 또는4</text><text x="1075" y="183" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#234760">Shot·십자 모두1/16 Capture</text><rect x="950" y="325" width="250" height="100" rx="13" fill="#ffffff" stroke="#b7cbdc" stroke-width="1.5"/><text x="1075" y="365" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="700" fill="#234760">정확한 Beam 집합·전점OK</text><text x="1075" y="393" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#234760">Fit·encoder−correction 중심</text><rect x="650" y="325" width="250" height="100" rx="13" fill="#ffffff" stroke="#b7cbdc" stroke-width="1.5"/><text x="775" y="365" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="700" fill="#234760">현재 Default − 중심오차</text><text x="775" y="393" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#234760">Recipe 조건부 저장</text><rect x="350" y="325" width="250" height="100" rx="13" fill="#ffffff" stroke="#b7cbdc" stroke-width="1.5"/><text x="475" y="365" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="700" fill="#234760">4/5→3/6→2/7→1/8</text><text x="475" y="393" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#234760">각 쌍 새 가공·새 검증</text><rect x="50" y="325" width="250" height="100" rx="13" fill="#fff4df" stroke="#d6a04c" stroke-width="1.5"/><text x="175" y="365" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="700" fill="#8d5114">실패 쌍만 적용 전 복원</text><text x="175" y="393" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#8d5114">앞의 검증된 쌍은 유지</text><rect x="38" y="487" width="1184" height="113" rx="13" fill="#e8eef5"/><text x="57" y="521" font-family="Malgun Gothic, sans-serif" font-size="16" fill="#3b5570">AK3 입력은 자동 새 측정이나 AK4점 글로벌 X/Y 회전 피팅이 아닙니다.</text><text x="57" y="550" font-family="Malgun Gothic, sans-serif" font-size="16" fill="#3b5570">전역grid1/4 지원은 Head별 DOE3+원빔5 혼합구성·Beam11 자동대응 구현을 뜻하지 않습니다.</text></svg>
