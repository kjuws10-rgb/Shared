<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 640" role="img" aria-labelledby="title desc"><title id="title">Review 계획: 선택·목표·통신·결과를 분리</title><desc id="desc">ONE LINE은 실행가능한 Glass Y 줄이며 같은 Y의 다른 Cell도 포함할 수 있습니다. AUTO는 Beam11·Shift0 정책을 유지합니다. ONE_LINE 결과 OFFSET APPLY는 지원목록에 없습니다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#6b7f97"/></marker></defs><rect width="1260" height="640" rx="22" fill="#f4f7fb"/><text x="38" y="48" font-family="Malgun Gothic, sans-serif" font-size="25" font-weight="700" fill="#16324f">Review 계획: 선택·목표·통신·결과를 분리</text><text x="40" y="80" font-family="Malgun Gothic, sans-serif" font-size="14" fill="#5e7087">Ver11.13.0 · dfa5920e6301 · 정적 소스 해설 · 실장비 검증 미실행</text><path d="M300 165L350 165" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M600 165L650 165" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M900 165L950 165" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M1075 215V267.5H1075V320" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M950 370L900 370" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M650 370L600 370" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M350 370L300 370" fill="none" stroke="#6b7f97" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="50" y="115" width="250" height="100" rx="13" fill="#ffffff" stroke="#b7cbdc" stroke-width="1.5"/><text x="175" y="155" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="700" fill="#234760">Recipe·Setting</text><text x="175" y="183" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#234760">Shift와 Beam 조건</text><rect x="350" y="115" width="250" height="100" rx="13" fill="#ffffff" stroke="#b7cb