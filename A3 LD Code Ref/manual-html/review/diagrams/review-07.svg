ont-size="13" font-weight="400" fill="#234760">추가retry 0~3회 정책</text><rect x="650" y="325" width="250" height="100" rx="13" fill="#ffffff" stroke="#b7cbdc" stroke-width="1.5"/><text x="775.0" y="365" text-anchor="middle" font-family="Malgun Gothic,sans-serif" font-size="16" font-weight="700" fill="#234760">Request0·Complete0 확인</text><text x="775.0" y="393" text-anchor="middle" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#234760">남은 횟수면 재요청1</text><rect x="950" y="325" width="250" height="100" rx="13" fill="#fff5e8" stroke="#b7cbdc" stroke-width="1.5"/><text x="1075.0" y="365" text-anchor="middle" font-family="Malgun Gothic,sans-serif" font-size="16" font-weight="700" fill="#234760">소진: 경고 callback</text><text x="1075.0" y="393" text-anchor="middle" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#234760">AUTO 계속·Count 유지</text><rect x="38" y="487" width="1184" height="113" rx="13" fill="#e8eef5"/><text x="57" y="521" font-family="Malgun Gothic,sans-serif" font-size="14" fill="#3b5570">Distortion·Window 시퀀스는 이번 diff에서 바뀌지 않았습니다. 기존 계약·후속 시험을 유지합니다.</text><text x="57" y="550" font-family="Malgun Gothic,sans-serif" font-size="14" fill="#3b5570">Distortion X선형→Y Lagrange와 Fine Cell/X열 Y Lagrange는 입력·저장·소비가 다릅니다.</text></svg>
