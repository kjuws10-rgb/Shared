<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" role="img" aria-labelledby="offset-math-references-title-handbook3 offset-math-references-desc-handbook3" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;font-family:Malgun Gothic,Arial,sans-serif"><style>text{font-family:Malgun Gothic,Arial,sans-serif}</style><title id="offset-math-references-title-handbook3">Glass 중심 C_ref·Head 가상 원점 O_h·제품 첫 홀 Point ID 구분</title><desc id="offset-math-references-desc-handbook3">Glass 기준 중심은 Head 목표 배분의 공통 기준이다. Head 가상 원점은 Default Offset의 설치 기준이다. 제품 첫 홀은 Head 또는 Head-Cell 범위에서 Simple/Rough 측정에 사용하는 실제 제품 가공점이다. 셋을 같은 위치로 가정하거나 같은 데이터 키로 저장하지 않는다.</desc><defs><marker id="offset-math-references-arrow-blue-handbook3" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#2366ac"/></marker><marker id="offset-math-references-arrow-green-handbook3" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#14735d"/></marker><marker id="offset-math-references-arrow-red-handbook3" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#b3444d"/></marker></defs><rect width="860" height="835" fill="white"/><text x="25" y="37" font-size="24" fill="#18394c" text-anchor="start" font-weight="700">기판 중심 · Head 원점 · 제품 첫 홀을 구분합니다</text><text x="25" y="70" font-size="16" fill="#536c7d" text-anchor="start">각 대상을 따로 확대한 개념 그림 · 같은 점이나 같은 배율을 뜻하지 않습니다</text><rect x="25" y="106" width="250" height="400" rx="10" fill="white" stroke="#2366ac" stroke-width="1.5"/><rect x="305" y="106" width="250" height="400" rx="10" fill="white" stroke="#aa6a12" stroke-width="1.5"/><rect x="585" y="106" width="250" height="400" rx="10" fill="white" stroke="#14735d" stroke-width="1.5"/><text x="150" y="144" font-size="23" fill="#2366ac" text-anchor="mid