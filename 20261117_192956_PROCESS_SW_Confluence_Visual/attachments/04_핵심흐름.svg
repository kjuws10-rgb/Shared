<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="830" viewBox="0 0 1600 830"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1766ad"/></marker></defs><rect width="1600" height="830" fill="#f5f8fc"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="55" y="62" font-size="34" fill="#152d45" font-weight="700" text-anchor="start">시작할 때 읽는 폴더와 초기화 상태를 먼저 확인합니다</text><text x="55" y="104" font-size="21" fill="#586c80" font-weight="400" text-anchor="start">.NET 8 WPF 프로그램은 설정 파일을 읽고 장치 관리 객체를 준비합니다.</text><rect x="60" y="185" width="410" height="220" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="60" y="203" width="6" height="184" rx="3" fill="#1766ad"/><text x="85" y="227" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">프로그램 시작</text><text x="85" y="267" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">실행파일 위치에서 상위 탐색</text><text x="85" y="299" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">Drilling.sln 발견 → 옆 Config</text><text x="85" y="331" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">없으면 작업 디렉터리 Config</text><rect x="600" y="185" width="410" height="220" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="600" y="203" width="6" height="184" rx="3" fill="#0b8894"/><text x="625" y="227" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">객체 구성</text><text x="625" y="267" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">파일 읽기 / Manager 구성</text><text x="625" y="299" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">화면 생성</text><text x="625" y="331" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">장치 비동기 초기화</text><rect x="1140" y="185" width="390" height="220" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="1140" y="203" width="6" height="184" rx="3" fill="#238364"/><text x="1165" y="227" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">운전 준비 상태</text><text x="1165" y="267" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">참조 DLL 로드</text><text x="1165" y="299" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">ConfigRoot / 통신 설정</text><text x="1165" y="331" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">각 장치 Ready 확인</text><path d="M480,295 L590,295" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M1020,295 L1130,295" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="485" width="1470" height="200" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><text x="95" y="535" font-size="28" fill="#152d45" font-weight="700" text-anchor="start">배포 묶음</text><rect x="95" y="570" width="320" height="74" rx="10" fill="#eef4fb" stroke="#c9d7e3" stroke-width="2"/><text x="255" y="616" font-size="23" fill="#152d45" font-weight="600" text-anchor="middle">실행파일 · DLL</text><rect x="465" y="570" width="320" height="74" rx="10" fill="#eef4fb" stroke="#c9d7e3" stroke-width="2"/><text x="625" y="616" font-size="23" fill="#152d45" font-weight="600" text-anchor="middle">Config · Recipe</text><rect x="835" y="570" width="320" height="74" rx="10" fill="#eef4fb" stroke="#c9d7e3" stroke-width="2"/><text x="995" y="616" font-size="23" fill="#152d45" font-weight="600" text-anchor="middle">Calibration · 보정</text><rect x="1205" y="570" width="320" height="74" rx="10" fill="#eef4fb" stroke="#c9d7e3" stroke-width="2"/><text x="1365" y="616" font-size="23" fill="#152d45" font-weight="600" text-anchor="middle">적용 후 확인</text><text x="55" y="790" font-size="21" fill="#586c80" font-weight="400" text-anchor="start">창이 열렸다는 사실과 모든 장치 초기화가 끝났다는 사실을 구분합니다.</text></g></svg>