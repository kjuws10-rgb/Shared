<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="830" viewBox="0 0 1600 830"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1766ad"/></marker></defs><rect width="1600" height="830" fill="#f5f8fc"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="55" y="62" font-size="34" fill="#152d45" font-weight="700" text-anchor="start">기판 안의 Cell, 가공하는 Head, 한 번의 Shot을 구분합니다</text><text x="55" y="104" font-size="21" fill="#586c80" font-weight="400" text-anchor="start">그림의 모양과 개수는 개념 예시이며 실제 대상은 선택한 Recipe가 정합니다.</text><rect x="70" y="205" width="650" height="380" rx="5" fill="#eaf4fb" stroke="#1766ad" stroke-width="2"/><path d="M286.66666666666663,205 V585" stroke="#b4cadb"/><path d="M503.3333333333333,205 V585" stroke="#b4cadb"/><path d="M70,395 H720" stroke="#b4cadb"/><text x="395" y="640" font-size="25" fill="#152d45" font-weight="700" text-anchor="middle">기판 한 장 안에 반복 배치된 Cell</text><rect x="285" y="223" width="203" height="174" rx="2" fill="#d4eeec" stroke="#238364" stroke-width="2"/><text x="385" y="275" font-size="24" fill="#238364" font-weight="700" text-anchor="middle">선택 Cell</text><circle cx="320" cy="310" r="5" fill="#238364"/><circle cx="320" cy="338" r="5" fill="#238364"/><circle cx="320" cy="366" r="5" fill="#238364"/><circle cx="360" cy="310" r="5" fill="#238364"/><circle cx="360" cy="338" r="5" fill="#238364"/><circle cx="360" cy="366" r="5" fill="#238364"/><circle cx="400" cy="310" r="5" fill="#238364"/><circle cx="400" cy="338" r="5" fill="#238364"/><circle cx="400" cy="366" r="5" fill="#238364"/><circle cx="440" cy="310" r="5" fill="#238364"/><circle cx="440" cy="338" r="5" fill="#238364"/><circle cx="440" cy="366" r="5" fill="#238364"/><rect x="860" y="180" width="660" height="160" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="860" y="198" width="6" height="124" rx="3" fill="#c17b1c"/><text x="885" y="222" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">Head / Scanner</text><text x="885" y="262" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">담당하는 영역의 가공점을 실행하는 장치</text><path d="M1120,350 L1120,420" fill="none" stroke="#c17b1c" stroke-width="3" marker-end="url(#arrow)"/><rect x="860" y="430" width="660" height="260" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><text x="890" y="475" font-size="26" fill="#152d45" font-weight="700" text-anchor="start">Shot과 DOE Beam</text><circle cx="965" cy="525" r="6" fill="#1766ad"/><circle cx="965" cy="560" r="6" fill="#1766ad"/><circle cx="965" cy="595" r="6" fill="#1766ad"/><circle cx="965" cy="630" r="6" fill="#1766ad"/><circle cx="1000" cy="525" r="6" fill="#1766ad"/><circle cx="1000" cy="560" r="6" fill="#1766ad"/><circle cx="1000" cy="595" r="6" fill="#1766ad"/><circle cx="1000" cy="630" r="6" fill="#1766ad"/><circle cx="1035" cy="525" r="6" fill="#1766ad"/><circle cx="1035" cy="560" r="6" fill="#1766ad"/><circle cx="1035" cy="595" r="6" fill="#1766ad"/><circle cx="1035" cy="630" r="6" fill="#1766ad"/><circle cx="1070" cy="525" r="6" fill="#1766ad"/><circle cx="1070" cy="560" r="6" fill="#1766ad"/><circle cx="1070" cy="595" r="6" fill="#1766ad"/><circle cx="1070" cy="630" r="6" fill="#1766ad"/><path d="M1004,577 H1030 M1017,564 V590" stroke="#238364" stroke-width="3"/><text x="1170" y="535" font-size="21" fill="#586c80" font-weight="400" text-anchor="start">Shot: 한 번의 가공 동작</text><text x="1170" y="580" font-size="21" fill="#586c80" font-weight="400" text-anchor="start">Beam: 분기된 가공 위치</text><text x="1170" y="625" font-size="21" fill="#586c80" font-weight="400" text-anchor="start">Point: 추적할 대상 식별</text><path d="M730,390 L850,510" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#arrow)"/><text x="55" y="790" font-size="21" fill="#586c80" font-weight="400" text-anchor="start">같은 가공점을 Cell · Head · Shot · Beam · Point 식별자로 연결합니다.</text></g></svg>