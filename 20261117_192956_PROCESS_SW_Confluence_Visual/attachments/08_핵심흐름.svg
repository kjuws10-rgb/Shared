<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="830" viewBox="0 0 1600 830"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1766ad"/></marker></defs><rect width="1600" height="830" fill="#f5f8fc"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="55" y="62" font-size="34" fill="#152d45" font-weight="700" text-anchor="start">측정 → 오차 → 보정 후보 → 적용본을 구분합니다</text><text x="55" y="104" font-size="21" fill="#586c80" font-weight="400" text-anchor="start">검사 성공과 보정 저장 성공, 다음 가공 반영 성공은 같은 상태가 아닙니다.</text><rect x="60" y="175" width="650" height="365" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><text x="90" y="222" font-size="27" fill="#152d45" font-weight="700" text-anchor="start">가공점 하나의 측정</text><path d="M252,365 H278 M265,352 V378" stroke="#1766ad" stroke-width="3"/><text x="225" y="410" font-size="22" fill="#1766ad" font-weight="400" text-anchor="start">목표</text><circle cx="390" cy="305" r="11" fill="#bd4c55"/><text x="405" y="302" font-size="22" fill="#bd4c55" font-weight="400" text-anchor="start">실측</text><path d="M390,305 L275,360" fill="none" stroke="#238364" stroke-width="3" marker-end="url(#arrow)"/><text x="360" y="395" font-size="23" fill="#238364" font-weight="400" text-anchor="start">차이 계산</text><text x="90" y="490" font-size="22" fill="#586c80" font-weight="400" text-anchor="start">RAW · 단위 · Point · 유효성 확인</text><rect x="820" y="175" width="680" height="145" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="820" y="193" width="6" height="109" rx="3" fill="#238364"/><text x="845" y="217" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">보정 후보 계산</text><text x="845" y="257" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">유효한 측정 행만 사용 / 적용 범위 선택</text><rect x="820" y="390" width="680" height="145" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="820" y="408" width="6" height="109" rx="3" fill="#c17b1c"/><text x="845" y="432" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">저장 · 적용</text><text x="845" y="472" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">기준본과 결과 회차 확인 / 다음 준비에 반영</text><path d="M720,355 L810,250" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M1160,330 L1160,380" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="600" width="450" height="110" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="60" y="618" width="6" height="74" rx="3" fill="#1766ad"/><text x="85" y="642" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">측정 원본</text><text x="85" y="682" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">원시값과 NG 사유 보존</text><rect x="570" y="600" width="450" height="110" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="570" y="618" width="6" height="74" rx="3" fill="#238364"/><text x="595" y="642" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">보정 후보</text><text x="595" y="682" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">아직 적용 전 계산값</text><rect x="1080" y="600" width="450" height="110" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="1080" y="618" width="6" height="74" rx="3" fill="#c17b1c"/><text x="1105" y="642" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">적용본</text><text x="1105" y="682" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">실행에 사용할 기준값</text><text x="55" y="790" font-size="21" fill="#586c80" font-weight="400" text-anchor="start">Head 전체와 특정 Head–Cell에 적용하는 범위를 섞지 않습니다.</text></g></svg>