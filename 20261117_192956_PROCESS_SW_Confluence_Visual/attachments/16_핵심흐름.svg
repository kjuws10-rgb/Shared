<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="830" viewBox="0 0 1600 830"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1766ad"/></marker></defs><rect width="1600" height="830" fill="#f5f8fc"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="55" y="62" font-size="34" fill="#152d45" font-weight="700" text-anchor="start">자료마다 역할과 적용 시점을 정해 관리합니다</text><text x="55" y="104" font-size="21" fill="#586c80" font-weight="400" text-anchor="start">서로 다른 데이터가 같은 이름으로 덮어써지지 않도록 구분합니다.</text><rect x="55" y="185" width="275" height="180" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="55" y="203" width="6" height="144" rx="3" fill="#1766ad"/><text x="80" y="227" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">설정</text><text x="80" y="267" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">장비 동작 · 통신</text><text x="80" y="299" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">옵션</text><rect x="360" y="185" width="275" height="180" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="360" y="203" width="6" height="144" rx="3" fill="#0b8894"/><text x="385" y="227" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">Recipe</text><text x="385" y="267" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">모델 · 패턴</text><text x="385" y="299" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">가공 조건</text><rect x="665" y="185" width="275" height="180" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="665" y="203" width="6" height="144" rx="3" fill="#c17b1c"/><text x="690" y="227" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">Calibration</text><text x="690" y="267" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">장비 고유 변환과 기준</text><rect x="970" y="185" width="275" height="180" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="970" y="203" width="6" height="144" rx="3" fill="#238364"/><text x="995" y="227" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">보정</text><text x="995" y="267" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">검사 결과로 정한 적용값</text><rect x="1275" y="185" width="275" height="180" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="1275" y="203" width="6" height="144" rx="3" fill="#1766ad"/><text x="1300" y="227" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">결과</text><text x="1300" y="267" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">측정 원본 · 판정</text><text x="1300" y="299" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">이력</text><rect x="55" y="470" width="1495" height="220" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><text x="85" y="515" font-size="28" fill="#152d45" font-weight="700" text-anchor="start">변경 반영 순서</text><rect x="85" y="555" width="250" height="75" rx="9" fill="#eef4fb" stroke="#c9d7e3" stroke-width="2"/><text x="210" y="601" font-size="22" fill="#152d45" font-weight="600" text-anchor="middle">변경 전 보관</text><path d="M340,592 L370,592" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="380" y="555" width="250" height="75" rx="9" fill="#eef4fb" stroke="#c9d7e3" stroke-width="2"/><text x="505" y="601" font-size="22" fill="#152d45" font-weight="600" text-anchor="middle">값 검증</text><path d="M635,592 L665,592" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="675" y="555" width="250" height="75" rx="9" fill="#eef4fb" stroke="#c9d7e3" stroke-width="2"/><text x="800" y="601" font-size="22" fill="#152d45" font-weight="600" text-anchor="middle">저장 / 재로딩</text><path d="M930,592 L960,592" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="970" y="555" width="250" height="75" rx="9" fill="#eef4fb" stroke="#c9d7e3" stroke-width="2"/><text x="1095" y="601" font-size="22" fill="#152d45" font-weight="600" text-anchor="middle">실행 조건 갱신</text><path d="M1225,592 L1255,592" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="1265" y="555" width="250" height="75" rx="9" fill="#eef4fb" stroke="#c9d7e3" stroke-width="2"/><text x="1390" y="601" font-size="22" fill="#152d45" font-weight="600" text-anchor="middle">결과 확인</text><text x="55" y="790" font-size="21" fill="#586c80" font-weight="400" text-anchor="start">자료를 복사한 것과 프로그램이 그 값을 적용한 것을 각각 확인합니다.</text></g></svg>