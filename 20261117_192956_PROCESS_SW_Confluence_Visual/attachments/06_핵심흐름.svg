<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="830" viewBox="0 0 1600 830"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1766ad"/></marker></defs><rect width="1600" height="830" fill="#f5f8fc"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="55" y="62" font-size="34" fill="#152d45" font-weight="700" text-anchor="start">한 점을 설계 · Stage · Scanner 좌표로 표현합니다</text><text x="55" y="104" font-size="21" fill="#586c80" font-weight="400" text-anchor="start">좌표값을 비교할 때 기준점, 축 방향, 단위와 보정 성분을 함께 봅니다.</text><rect x="60" y="170" width="450" height="440" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="575" y="170" width="450" height="440" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="1090" y="170" width="450" height="440" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><text x="85" y="215" font-size="27" fill="#152d45" font-weight="700" text-anchor="start">① 설계 좌표</text><rect x="115" y="285" width="280" height="190" rx="5" fill="#eaf4fb" stroke="#1766ad" stroke-width="2"/><path d="M155,285 V475" stroke="#b4cadb"/><path d="M195,285 V475" stroke="#b4cadb"/><path d="M235,285 V475" stroke="#b4cadb"/><path d="M275,285 V475" stroke="#b4cadb"/><path d="M315,285 V475" stroke="#b4cadb"/><path d="M355,285 V475" stroke="#b4cadb"/><path d="M115,323 H395" stroke="#b4cadb"/><path d="M115,361 H395" stroke="#b4cadb"/><path d="M115,399 H395" stroke="#b4cadb"/><path d="M115,437 H395" stroke="#b4cadb"/><path d="M102,475 H128 M115,462 V488" stroke="#bd4c55" stroke-width="3"/><circle cx="315" cy="360" r="9" fill="#1766ad"/><text x="322" y="344" font-size="20" fill="#1766ad" font-weight="400" text-anchor="start">설계점</text><text x="85" y="565" font-size="22" fill="#586c80" font-weight="400" text-anchor="start">Cell 위치 · 회전 · 설계점</text><text x="600" y="215" font-size="27" fill="#152d45" font-weight="700" text-anchor="start">② Stage 기준</text><path d="M650,490 L945,490" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M650,490 L650,280" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M702,445 H728 M715,432 V458" stroke="#bd4c55" stroke-width="3"/><circle cx="860" cy="350" r="9" fill="#0b8894"/><path d="M715,445 L860,350" fill="none" stroke="#0b8894" stroke-width="3" marker-end="url(#arrow)"/><text x="735" y="420" font-size="20" fill="#0b8894" font-weight="400" text-anchor="start">위치 · 자세 · 보정</text><text x="600" y="565" font-size="22" fill="#586c80" font-weight="400" text-anchor="start">AK 기준 · 단위 mm</text><text x="1115" y="215" font-size="27" fill="#152d45" font-weight="700" text-anchor="start">③ Head 기준</text><rect x="1160" y="285" width="280" height="210" rx="5" fill="#e9f7f5" stroke="#0b8894" stroke-width="2"/><path d="M1287,390 H1313 M1300,377 V403" stroke="#bd4c55" stroke-width="3"/><circle cx="1385" cy="335" r="9" fill="#0b8894"/><path d="M1300,390 L1385,335" fill="none" stroke="#0b8894" stroke-width="3" marker-end="url(#arrow)"/><text x="1242" y="440" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">Head 중심</text><text x="1115" y="565" font-size="22" fill="#586c80" font-weight="400" text-anchor="start">GX / GY · Field 범위</text><path d="M515,390 L565,390" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M1030,390 L1080,390" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="650" width="1470" height="90" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="60" y="668" width="6" height="54" rx="3" fill="#c17b1c"/><text x="85" y="692" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">Encoder Count는 이동 시점 기준이며, GX/GY 위치와 같은 숫자가 아닙니다.</text><text x="55" y="790" font-size="21" fill="#586c80" font-weight="400" text-anchor="start">고정 설치 Offset · Head/Cell 보정 · 동적 Review 보정을 구분해 한 번씩 반영합니다.</text></g></svg>