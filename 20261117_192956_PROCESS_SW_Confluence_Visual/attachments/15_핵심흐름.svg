<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="830" viewBox="0 0 1600 830"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1766ad"/></marker></defs><rect width="1600" height="830" fill="#f5f8fc"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="55" y="62" font-size="34" fill="#152d45" font-weight="700" text-anchor="start">증상에서 실패한 단계를 찾고, 같은 조건으로 다시 확인합니다</text><text x="55" y="104" font-size="21" fill="#586c80" font-weight="400" text-anchor="start">값 하나만 보지 않고 입력 · 중간값 · 상태 · 결과를 나란히 비교합니다.</text><rect x="60" y="185" width="345" height="185" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="60" y="203" width="6" height="149" rx="3" fill="#c17b1c"/><text x="85" y="227" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">증상</text><text x="85" y="267" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">언제 / 어떤 대상인가</text><path d="M410,275 L440,275" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="450" y="185" width="345" height="185" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="450" y="203" width="6" height="149" rx="3" fill="#1766ad"/><text x="475" y="227" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">입력</text><text x="475" y="267" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">Recipe · 모드 · 단위</text><path d="M800,275 L830,275" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="840" y="185" width="345" height="185" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="840" y="203" width="6" height="149" rx="3" fill="#1766ad"/><text x="865" y="227" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">중간 처리</text><text x="865" y="267" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">Snapshot · 좌표 · 요청</text><path d="M1190,275 L1220,275" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="1230" y="185" width="345" height="185" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="1230" y="203" width="6" height="149" rx="3" fill="#1766ad"/><text x="1255" y="227" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">결과</text><text x="1255" y="267" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">응답 · 판정 · 저장</text><rect x="60" y="470" width="700" height="215" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="60" y="488" width="6" height="179" rx="3" fill="#c17b1c"/><text x="85" y="512" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">값이 이상할 때</text><text x="85" y="552" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">표시값의 출처와 단위 확인</text><text x="85" y="584" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">정상 0 / 미측정 / 파싱 실패 구분</text><text x="85" y="616" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">고정 Offset과 동적 보정 분리</text><rect x="830" y="470" width="700" height="215" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="830" y="488" width="6" height="179" rx="3" fill="#238364"/><text x="855" y="512" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">동작이 멈췄을 때</text><text x="855" y="552" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">대기 Step과 상대 신호 확인</text><text x="855" y="584" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">명령 접수 / Busy / 완료 구분</text><text x="855" y="616" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">원인 조치 후 같은 조건 재확인</text><text x="55" y="790" font-size="21" fill="#586c80" font-weight="400" text-anchor="start">다른 기판이나 이전 회차의 결과가 섞이지 않았는지 먼저 확인합니다.</text></g></svg>