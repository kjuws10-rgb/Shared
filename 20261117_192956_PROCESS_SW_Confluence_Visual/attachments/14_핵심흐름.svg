<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="830" viewBox="0 0 1600 830"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1766ad"/></marker></defs><rect width="1600" height="830" fill="#f5f8fc"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="55" y="62" font-size="34" fill="#152d45" font-weight="700" text-anchor="start">기능 하나를 데이터의 처음부터 끝까지 연결합니다</text><text x="55" y="104" font-size="21" fill="#586c80" font-weight="400" text-anchor="start">화면만 완성한 상태와 실제 저장·실행·결과가 연결된 상태를 구분합니다.</text><rect x="60" y="190" width="345" height="190" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="60" y="208" width="6" height="154" rx="3" fill="#1766ad"/><text x="85" y="232" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">입력</text><text x="85" y="272" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">정의 · 단위 · 범위</text><path d="M410,285 L440,285" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="450" y="190" width="345" height="190" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="450" y="208" width="6" height="154" rx="3" fill="#1766ad"/><text x="475" y="232" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">데이터</text><text x="475" y="272" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">파일 · 캐시 · Snapshot</text><path d="M800,285 L830,285" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="840" y="190" width="345" height="190" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="840" y="208" width="6" height="154" rx="3" fill="#1766ad"/><text x="865" y="232" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">실행</text><text x="865" y="272" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">장치 요청 · 상태</text><path d="M1190,285 L1220,285" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="1230" y="190" width="345" height="190" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="1230" y="208" width="6" height="154" rx="3" fill="#1766ad"/><text x="1255" y="232" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">결과</text><text x="1255" y="272" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">측정 · 보정 · 이력</text><rect x="60" y="465" width="1470" height="240" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><text x="90" y="510" font-size="27" fill="#152d45" font-weight="700" text-anchor="start">기능 변경 시 같이 확인할 것</text><circle cx="110" cy="560" r="6" fill="#238364"/><text x="135" y="568" font-size="23" fill="#586c80" font-weight="400" text-anchor="start">정상 입력과 경계값</text><circle cx="110" cy="594" r="6" fill="#238364"/><text x="135" y="602" font-size="23" fill="#586c80" font-weight="400" text-anchor="start">저장 후 재로딩</text><circle cx="110" cy="628" r="6" fill="#238364"/><text x="135" y="636" font-size="23" fill="#586c80" font-weight="400" text-anchor="start">실패 · 취소 · 중복 요청</text><circle cx="110" cy="662" r="6" fill="#238364"/><text x="135" y="670" font-size="23" fill="#586c80" font-weight="400" text-anchor="start">재시작 후 적용 상태</text><text x="960" y="575" font-size="25" fill="#152d45" font-weight="600" text-anchor="start">검토할 대상은 현재 기능과</text><text x="960" y="618" font-size="25" fill="#152d45" font-weight="600" text-anchor="start">실제로 연결되는 데이터입니다.</text><text x="55" y="790" font-size="21" fill="#586c80" font-weight="400" text-anchor="start">화면 → 데이터 → 장치 → 결과의 어느 연결이 빠졌는지 확인합니다.</text></g></svg>