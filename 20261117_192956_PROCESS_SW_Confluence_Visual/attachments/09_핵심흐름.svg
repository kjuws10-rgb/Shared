l(#arrow)"/><text x="1100" y="477" font-size="22" fill="#238364" font-weight="600" text-anchor="middle">수신 상태 / 결과</text><path d="M770,595 L160,595" fill="none" stroke="#238364" stroke-width="3" marker-end="url(#arrow)"/><text x="465" y="577" font-size="22" fill="#238364" font-weight="600" text-anchor="middle">완료 · 실패 · Timeout 판정</text><text x="920" y="690" font-size="23" fill="#c17b1c" font-weight="700" text-anchor="start">오래된 캐시와 늦은 결과를 구분</text><text x="55" y="790" font-size="21" fill="#586c80" font-weight="400" text-anchor="start">요청 식별자 · 기판 · Point · 송수신 시각 · 상태 유효시간을 함께 확인합니다.</text></g></svg>