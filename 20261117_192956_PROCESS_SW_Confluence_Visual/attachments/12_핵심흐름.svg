<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="830" viewBox="0 0 1600 830"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1766ad"/></marker></defs><rect width="1600" height="830" fill="#f5f8fc"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="55" y="62" font-size="34" fill="#152d45" font-weight="700" text-anchor="start">정지 · 장치 정리 · Reset을 나누어 확인합니다</text><text x="55" y="104" font-size="21" fill="#586c80" font-weight="400" text-anchor="start">Reset으로 알람 목록을 비운 뒤에도 원인과 실제 장치 상태는 따로 확인합니다.</text><rect x="60" y="195" width="345" height="185" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="60" y="213" width="6" height="149" rx="3" fill="#1766ad"/><text x="85" y="237" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">정지 요청</text><text x="85" y="277" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">Stop / 취소 전달</text><path d="M410,285 L440,285" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="450" y="195" width="345" height="185" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="450" y="213" width="6" height="149" rx="3" fill="#1766ad"/><text x="475" y="237" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">실행 중단</text><text x="475" y="277" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">스레드 · Task · Queue</text><path d="M800,285 L830,285" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="840" y="195" width="345" height="185" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="840" y="213" width="6" height="149" rx="3" fill="#c17b1c"/><text x="865" y="237" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">장치 상태 확인</text><text x="865" y="277" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">축 · 출력 · I/F 신호</text><path d="M1190,285 L1220,285" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="1230" y="195" width="345" height="185" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="1230" y="213" width="6" height="149" rx="3" fill="#1766ad"/><text x="1255" y="237" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">필요한 Reset</text><text x="1255" y="277" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">대상 상태만 초기화</text><rect x="60" y="485" width="700" height="200" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="60" y="503" width="6" height="164" rx="3" fill="#c17b1c"/><text x="85" y="527" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">알람 Reset</text><text x="85" y="567" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">현재 알람 목록을 초기화</text><text x="85" y="599" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">원인 해소와 물리 출력 차단을 보장하지 않음</text><rect x="830" y="485" width="700" height="200" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="830" y="503" width="6" height="164" rx="3" fill="#238364"/><text x="855" y="527" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">재개 전 확인</text><text x="855" y="567" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">상대 신호 · 장치 상태 · 처리 구간 대조</text><text x="855" y="599" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">기판과 미완료 작업을 확인한 뒤 재개</text><text x="55" y="790" font-size="21" fill="#586c80" font-weight="400" text-anchor="start">프로그램의 Stop 반환과 설비의 안전 정지 완료를 같은 증거로 취급하지 않습니다.</text></g></svg>