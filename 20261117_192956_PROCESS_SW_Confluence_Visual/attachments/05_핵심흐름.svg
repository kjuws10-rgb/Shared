<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="830" viewBox="0 0 1600 830"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1766ad"/></marker></defs><rect width="1600" height="830" fill="#f5f8fc"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="55" y="62" font-size="34" fill="#152d45" font-weight="700" text-anchor="start">Recipe 저장과 이번 가공에 적용하는 값은 다릅니다</text><text x="55" y="104" font-size="21" fill="#586c80" font-weight="400" text-anchor="start">화면 값이 실행 Snapshot으로 들어가는 지점을 확인합니다.</text><rect x="60" y="170" width="400" height="220" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="60" y="188" width="6" height="184" rx="3" fill="#1766ad"/><text x="85" y="212" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">Recipe</text><text x="85" y="252" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">모델 / Cell / 가공 패턴</text><text x="85" y="284" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">Head별 Laser · Scanner 조건</text><text x="85" y="316" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">SELECT / SAVE</text><rect x="60" y="455" width="400" height="180" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="60" y="473" width="6" height="144" rx="3" fill="#c17b1c"/><text x="85" y="497" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">장비 설정 · 보정</text><text x="85" y="537" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">Option · Motor 설정</text><text x="85" y="569" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">Align / Review Offset</text><rect x="610" y="280" width="400" height="230" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="610" y="298" width="6" height="194" rx="3" fill="#0b8894"/><text x="635" y="322" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">실행 조건 합성</text><text x="635" y="362" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">선택 Recipe 사본</text><text x="635" y="394" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">설정 우선순위 반영</text><text x="635" y="426" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">현재 가공용 값 고정</text><rect x="1160" y="280" width="360" height="230" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="1160" y="298" width="6" height="194" rx="3" fill="#238364"/><text x="1185" y="322" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">가공 준비</text><text x="1185" y="362" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">좌표와 Head 계획</text><text x="1185" y="394" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">Script 생성 / 업로드</text><text x="1185" y="426" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">적용 상태 확인</text><path d="M470,280 L600,365" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M470,540 L600,430" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M1020,395 L1150,395" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#arrow)"/><text x="1160" y="590" font-size="23" fill="#586c80" font-weight="400" text-anchor="start">PPID 수신·매칭과</text><text x="1160" y="626" font-size="23" fill="#586c80" font-weight="400" text-anchor="start">로컬 Recipe 선택은 별도 단계</text><text x="55" y="790" font-size="21" fill="#586c80" font-weight="400" text-anchor="start">값을 저장한 위치, 선택한 Recipe, 이미 생성한 실행 조건을 각각 구분합니다.</text></g></svg>