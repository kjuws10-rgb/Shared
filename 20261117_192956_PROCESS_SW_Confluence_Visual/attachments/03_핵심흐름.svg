<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="830" viewBox="0 0 1600 830"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1766ad"/></marker></defs><rect width="1600" height="830" fill="#f5f8fc"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="55" y="62" font-size="34" fill="#152d45" font-weight="700" text-anchor="start">편집값 · 준비값 · 결과는 서로 다른 수명을 가집니다</text><text x="55" y="104" font-size="21" fill="#586c80" font-weight="400" text-anchor="start">화면에서 값을 바꾸는 시점과 장비가 사용하는 값을 고정하는 시점이 다릅니다.</text><rect x="60" y="185" width="390" height="190" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="60" y="203" width="6" height="154" rx="3" fill="#1766ad"/><text x="85" y="227" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">편집 · 저장</text><text x="85" y="267" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">Recipe / Setting</text><text x="85" y="299" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">사용자가 수정하는 값</text><text x="85" y="331" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">파일과 메모리 캐시</text><rect x="600" y="185" width="390" height="190" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="600" y="203" width="6" height="154" rx="3" fill="#0b8894"/><text x="625" y="227" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">실행 준비</text><text x="625" y="267" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">Recipe 사본 + 장비 설정</text><text x="625" y="299" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">유효한 Review Offset</text><text x="625" y="331" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">가공용 Snapshot 고정</text><rect x="1140" y="185" width="390" height="190" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="1140" y="203" width="6" height="154" rx="3" fill="#238364"/><text x="1165" y="227" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">실행 · 결과</text><text x="1165" y="267" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">Head 계획 / Script</text><text x="1165" y="299" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">진행 상태 / 측정 결과</text><text x="1165" y="331" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">기판 단위 이력</text><path d="M460,275 L590,275" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#arrow)"/><text x="520" y="244" font-size="20" fill="#1766ad" font-weight="700" text-anchor="middle">준비</text><path d="M1000,275 L1130,275" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#arrow)"/><text x="1065" y="244" font-size="20" fill="#1766ad" font-weight="700" text-anchor="middle">실행</text><rect x="60" y="465" width="1470" height="220" rx="18" fill="#eaf2fb" stroke="#c9d7e3" stroke-width="2"/><text x="90" y="508" font-size="27" fill="#152d45" font-weight="700" text-anchor="start">다음 작업에 반영되는 경로</text><rect x="100" y="540" width="330" height="110" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="100" y="558" width="6" height="74" rx="3" fill="#238364"/><text x="125" y="582" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">Review 결과</text><text x="125" y="622" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">측정과 판정 보존</text><rect x="600" y="540" width="330" height="110" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="600" y="558" width="6" height="74" rx="3" fill="#c17b1c"/><text x="625" y="582" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">보정 후보 / 적용본</text><text x="625" y="622" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">값 검증과 저장</text><rect x="1100" y="540" width="330" height="110" rx="18" fill="#ffffff" stroke="#c9d7e3" stroke-width="2"/><rect x="1100" y="558" width="6" height="74" rx="3" fill="#0b8894"/><text x="1125" y="582" font-size="25" fill="#152d45" font-weight="700" text-anchor="start">다음 준비</text><text x="1125" y="622" font-size="20" fill="#586c80" font-weight="400" text-anchor="start">새 조건으로 다시 생성</text><path d="M440,595 L590,595" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M940,595 L1090,595" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#arrow)"/><text x="55" y="790" font-size="21" fill="#586c80" font-weight="400" text-anchor="start">화면 표시 성공 · 파일 저장 성공 · 장비 적용 완료는 각각 확인합니다.</text></g></svg>