<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-labelledby="title desc"><title id="title">A3Drilling 실행과 로그 분기의 통합 구조</title><desc id="desc">기존 가공 및 Review 경로를 유지하면서 CLogManager가 PM 이력, 동기 파일, Interface 및 Sequence 큐, Alarm 기록을 제공하는 구조입니다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.6"/></marker><style>text{font-family:'Segoe UI','Malgun Gothic',sans-serif;fill:#17324d;font-size:16px}.h{font-size:25px;font-weight:700}.sub{font-size:13px;fill:#52677b}.n{fill:#f3f8fd;stroke:#b9cbde;stroke-width:1.5}.q{fill:#edf4ff;stroke:#6e9ad3;stroke-width:1.6}.p{fill:#eff8f3;stroke:#72a98b;stroke-width:1.6}.warn{fill:#fff7e9;stroke:#d7a54e;stroke-width:1.5}.e{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}</style></defs><rect width="1240" height="820" fill="#fff"/><text class="h" x="36" y="44">A3Drilling · 실행은 유지하고 기록 경로를 연결</text><text class="sub" x="36" y="69">master 334b359 · 비교 28764c9 · CLogManager.cs 추가만 포함 · 실제 설비 실행 검증 아님</text><rect x="28" y="90" width="1184" height="183" rx="12" fill="#f5faf7"/><text x="44" y="118" font-weight="700">기존 실행 · 데이터 경로 (이 비교에서 파일 변경 없음)</text><g><rect class="p" x="46" y="142" width="220" height="78" rx="8"/><text x="65" y="173">JHMI · Recipe · Setting</text><text class="sub" x="65" y="197">Cell / Model / Shot / Beam</text><rect class="p" x="342" y="142" width="238" height="78" rx="8"/><text x="361" y="173">Head · Masking · 계획</text><text class="sub" x="361" y="197">MOF / Review / Sampling</text><rect class="p" x="655" y="142" width="205" height="78" rx="8"/><text x="674" y="173">Station · Vision</text><text class="sub" x="674" y="197">가공 / 측정 / 상태</text><rect class="p" x="930" y="142" width="256" height="78" rx="8"/><text x="949" y="173">ReviewResult · Offset</text><text class="sub" x="949" y="197">Product 연결 · 실제 데이터</text><path class="e" d="M266 181H340"/><path class="e" d="M580 181H653"/><path class="e" d="M860 181H928"/></g><rect class="q" x="435" y="314" width="370" height="86" rx="10"/><text x="490" y="347" font-weight="700">CLogManager 구현 추가</text><text class="sub" x="466" y="374">기존 이벤트의 기록/조회 · 제어 재실행 없음</text><path class="e dash" d="M156 220V291H435V343"/><path class="e dash" d="M758 220V312"/><path class="e dash" d="M1058 220V291H805V343"/><text class="sub" x="166" y="260">변경 이력</text><text class="sub" x="770" y="268">시퀀스·통신</text><rect class="n" x="42" y="323" width="284" height="70" rx="8"/><text x="62" y="352">UI 클릭 · PM 세션</text><text class="sub" x="62" y="375">PM은 이력 성공 후 LOCK 변경</text><path class="e" d="M326 357H433"/><rect class="n" x="894" y="323" width="298" height="70" rx="8"/><text x="915" y="352">CAppStartup / CManager</text><text class="sub" x="915" y="375">공유 관리자 주입 · 종료 시 drain</text><path class="e" d="M894 357H807"/><g><rect class="n" x="42" y="450" width="245" height="88" rx="8"/><text x="60" y="480">동기 Trace · PM JSON</text><text class="sub" x="60" y="506">파일별 잠금 / 임시파일 교체</text><rect class="q" x="342" y="450" width="250" height="88" rx="8"/><text x="360" y="480">Interface 파일별 큐</text><text class="sub" x="360" y="506">16,384항목 · 문자열 16MiB</text><rect class="q" x="648" y="450" width="250" height="88" rx="8"/><text x="668" y="480">Sequence 단일 큐</text><text class="sub" x="668" y="506">16,384이벤트 · 한국어 투영</text><rect class="n" x="950" y="450" width="242" height="88" rx="8"/><text x="970" y="480">Alarm JSONL</text><text class="sub" x="970" y="506">상위 Alarm worker가 호출</text><path class="e" d="M505 400V427H164V448"/><path class="e" d="M555 400V427H467V448"/><path class="e" d="M685 400V427H773V448"/><path class="e" d="M735 400V418H1071V448"/></g><rect class="n" x="286" y="588" width="668" height="64" rx="8"/><text x="399" y="615" font-weight="700">날짜별 Log 파일 → 이력 / 읽기 화면</text><text class="sub" x="359" y="638">PM · Recipe History · Alarm HISTORY/TREND · Log Viewer</text><path class="e" d="M164 538V571H386V586"/><path class="e" d="M467 538V586"/><path class="e" d="M773 538V586"/><path class="e" d="M1071 538V571H853V586"/><rect class="warn" x="42" y="692" width="1150" height="84" rx="9"/><text x="62" y="722" font-weight="700">확인 필요: 저장 성공 · 큐 접수 · 실제 동작 성공은 서로 다른 상태</text><text class="sub" x="62" y="748">동기 로그 실패의 호출자 전파 / 큐 포화·쓰기 실패의 유실 / 민감 설정 값 마스킹 / 디스크 보존 정책</text><text class="sub" x="44" y="801">실선: 연결·저장 경로   점선: 기존 이벤트 기록 분기   운영 CSV·실제 로그·인증정보 원문은 포함하지 않음</text></svg>