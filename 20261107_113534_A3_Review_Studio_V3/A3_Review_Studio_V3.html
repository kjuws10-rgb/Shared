eak-inside:avoid}table{font-size:8pt}th,td{padding:6px}.table-wrap{overflow:visible}.cards{gap:8px}.hidden{display:table-row!important}.mock-body{grid-template-columns:1fr 1fr}.source-table{font-size:7pt}a{color:inherit}footer{font-size:8pt}}\np,li,summary{overflow-wrap:anywhere}.card{min-width:0;overflow-wrap:anywhere}.card summary{cursor:pointer}.card p:last-child{margin-bottom:0}section{min-width:0}.table-wrap{max-width:100%}#current-comparison th{white-space:normal}#current-count{margin-left:auto}#align-key-manual b{display:inline;margin:0}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cheader>\u003cdiv class=\"eyebrow\">A3 LD · REVIEW STUDIO V3 / 상세 설명과 조작 설계\u003c/div>\u003ch1>회의 정리와 현재 기능 비교\u003cbr>리뷰 측정·보정 상세 개선안 V3\u003c/h1>\u003cp>평가 작업자가 결과를 보고, 필요한 점을 다시 측정하고, 보정값을 확인·적용·복원하는 흐름을 연결하기 위한 검토서입니다.\u003c/p>\u003cdiv class=\"meta\">수신·분석일 2026-11-06 · 회의 일시·참석자 미제공 · 사용자 지정 A3Drilling master · 3a6b021a 읽기 전용 검토 · 제품 수정·장비 실행 없음\u003c/div>\u003cp class=\"no-print\">\u003ca href=\"#\" data-sim-view=\"workspace\" style=\"display:inline-block;background:#fff;color:#075d71;padding:10px 18px;text-decoration:none;border-radius:5px;font-weight:700\">V3 시뮬레이터에서 직접 조작하기 →\u003c/a>\u003c/p>\u003c/header>\n\u003cnav aria-label=\"문서 목차\">\u003ca href=\"#summary\">핵심 결론\u003c/a>\u003ca href=\"#meeting\">회의 요지\u003c/a>\u003ca href=\"#current\">현재 구현\u003c/a>\u003ca href=\"#critical\">선행 점검\u003c/a>\u003ca href=\"#ui\">화면 제안\u003c/a>\u003ca href=\"#correction\">보정 계약\u003c/a>\u003ca href=\"#backlog\">개선 항목\u003c/a>\u003ca href=\"#roadmap\">진행 순서\u003c/a>\u003ca href=\"#questions\">미결 사항\u003c/a>\u003ca href=\"#sources\">근거\u003c/a>\u003ca href=\"#v2-operating-course\">상세 조작 순서\u003c/a>\u003ca href=\"#v2-button-contract\">버튼·상태\u003c/a>\u003ca href=\"#v2-number-example\">수치·그림\u003c/a>\u003ca href=\"#v2-failure-recovery\">오류 복구\u003c/a>\u003c/nav>\n\u003cmain>\n\u003csection id=\"summary\">\u003ch2>01. 가장 필요한 개선은 작업 흐름의 연결입니다\u003c/h2>\u003cp class=\"lead\">결과 불러오기 → 위치·편차 확인 → 선택 재측정 → 보정 전후 비교 → 한 번 적용 → 새 가공 검증·복원\u003c/p>\u003cp>현재도 측정과 보정의 핵심 기능은 있습니다. 우선 과제는 \u003cb>기존 기능을 한 작업공간으로 연결하고, 같은 결과가 같은 의미로 계산·표시·저장되도록 만드는 것\u003c/b>입니다. 결과 표시 키, CSV의 판정·보간 정책, 적용 버전과 중복 보호를 함께 정리해야 합니다.\u003c/p>\u003cdiv class=\"cards\">\u003cdiv class=\"card\">\u003cb>먼저: 데이터·보정 정확성\u003c/b>Cell 식별, 실측/보간 구분, 같은 계산 규칙, 단위·증감·누적, 적용 버전과 복원\u003c/div>\u003cdiv class=\"card\">\u003cb>다음: 평가 UI 편의\u003c/b>맵·표·분포·카메라/선택점 상세 연동, 저장 결과 열기, NG 선택 재검, 일괄 편집\u003c/div>\u003cdiv class=\"card\">\u003cb>확장: 자동 연계·평가\u003c/b>Shift 추종, 독립 검증점, Distortion 자동 수신, 8 Head 좌표 검산과 데이터 패키지\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"meeting\">\u003ch2>02. 회의 내용 정리\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>번호\u003c/th>\u003cth>주제\u003c/th>\u003cth>정리한 내용\u003c/th>\u003cth>확실성·유의점\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>01\u003c/td>\u003ctd>\u003cb>리뷰 평가를 먼저 편하게\u003c/b>\u003c/td>\u003ctd>다른 기능보다 리뷰 측정·보정과 UI를 우선 개선해 공정 평가 데이터를 뽑기 쉽게 한다.\u003c/td>\u003ctd>반복해 드러난 요구\u003c/td>\u003c/tr>\u003ctr>\u003ctd>02\u003c/td>\u003ctd>\u003cb>결과를 쉽게 다시 열기\u003c/b>\u003c/td>\u003ctd>저장 결과를 불러와 기판·Cell·Head별 위치와 X/Y 편차를 함께 본다. 결과표만으로 위치를 추정하는 작업을 줄인다.\u003c/td>\u003ctd>명확한 방향\u003c/td>\u003c/tr>\u003ctr>\u003ctd>03\u003c/td>\u003ctd>\u003cb>한 화면에서 위치 확인·재측정\u003c/b>\u003c/td>\u003ctd>선택 → 위치 확인 → 수동 이동 또는 측정 → 결과 비교를 이어서 한다. 이동만/현재 위치 측정/이동 후 측정은 구분한다.\u003c/td>\u003ctd>명확한 방향\u003c/td>\u003c/tr>\u003ctr>\u003ctd>04\u003c/td>\u003ctd>\u003cb>2D 맵과 분포도\u003c/b>\u003c/td>\u003ctd>Cell·Shot 위치의 색상 맵과 목표 중심 대비 편차 산점도를 제공한다. Head는 색 또는 필터로 구분한다.\u003c/td>\u003ctd>명확한 방향\u003c/td>\u003c/tr>\u003ctr>\u003ctd>05\u003c/td>\u003ctd>\u003cb>부분·일괄 처리\u003c/b>\u003c/td>\u003ctd>문제점·범위를 선택해 재검 또는 보정값 대체를 쉽게 한다. 원측정 NG를 지우는 동작과 보정 후보 편집을 구분한다.\u003c/td>\u003ctd>일괄 조작 요구 / 처리 정책 미확정\u003c/td>\u003c/tr>\u003ctr>\u003ctd>06\u003c/td>\u003ctd>\u003cb>보정값의 의미 설명\u003c/b>\u003c/td>\u003ctd>실측 편차, 보간 결과, 기존 누적 보정, 이번 증감, 적용 후 총량을 나눠 보여준다. 부호·단위·Flip도 확인할 수 있어야 한다.\u003c/td>\u003ctd>혼동 해소 요구\u003c/td>\u003c/tr>\u003ctr>\u003ctd>07\u003c/td>\u003ctd>\u003cb>Apply와 되돌리기\u003c/b>\u003c/td>\u003ctd>잘못 적용하거나 두 번 적용했을 때 이전 상태를 복원하고 어떤 결과를 사용했는지 추적한다.\u003c/td>\u003ctd>명확한 필요 / 복원 방식은 제안 필요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>08\u003c/td>\u003ctd>\u003cb>샘플링을 단순하게\u003c/b>\u003c/td>\u003ctd>처음·중간·끝, 몇 줄 검사 같은 기본 설정을 쉽게 고른다. 라인 직접 선택은 고급 설정으로 분리할 수 있다.\u003c/td>\u003ctd>단순화 방향 / 구체 선택지는 미확정\u003c/td>\u003c/tr>\u003ctr>\u003ctd>09\u003c/td>\u003ctd>\u003cb>Shift와 실제 검사 위치\u003c/b>\u003c/td>\u003ctd>가공 Shift 후 이동한 영역을 검사할 수 있어야 한다는 취지가 있다. Shift 단위·범위·초기화·수동 Apply 동작을 명확히 한다.\u003c/td>\u003ctd>추종·초기화 계약 확인 필요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>\u003cb>Distortion 연계·Align Key 수동 수신\u003c/b>\u003c/td>\u003ctd>AUTO 연계와 함께, 가공 SW에서 사용자가 원하는 시점에 Distortion 인터페이스의 \u003cb>Align Key 4개 글로벌 X/Y 좌표(mm)\u003c/b>를 수동으로 받을 수 있어야 한다. 기존 결과를 읽는 동작과 새 측정을 요청한 뒤 받는 동작은 구분한다.\u003c/td>\u003ctd>수동 4점 수신·화면 요구 / 새 측정 요청의 상대 계약 확인\u003c/td>\u003c/tr>\u003ctr>\u003ctd>11\u003c/td>\u003ctd>\u003cb>8 Head 좌표·Field 검산\u003c/b>\u003c/td>\u003ctd>AK 기준, 기판/스캐너 중심, Masking·Head 배정을 포함한 계산 결과를 독립적으로 대조한다.\u003c/td>\u003ctd>검산 방향\u003c/td>\u003c/tr>\u003ctr>\u003ctd>12\u003c/td>\u003ctd>\u003cb>결과·설정·Script 이력\u003c/b>\u003c/td>\u003ctd>Recipe/Setting 변경 전후, 적용한 보정과 검사 결과, 최종 Script·가공 조건을 함께 추적한다.\u003c/td>\u003ctd>운영 개선 방향\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"small\">노랑·빨강의 5/7µm, “FIRST”, “원빔”으로 들리는 표현, 자동 초기화 시점, Stage/가공 신호 순서는 원문만으로 확정하지 않았습니다. 단순히 NG 색상을 바꾸는 일과 원측정 값을 보존하면서 보정 후보를 대체하는 일도 분리했습니다.\u003c/p>\u003c/section>\n\n\u003csection id=\"current\">\u003ch2>03. 현재 기능·불편한 점·개선 화면을 구체적으로 비교합니다\u003c/h2>\u003cp class=\"lead\">이미 있는 기능은 연결을 다듬고, 부족한 보호·설명·복구 기능을 보완합니다.\u003c/p>\u003cp>기준 원본은 사용자 지정 \u003cb>A3Drilling master · 3a6b021a\u003c/b>입니다. 기존 보고서의 Drilling2 cab181f4는 V1을 작성한 당시 기준으로만 구분하며 현재 원본으로 전제하지 않습니다. 아래 “현재”는 이 Commit의 실제 UI 연결·계산·저장·Config를 읽어 확인한 범위입니다.\u003c/p>\u003cp>각 행은 \u003cb>현재 할 수 있는 일 → 작업자가 겪을 제약 → 구체적으로 보일 화면/버튼\u003c/b> 순서입니다. 행 아래 상세 카드를 펼치면 조작 순서·수치 예·완료 기준·진행 차단 조건을 확인할 수 있습니다.\u003c/p>\u003cdiv class=\"note\">\u003cb>먼저 알아둘 현재 차이\u003c/b>Simple/Rough/Fine 전용 Apply는 이미 있습니다. 공통 CSV 보조 함수와 실제 REVIEW 버튼 연결은 별개입니다. Distortion AUTO 코드와 LastLoad/Process 맵도 현재 존재하지만 Stage ABLE/COMPLETE 두 입력은 배포 맵에서 미할당입니다. “기능 없음” 하나로 묶어 설명하면 개선 범위를 잘못 잡게 됩니다.\u003c/div>\u003cdiv class=\"pillrow no-print\">\u003clabel>기능 비교표 검색 \u003cinput id=\"current-search\" type=\"search\" placeholder=\"예: NG 재검, CSV, 복원, Distortion\">\u003c/label>\u003cspan id=\"current-count\" class=\"small\" aria-live=\"polite\">18 / 18개 항목\u003c/span>\u003cbutton type=\"button\" id=\"current-expand\">상세 설명 모두 펼치기\u003c/button>\u003cbutton type=\"button\" id=\"current-collapse\">상세 설명 모두 접기\u003c/button>\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable id=\"current-comparison\">\u003cthead>\u003ctr>\u003cth>항목\u003c/th>\u003cth>현재 동작·상태\u003c/th>\u003cth>불편하거나 부족한 부분\u003c/th>\u003cth>구체적인 개선 화면·조작\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>R01\u003c/b>\u003cbr>결과 식별과 맵 표시\u003c/td>\u003ctd>\u003cspan class=\"tag\">표시 제약 확인\u003c/span>\u003cbr>A3Drilling 결과 Matrix의 열 키는 Head+Shot이며 같은 설계 Y 행에 여러 Cell이 겹치면 표시가 충돌할 수 있습니다. Cell 포함 CSV 원본 손실로 확정한 것은 아닙니다.\u003c/td>\u003ctd>같은 Head·Shot이라도 Cell이 다른 결과가 표시상 겹칠 수 있어 어느 점을 재검하는지 혼동할 수 있습니다.\u003c/td>\u003ctd>맵·표·선택점 상세에 같은 고유 키 표시 / Cell 전체·Head 필터 / 원시 값·이력 열기\u003cbr>\u003ca href=\"#detail-R01\">동작 예와 완료 기준 펼쳐보기\u003c/a>\u003cbr>\u003cbutton type=\"button\" data-sim-view=\"workspace\">R01 기능 직접 체험 →\u003c/button>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>R02\u003c/b>\u003cbr>CSV 조회·적용 연결 정비\u003c/td>\u003ctd>\u003cspan class=\"tag\">일부 연결·추가 필요\u003c/span>\u003cbr>공통 CSV Load/Calculate/Apply/Save 보조 함수는 있으나 Execute는 확인·상태 보고만 하며 REVIEW에서는 공통 버튼을 숨깁니다. 전용 보정 Apply 경로와 구분해야 합니다.\u003c/td>\u003ctd>보조 함수가 존재해도 실제 버튼이 호출하지 않으면 작업자는 파일을 불러와 같은 경로로 재적용할 수 없습니다. 미연결 CSV의 NG 외 판정 재구성도 먼저 정비해야 합니다.\u003c/td>\u003ctd>CSV 파일 선택 → 파일 검증 결과 → 조회 전용/후보 사용 상태 표시 → 같은 계산 엔진으로 후보 생성\u003cbr>\u003ca href=\"#detail-R02\">동작 예와 완료 기준 펼쳐보기\u003c/a>\u003cbr>\u003cbutton type=\"button\" data-sim-view=\"data\">R02 기능 직접 체험 →\u003c/button>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>R03\u003c/b>\u003cbr>보정 계산 계약 통일\u003c/td>\u003ctd>\u003cspan class=\"tag\">계산 경로 차이\u003c/span>\u003cbr>직접 FINE은 Cell/X열별 Y Lagrange입니다. 공통 CSV 보조 계산은 Head/X 선형·끝값 고정 경로로, 연결 전에 계산 계약을 맞춰야 합니다.\u003c/td>\u003ctd>파일과 실시간 경로의 그룹/보간이 다르면 중간 위치의 후보가 달라집니다. 같은 입력의 결과가 왜 달라졌는지 화면만으로 알기 어렵습니다.\u003c/td>\u003ctd>계산 방식 선택 / 보간 정책 표시 / 사용 앵커·출처·B/Δ/F 미리보기 / 동일 입력 비교\u003cbr>\u003ca href=\"#detail-R03\">동작 예와 완료 기준 펼쳐보기\u003c/a>\u003cbr>\u003cbutton type=\"button\" data-sim-view=\"correction\">R03 기능 직접 체험 →\u003c/button>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>R04\u003c/b>\u003cbr>증감·누적·중복 적용\u003c/td>\u003ctd>\u003cspan class=\"tag\">일부 보호 있음\u003c/span>\u003cbr>직접 FINE의 _offsetApplied와 Rough 행별 Applied가 현재 실행의 중복 누적을 막습니다. 파일에는 영속 Candidate/Run/BaseRevision 계약이 없습니다.\u003c/td>\u003ctd>현재 세션의 중복 방지와 앱을 다시 열거나 파일을 다시 읽은 뒤의 영속 중복 방지는 범위가 다릅니다. 저장 파일에는 적용 출처/기준 버전을 충분히 재구성할 정보가 없습니다.\u003c/td>\u003ctd>검증 후 한 번 적용 / 후보 ID·기준 Revision·적용 Revision 표시 / 중복·오래된 후보 차단 사유\u003cbr>\u003ca href=\"#detail-R04\">동작 예와 완료 기준 펼쳐보기\u003c/a>\u003cbr>\u003cbutton type=\"button\" data-sim-view=\"versions\">R04 기능 직접 체험 →\u003c/button>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>R05\u003c/b>\u003cbr>보간 후 최종 범위 검사\u003c/td>\u003ctd>\u003cspan class=\"tag\">검사 범위 확장\u003c/span>\u003cbr>직접 FINE은 전체 실측 OK·유한수·중복 앵커를 검사합니다. 이 검사와 최종 Scanner 합성 좌표·증감/누적 범위의 공통 검사는 다른 범위입니다.\u003c/td>\u003ctd>측정 OK를 최종 좌표 합격으로 오해하기 쉽습니다. 보간 휨·누적 Offset·Shift가 합쳐진 X/Y 경계와 선택 밖 값까지 확인해야 합니다.\u003c/td>\u003ctd>후보 검증 / 최대 증감·총량 / 최종 Scanner 좌표·Field 초과 점 목록 / 실패점 선택 이동\u003cbr>\u003ca href=\"#detail-R05\">동작 예와 완료 기준 펼쳐보기\u003c/a>\u003cbr>\u003cbutton type=\"button\" data-sim-view=\"correction\">R05 기능 직접 체험 →\u003c/button>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>R06\u003c/b>\u003cbr>단위·원시 판정·오차 Level\u003c/td>\u003ctd>\u003cspan class=\"tag\">핵심 구현 있음\u003c/span>\u003cbr>Target−Hole에 CameraResolution·nResolution을 곱해 mm로 환산하고 Flip으로 보정축을 변환합니다. 원시값과 최종 보정 표시를 같은 값으로 읽으면 안 됩니다.\u003c/td>\u003ctd>현재 공차 합격/불합격만으로는 오차 크기의 수준을 세분해 볼 수 없습니다. 사용자 요구: tolerance는 유지하고 별도의 네 Level과 지표·범위·이름을 편집합니다.\u003c/td>\u003ctd>기존 X/Y tolerance + 별도 Level 지표·경계 3개·이름 4개 편집 / Level 색 맵·표·상세·범례\u003cbr>\u003ca href=\"#detail-R06\">동작 예와 완료 기준 펼쳐보기\u003c/a>\u003cbr>\u003cbutton type=\"button\" data-sim-view=\"workspace\">R06 기능 직접 체험 →\u003c/button>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>R07\u003c/b>\u003cbr>리뷰 평가 작업공간\u003c/td>\u003ctd>\u003cspan class=\"tag\">기존 기능 연결 개선\u003c/span>\u003cbr>Review 프리뷰·결과표·ONE SHOT 이동/측정과 전용 Rough/Fine UI가 있습니다. 평가자가 같은 점의 결과→재측정→후보 비교를 이어보는 구성을 보완합니다.\u003c/td>\u003ctd>맵·검사·보정 기능이 각각 있어도 같은 결과를 선택한 채 다음 작업으로 이동하는 맥락과 단계 상태가 잘 보여야 합니다.\u003c/td>\u003ctd>문제점 선택 → 같은 화면의 가상 카메라/좌표 → 이동/측정 → 선택점 보정으로 보내기\u003cbr>\u003ca href=\"#detail-R07\">동작 예와 완료 기준 펼쳐보기\u003c/a>\u003cbr>\u003cbutton type=\"button\" data-sim-view=\"workspace\">R07 기능 직접 체험 →\u003c/button>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>R08\u003c/b>\u003cbr>선택 재측정\u003c/td>\u003ctd>\u003cspan class=\"tag\">기존 재검 기능 있음\u003c/span>\u003cbr>ONE SHOT의 이동/현재측정/이동후측정, Rough NG_RETRY, Fine NG 재시작·행 진행 경로가 있습니다. 통합 선택 범위·완료/잔여·거래 상태 표시는 추가 UI 검토 대상입니다.\u003c/td>\u003ctd>NG 재검·행 재개가 있다는 사실과 임의 선택점의 실행 범위/중지 잔여/거래 응답을 한 곳에서 확인하는 작업감은 다릅니다. P2P와 Flying의 확대 범위를 특히 설명해야 합니다.\u003c/td>\u003ctd>선택 범위 확인 / P2P·Flying / 시작·일시정지·재개·중지 / 완료·남은 대상 / 잔여 재시도\u003cbr>\u003ca href=\"#detail-R08\">동작 예와 완료 기준 펼쳐보기\u003c/a>\u003cbr>\u003cbutton type=\"button\" data-sim-view=\"workspace\">R08 기능 직접 체험 →\u003c/button>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>R09\u003c/b>\u003cbr>공간 맵·편차 산점도\u003c/td>\u003ctd>\u003cspan class=\"tag\">기존 맵·통계 확장\u003c/span>\u003cbr>결과표·Glass/Cell 프리뷰·AUTO NG 위치 강조와 통계가 있습니다. 공간 위치와 µm 편차 분포를 한 선택 키로 연결하는 표현을 확장합니다.\u003c/td>\u003ctd>기판 어디가 나쁜지와 목표 대비 어떤 방향으로 벗어났는지가 표 하나에서 섞일 수 있습니다. 미측정/ERROR를 정상 원점으로 그리면 안 됩니다.\u003c/td>\u003ctd>Glass 전체 → Cell 상세 / 판정·출처·Head 색 / 공간 맵과 µm 산점도 연동 선택\u003cbr>\u003ca href=\"#detail-R09\">동작 예와 완료 기준 펼쳐보기\u003c/a>\u003cbr>\u003cbutton type=\"button\" data-sim-view=\"workspace\">R09 기능 직접 체험 →\u003c/button>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>R10\u003c/b>\u003cbr>기준 Shot 복사·다중 후보 편집\u003c/td>\u003ctd>\u003cspan class=\"tag\">입력 기능·이력 확장\u003c/span>\u003cbr>Simple의 범위 Key-in 대체와 전용 Rough/Fine 적용이 있습니다. 임의 수동 후보의 참고점·사유·전후값을 원측정 판정과 분리해 관리하는 UI를 제안합니다.\u003c/td>\u003ctd>사용자가 알고 있는 기준 Shot을 지정해 여러 대상에 같은 최종 보정을 넣는 작업이 필요합니다. 자동 최근접 추정 대신 기준 key를 직접 선택하고 복사 출처를 보존합니다.\u003c/td>\u003ctd>실측 OK 기준 Shot 직접 선택 / 대상 다중 선택 / 기준 F 동일 복사 / 참조 key·사유·B/Δ/F 확인 / 재검증\u003cbr>\u003ca href=\"#detail-R10\">동작 예와 완료 기준 펼쳐보기\u003c/a>\u003cbr>\u003cbutton type=\"button\" data-sim-view=\"correction\">R10 기능 직접 체험 →\u003c/button>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>R11\u003c/b>\u003cbr>샘플링 미리보기\u003c/td>\u003ctd>\u003cspan class=\"tag\">기존 선정 기능 있음\u003c/span>\u003cbr>Rough FIRST/CENTER/LAST 대표 Y와 Head/Head+Cell 범위, Fine Cell별 1/3/5/7줄 선정이 있습니다. 실제 선정 키와 물리 스캔 범위를 먼저 보여주는 설명이 필요합니다.\u003c/td>\u003ctd>3줄이라는 설정만으로 실제 점 수·Cell/Head 선정 단위·Masking 제외·물리 스캔 횟수를 이해하기 어렵습니다.\u003c/td>\u003ctd>Fine 줄 수·Rough 대표·범위 / 고급 행 선택 / 선정점 미리보기 / 계획 실행\u003cbr>\u003ca href=\"#detail-R11\">동작 예와 완료 기준 펼쳐보기\u003c/a>\u003cbr>\u003cbutton type=\"button\" data-sim-view=\"plan\">R11 기능 직접 체험 →\u003c/button>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>R12\u003c/b>\u003cbr>Apply 상태·선택 복원\u003c/td>\u003ctd>\u003cspan class=\"tag\">저장 있음·복원 제안\u003c/span>\u003cbr>시간별 새 Offset 파일과 다음 준비의 최신 파일 병합이 있습니다. Offset INIT은 0 초기화이며, 이전 버전을 새 활성 버전으로 복원하는 UI와는 다릅니다.\u003c/td>\u003ctd>활성값 저장 후 이미 준비된 Script가 그대로일 수 있습니다. INIT은 0 초기화이므로 잘못 Apply한 값을 되돌리는 기능으로 쓰기 어렵습니다.\u003c/td>\u003ctd>활성/준비 Revision 나란히 표시 / 이전 버전으로 복원 / 사유 입력 / 다음 준비 재생성\u003cbr>\u003ca href=\"#detail-R12\">동작 예와 완료 기준 펼쳐보기\u003c/a>\u003cbr>\u003cbutton type=\"button\" data-sim-view=\"versions\">R12 기능 직접 체험 →\u003c/button>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>R13\u003c/b>\u003cbr>Shift AUTO 전환·검사 추종\u003c/td>\u003ctd>\u003cspan class=\"tag\">정책 확인 필요\u003c/span>\u003cbr>가공 Shift는 Scanner/Encoder 쪽 합성에 들어가지만 Review 목표식에는 직접 포함되지 않습니다. 검사 추종과 전환별 유지/초기화는 별도 정책으로 확인합니다.\u003c/td>\u003ctd>기본은 Shift를 지우지 않고 유지 가공 여부를 확인해야 합니다. 사용자 요구: Shift=0 직행 / 비제로 유지 확인 / 별도 양산 옵션에서만 자동 초기화 후 AUTO를 구분합니다.\u003c/td>\u003ctd>AUTO 진입 / 비제로 Shift 유지·취소 확인 / 별도 양산 자동 초기화 옵션 / 전환 전후 이력 / 검사 추종·Field 검토\u003cbr>\u003ca href=\"#detail-R13\">동작 예와 완료 기준 펼쳐보기\u003c/a>\u003cbr>\u003cbutton type=\"button\" data-sim-view=\"labs\">R13 기능 직접 체험 →\u003c/button>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>R14\u003c/b>\u003cbr>보정 효과 평가\u003c/td>\u003ctd>\u003cspan class=\"tag\">평가 흐름 확장\u003c/span>\u003cbr>측정 결과 저장과 다음 준비의 Offset 반영이 있습니다. 같은 홀 재촬영과 새 가공·독립점의 보정 효과 평가를 따로 읽는 UI가 필요합니다.\u003c/td>\u003ctd>이미 가공한 홀을 다시 찍어도 위치는 바뀌지 않습니다. 앵커 적합과 새 가공의 전체/독립 위치 개선을 혼동하지 않아야 합니다.\u003c/td>\u003ctd>다음 가공 준비 → 새 가공 검증 / 가공점·홀드아웃 전후 RMS·공차 내 개수 / 기존 RAW 보존\u003cbr>\u003ca href=\"#detail-R14\">동작 예와 완료 기준 펼쳐보기\u003c/a>\u003cbr>\u003cbutton type=\"button\" data-sim-view=\"versions\">R14 기능 직접 체험 →\u003c/button>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>R15\u003c/b>\u003cbr>데이터 패키지·내보내기\u003c/td>\u003ctd>\u003cspan class=\"tag\">저장 계약 확장\u003c/span>\u003cbr>ReviewResult CSV·ReviewOffset CSV·실행/설정 이력이 별도로 존재합니다. Run의 RAW·후보·기준/적용 버전·Script를 묶어 재구성하는 계약을 제안합니다.\u003c/td>\u003ctd>결과 CSV만 있으면 어떤 설정·기준 Offset·최종 Script로 만든 결과인지 한 번에 재구성하기 어렵습니다.\u003c/td>\u003ctd>현재 결과 CSV / 전체 세션 JSON / 파일 복원 검증 / Run·RAW·후보·버전·설정·Script·로그 묶음\u003cbr>\u003ca href=\"#detail-R15\">동작 예와 완료 기준 펼쳐보기\u003c/a>\u003cbr>\u003cbutton type=\"button\" data-sim-view=\"data\">R15 기능 직접 체험 →\u003c/button>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>R16\u003c/b>\u003cbr>Distortion 연계·AK 4점 수동 수신\u003c/td>\u003ctd>\u003cspan class=\"tag\">수동 읽기 있음·요구 화면 구체화\u003c/span>\u003cbr>Distortion AUTO Prepare→Load→Calculate→Save와 DoReady 연결 코드가 있습니다. 수동 Load Data도 장치 LastLoad 주소에서 AK1~AK4와 선택 DK를 직접 읽습니다. 이 수동 읽기 자체가 새 측정을 요청하는 것은 아닙니다. Stage ABLE/COMPLETE는 USE=0·UNASSIGNED입니다.\u003c/td>\u003ctd>장치 값을 다시 읽은 시각과 그 값이 실제 측정된 시각은 다를 수 있습니다. 사용자는 AK 4점의 절대 글로벌 좌표와 보정 편차를 혼동하지 않고 필요한 순간의 결과를 확인할 수 있어야 합니다. Stage 두 입력은 주소 계약·활성화·실기 거래 검증이 필요합니다.\u003c/td>\u003ctd>AUTO 단계 모니터와 별도로, 가공 SW에서 원하는 시점에 AK1~AK4의 글로벌 X/Y(mm) 8개를 수동 수신하고 취득시각·출처·유효 상태를 함께 확인하는 화면을 구성합니다. 기존 결과 읽기와 새 측정 요청 후 수신을 구분합니다.\u003cbr>\u003ca href=\"#align-key-manual\">AK 4점 수동 수신 화면·절차 보기\u003c/a>\u003cbr>\u003ca href=\"#detail-R16\">AUTO 동작 예와 완료 기준\u003c/a>\u003cbr>\u003cbutton type=\"button\" data-sim-view=\"labs\">AUTO 가상 흐름 체험 →\u003c/button>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>R17\u003c/b>\u003cbr>8 Head 검산·원빔 평가\u003c/td>\u003ctd>\u003cspan class=\"tag\">독립 평가 추가\u003c/span>\u003cbr>AK·Cell 회전·Head 배정·Masking·Offset·Shift를 포함하는 좌표 계산이 있습니다. 독립 기대값과 최종 Script를 대조하는 평가 화면을 보완합니다.\u003c/td>\u003ctd>원빔 평가를 레시피 생성·스캐너별 설정·가공/리뷰 대상까지 연결하는 추가 검토가 필요합니다. 기본 DOE=4의 단위·의미를 임의로 결정하면 안 됩니다.\u003c/td>\u003ctd>레시피 생성 Offset·원빔 옵션 / 모든 스캐너 기본 DOE=4 표시 / 스캐너별 유효 원빔 조건 / 가공·리뷰 평가 대상 비교\u003cbr>\u003ca href=\"#detail-R17\">동작 예와 완료 기준 펼쳐보기\u003c/a>\u003cbr>\u003cbutton type=\"button\" data-sim-view=\"labs\">R17 기능 직접 체험 →\u003c/button>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>R18\u003c/b>\u003cbr>평가 속도·사용성·이력\u003c/td>\u003ctd>\u003cspan class=\"tag\">성능·이력 연결 검수\u003c/span>\u003cbr>일부 Review 계획·런타임 목록은 지연 생성·증분 갱신하며 설정/결과 이력도 존재합니다. 대용량 통합 화면과 동작 중 응답성은 실제 시나리오로 확인해야 합니다.\u003c/td>\u003ctd>대용량에서 화면 재생성·동기 저장이 Stop 클릭을 방해할 수 있습니다. 기존 지연 생성/증분 갱신을 살리면서 통합 UI의 실제 입력 반응과 전후 이력을 검수해야 합니다.\u003c/td>\u003ctd>10,000점 조회 / 50행 페이지 표·Canvas 맵 / 렌더시간 / 측정 중 Stop / 설정 전후 이력\u003cbr>\u003ca href=\"#detail-R18\">동작 예와 완료 기준 펼쳐보기\u003c/a>\u003cbr>\u003cbutton type=\"button\" data-sim-view=\"data\">R18 기능 직접 체험 →\u003c/button>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>항목별 상세 설명 · 필요한 항목을 펼쳐 읽으세요\u003c/h3>\u003cdiv class=\"cards\" style=\"grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))\">\u003cdetails class=\"card\" id=\"detail-R01\">\u003csummary>\u003cb>R01 · 결과 식별과 맵 표시 — 표시 제약 확인\u003c/b>\u003c/summary>\u003cp>\u003cb>현재 실제 가능한 일\u003c/b>A3Drilling 결과 Matrix의 열 키는 Head+Shot이며 같은 설계 Y 행에 여러 Cell이 겹치면 표시가 충돌할 수 있습니다. Cell 포함 CSV 원본 손실로 확정한 것은 아닙니다. \u003ca class=\"ref\" href=\"#S09\">S09\u003c/a> \u003ca class=\"ref\" href=\"#S01\">S01\u003c/a>\u003c/p>\u003cp>\u003cb>작업자에게 어떤 점이 어려운가요?\u003c/b>같은 Head·Shot이라도 Cell이 다른 결과가 표시상 겹칠 수 있어 어느 점을 재검하는지 혼동할 수 있습니다.\u003c/p>\u003cp>\u003cb>어떤 화면과 버튼으로 개선하나요?\u003c/b>맵·표·선택점 상세에 같은 고유 키 표시 / Cell 전체·Head 필터 / 원시 값·이력 열기\u003c/p>\u003cp>\u003cb>필요한 입력\u003c/b>Run ID + Cell + Head + Shot + Beam. 설계 위치 X/Y와 측정 상태도 함께 읽습니다.\u003c/p>\u003col>\u003cli>Cell 식별 충돌 검산 예제를 연 뒤 Cell 전체·Head H01로 조회합니다.\u003c/li>\u003cli>같은 Shot 번호의 두 행을 차례로 누르고 Cell·고유 키·편차가 각각 남는지 확인합니다.\u003c/li>\u003cli>하나를 재측정한 뒤 다른 Cell 결과와 시도 이력이 그대로인지 대조합니다.\u003c/li>\u003c/ol>\u003cp>\u003cb>개선 후 실제 사용 예\u003c/b>C1/H01/S1/B11과 C9/H01/S1/B11은 Head·Shot·설계 Y가 같아도 별도 결과입니다.\u003c/p>\u003cp>\u003cb>완료되었다고 판단할 기준\u003c/b>서로 다른 Cell의 결과가 같은 칸에 덮이지 않습니다.\u003c/p>\u003cp>\u003cb>실패하거나 진행을 막아야 할 조건\u003c/b>다른 Cell의 같은 Shot 번호를 하나로 합치지 않습니다. 같은 Run 안의 중복 고유 키 CSV는 불러오지 않습니다.\u003c/p>\u003c/details>\u003cdetails class=\"card\" id=\"detail-R02\">\u003csummary>\u003cb>R02 · CSV 조회·적용 연결 정비 — 일부 연결·추가 필요\u003c/b>\u003c/summary>\u003cp>\u003cb>현재 실제 가능한 일\u003c/b>공통 CSV Load/Calculate/Apply/Save 보조 함수는 있으나 Execute는 확인·상태 보고만 하며 REVIEW에서는 공통 버튼을 숨깁니다. 전용 보정 Apply 경로와 구분해야 합니다. \u003ca class=\"ref\" href=\"#S03\">S03\u003c/a> \u003ca class=\"ref\" href=\"#S07\">S07\u003c/a> \u003ca class=\"ref\" href=\"#S08\">S08\u003c/a> \u003ca class=\"ref\" href=\"#S22\">S22\u003c/a> \u003ca class=\"ref\" href=\"#S26\">S26\u003c/a>\u003c/p>\u003cp>\u003cb>작업자에게 어떤 점이 어려운가요?\u003c/b>보조 함수가 존재해도 실제 버튼이 호출하지 않으면 작업자는 파일을 불러와 같은 경로로 재적용할 수 없습니다. 미연결 CSV의 NG 외 판정 재구성도 먼저 정비해야 합니다.\u003c/p>\u003cp>\u003cb>어떤 화면과 버튼으로 개선하나요?\u003c/b>CSV 파일 선택 → 파일 검증 결과 → 조회 전용/후보 사용 상태 표시 → 같은 계산 엔진으로 후보 생성\u003c/p>\u003cp>\u003cb>필요한 입력\u003c/b>CSV의 형식 버전, Recipe/Glass/Run, 완료 상태, 키, Judge, 원시 측정·좌표 단위와 값입니다.\u003c/p>\u003col>\u003cli>자료·이력에서 현재 결과를 CSV로 내보내어 파일 구조를 확인합니다.\u003c/li>\u003cli>정상 예제를 읽은 뒤 잘못된 Judge·중복 키 예제를 각각 검증합니다.\u003c/li>\u003cli>이전 결과 수와 Run을 비교해 실패한 읽기가 기존 작업을 덮지 않았는지 봅니다.\u003c/li>\u003c/ol>\u003cp>\u003cb>개선 후 실제 사용 예\u003c/b>다른 Recipe 예제는 내용을 살펴볼 수 있지만, 현재 Run의 정상 파일처럼 Apply할 수 없습니다. ERROR의 빈 오차는 0 µm로 바뀌지 않습니다.\u003c/p>\u003cp>\u003cb>완료되었다고 판단할 기준\u003c/b>오류가 0이나 OK로 바뀌지 않고 원래 작업을 보존합니다.\u003c/p>\u003cp>\u003cb>실패하거나 진행을 막아야 할 조건\u003c/b>허용하지 않는 Judge, 중복 키, OK/NG인데 비어 있는 오차는 거부합니다. 구형·다른 Recipe·부분 완료 파일은 조회하더라도 적용을 제한합니다.\u003c/p>\u003c/details>\u003cdetails class=\"card\" id=\"detail-R03\">\u003csummary>\u003cb>R03 · 보정 계산 계약 통일 — 계산 경로 차이\u003c/b>\u003c/summary>\u003cp>\u003cb>현재 실제 가능한 일\u003c/b>직접 FINE은 Cell/X열별 Y Lagrange입니다. 공통 CSV 보조 계산은 Head/X 선형·끝값 고정 경로로, 연결 전에 계산 계약을 맞춰야 합니다. \u003ca class=\"ref\" href=\"#S05\">S05\u003c/a> \u003ca class=\"ref\" href=\"#S06\">S06\u003c/a>\u003c/p>\u003cp>\u003cb>작업자에게 어떤 점이 어려운가요?\u003c/b>파일과 실시간 경로의 그룹/보간이 다르면 중간 위치의 후보가 달라집니다. 같은 입력의 결과가 왜 달라졌는지 화면만으로 알기 어렵습니다.\u003c/p>\u003cp>\u003cb>어떤 화면과 버튼으로 개선하나요?\u003c/b>계산 방식 선택 / 보간 정책 표시 / 사용 앵커·출처·B/Δ/F 미리보기 / 동일 입력 비교\u003c/p>\u003cp>\u003cb>필요한 입력\u003c/b>같은 Run의 유효한 실측 OK 앵커, Cell/X열과 설계 Y, 선택 범위, Lagrange 또는 선형 비교 정책입니다.\u003c/p>\u003col>\u003cli>정상 보정 예제를 열고 Fine 3줄 계획을 미리봅니다.\u003c/li>\u003cli>Fine 후보를 계산하고 실제 실측행과 중간 보간행의 출처를 비교합니다.\u003c/li>\u003cli>같은 입력으로 선형 비교 정책을 다시 계산해 중간값이 달라질 수 있음을 확인합니다.\u003c/li>\u003c/ol>\u003cp>\u003cb>개선 후 실제 사용 예\u003c/b>Cell1의 같은 X열에서 Y=0,1,2의 세 앵커를 사용하면 Y=1.5의 후보는 그 열의 앵커로만 계산합니다. Cell2의 근처 점을 끌어오지 않습니다.\u003c/p>\u003cp>\u003cb>완료되었다고 판단할 기준\u003c/b>같은 입력·정책은 같은 결과를 만들고 다른 Cell과 섞이지 않습니다.\u003c/p>\u003cp>\u003cb>실패하거나 진행을 막아야 할 조건\u003c/b>다른 Cell·X열을 임의로 섞지 않습니다. NG/ERROR 앵커, 중복·잘못된 Y, 현재 환산 조건과 다른 RAW는 적용 검증을 통과하지 못합니다.\u003c/p>\u003c/details>\u003cdetails class=\"card\" id=\"detail-R04\">\u003csummary>\u003cb>R04 · 증감·누적·중복 적용 — 일부 보호 있음\u003c/b>\u003c/summary>\u003cp>\u003cb>현재 실제 가능한 일\u003c/b>직접 FINE의 _offsetApplied와 Rough 행별 Applied가 현재 실행의 중복 누적을 막습니다. 파일에는 영속 Candidate/Run/BaseRevision 계약이 없습니다. \u003ca class=\"ref\" href=\"#S02\">S02\u003c/a> \u003ca class=\"ref\" href=\"#S20\">S20\u003c/a> \u003ca class=\"ref\" href=\"#S21\">S21\u003c/a>\u003c/p>\u003cp>\u003cb>작업자에게 어떤 점이 어려운가요?\u003c/b>현재 세션의 중복 방지와 앱을 다시 열거나 파일을 다시 읽은 뒤의 영속 중복 방지는 범위가 다릅니다. 저장 파일에는 적용 출처/기준 버전을 충분히 재구성할 정보가 없습니다.\u003c/p>\u003cp>\u003cb>어떤 화면과 버튼으로 개선하나요?\u003c/b>검증 후 한 번 적용 / 후보 ID·기준 Revision·적용 Revision 표시 / 중복·오래된 후보 차단 사유\u003c/p>\u003cp>\u003cb>필요한 입력\u003c/b>Candidate ID, 측정 Run, BaseRevision, 검증 결과와 현재 활성 Revision입니다.\u003c/p>\u003col>\u003cli>정상 흐름을 완료한 뒤 버전·검증에서 같은 후보 다시 적용을 누릅니다.\u003c/li>\u003cli>차단 메시지와 활성 버전·값이 바뀌지 않았는지 확인합니다.\u003c/li>\u003cli>브라우저 재시작 체험 뒤에도 같은 후보가 재적용되지 않는지 확인합니다.\u003c/li>\u003c/ol>\u003cp>\u003cb>개선 후 실제 사용 예\u003c/b>B=+10 µm에서 Δ=−2 µm를 적용하면 F=+8 µm입니다. 같은 후보를 또 눌러 +6 µm로 만들지 않습니다.\u003c/p>\u003cp>\u003cb>완료되었다고 판단할 기준\u003c/b>중복 클릭·재로드·오래된 기준 후보가 누적을 반복하지 않습니다.\u003c/p>\u003cp>\u003cb>실패하거나 진행을 막아야 할 조건\u003c/b>이미 적용한 후보, 다른 Run, 검증 후 설정이 바뀐 후보, 활성 기준이 달라진 오래된 후보는 적용하지 않습니다.\u003c/p>\u003c/details>\u003cdetails class=\"card\" id=\"detail-R05\">\u003csummary>\u003cb>R05 · 보간 후 최종 범위 검사 — 검사 범위 확장\u003c/b>\u003c/summary>\u003cp>\u003cb>현재 실제 가능한 일\u003c/b>직접 FINE은 전체 실측 OK·유한수·중복 앵커를 검사합니다. 이 검사와 최종 Scanner 합성 좌표·증감/누적 범위의 공통 검사는 다른 범위입니다. \u003ca class=\"ref\" href=\"#S05\">S05\u003c/a> \u003ca class=\"ref\" href=\"#S17\">S17\u003c/a> \u003ca class=\"ref\" href=\"#S18\">S18\u003c/a>\u003c/p>\u003cp>\u003cb>작업자에게 어떤 점이 어려운가요?\u003c/b>측정 OK를 최종 좌표 합격으로 오해하기 쉽습니다. 보간 휨·누적 Offset·Shift가 합쳐진 X/Y 경계와 선택 밖 값까지 확인해야 합니다.\u003c/p>\u003cp>\u003cb>어떤 화면과 버튼으로 개선하나요?\u003c/b>후보 검증 / 최대 증감·총량 / 최종 Scanner 좌표·Field 초과 점 목록 / 실패점 선택 이동\u003c/p>\u003cp>\u003cb>필요한 입력\u003c/b>모든 후보의 Δ/F, 기존값, Scanner 좌표, Shift, 증감·누적 한계와 Field 폭입니다.\u003c/p>\u003col>\u003cli>후보를 만든 뒤 수동 증감에 +500 µm 같은 과대한 가상값을 입력합니다.\u003c/li>\u003cli>수동 사유를 남기고 후보 검증을 눌러 초과 점·한계를 읽습니다.\u003c/li>\u003cli>정상값으로 다시 편집·검증하기 전에는 Apply가 진행되지 않음을 확인합니다.\u003c/li>\u003c/ol>\u003cp>\u003cb>개선 후 실제 사용 예\u003c/b>SIM Field 폭 5 mm는 중심 기준 X/Y ±2.5 mm입니다. 기존 X=2.49 mm에 +20 µm를 더하면 2.51 mm로 범위 밖입니다.\u003c/p>\u003cp>\u003cb>완료되었다고 판단할 기준\u003c/b>실측점이 정상이어도 최종 계산값이 한계를 넘으면 적용하지 않습니다.\u003c/p>\u003cp>\u003cb>실패하거나 진행을 막아야 할 조건\u003c/b>비수치·무한대, 축별 증가량·총량 초과, 최종 Scanner X/Y가 Field 밖인 후보는 적용을 막습니다. 선택 밖 기존 좌표도 최종 준비에서 검사합니다.\u003c/p>\u003c/details>\u003cdetails class=\"card\" id=\"detail-R06\">\u003csummary>\u003cb>R06 · 단위·원시 판정·오차 Level\u003c/b>\u003c/summary>\u003cp>\u003cb>현재 코드에서 확인한 범위\u003c/b>Target−Hole에 CameraResolution·nResolution을 곱해 mm로 환산하고 Flip으로 보정축을 변환합니다. 원시값과 최종 보정 표시를 같은 값으로 읽으면 안 됩니다. \u003ca class=\"ref\" href=\"#S15\">S15\u003c/a> \u003ca class=\"ref\" href=\"#S16\">S16\u003c/a> \u003ca class=\"ref\" href=\"#S22\">S22\u003c/a> \u003ca class=\"ref\" href=\"#S31\">S31\u003c/a> \u003ca class=\"ref\" href=\"#S32\">S32\u003c/a>\u003c/p>\u003cp>\u003cb>이번 사용자 요구와 개선 이유\u003c/b>현재 공차 합격/불합격만으로는 오차 크기의 수준을 세분해 볼 수 없습니다. 사용자 요구: tolerance는 유지하고 별도의 네 Level과 지표·범위·이름을 편집합니다. 목표 대비 측정 오차가 공차 안인지와 오차가 어느 수준인지는 서로 다른 정보입니다. 같은 OK라도 중심에 가까운 점과 공차 경계 가까운 점을 구분하고, 측정 단위·부호를 그대로 추적합니다.\u003c/p>\u003cp>\u003cb>개선 화면·버튼\u003c/b>기존 X/Y tolerance + 별도 Level 지표·경계 3개·이름 4개 편집 / Level 색 맵·표·상세·범례\u003c/p>\u003cp>\u003cb>입력\u003c/b>원시 Pixel·환산/Flip 스냅샷과 측정 ΔX/ΔY µm, 축별 공차, Level 지표(max 절댓값 또는 원형거리), 양수 오름차순 경계 세 개와 네 레벨 이름입니다.\u003c/p>\u003col>\u003cli>리뷰 작업공간의 레벨 범위·이름 편집에서 지표·양수 오름차순 경계 세 개·네 이름을 확인합니다.\u003c/li>\u003cli>색상을 오차수준으로 바꾸고 경계 수정 후 맵·표·선택점 상세·범례가 함께 바뀌는지 확인합니다.\u003c/li>\u003cli>같은 점의 원측정 Judge·RAW가 유지되고 ERROR/미측정은 등급 없음인지 확인합니다.\u003c/li>\u003cli>Pixel→mm→µm와 Flip 자체의 환산은 좌표·설비 실험실의 단위·Flip에서 별도로 확인합니다.\u003c/li>\u003c/ol>\u003cp>\u003cb>실제 사용 예\u003c/b>SIM 경계 2/5/10 µm에서 ΔX=4, ΔY=4이면 max 기준은 4 µm로 2단계이고, 원형거리는 약 5.66 µm로 3단계입니다. 실제 경계와 레벨 이름은 사용자가 수정합니다.\u003c/p>\u003cp>\u003cb>실행 후 결과\u003c/b>원측정 OK/NG는 유지한 채 표·선택점 상세·범례·Level 색상 맵에 오차 수준을 따로 표시합니다. Level 설정을 바꾸면 등급·표시만 새 범위로 계산합니다.\u003c/p>\u003cp>\u003cb>완료 기준\u003c/b>사용자 Level 범위에 따라 오차 수준이 달라져도 기존 축별 OK/NG 판정과 원시 측정은 보존됩니다.\u003c/p>\u003cp>\u003cb>진행 차단 조건·보존할 정보\u003c/b>경계가 비수치·0 이하·오름차순이 아니면 설정하지 않습니다. ERROR/UNMEASURED·빈 오차에는 등급을 만들지 않습니다. Level 색을 바꿨다고 원측정 Judge나 RAW를 바꾸지 않습니다.\u003c/p>\u003c/details>\u003cdetails class=\"card\" id=\"detail-R07\">\u003csummary>\u003cb>R07 · 리뷰 평가 작업공간 — 기존 기능 연결 개선\u003c/b>\u003c/summary>\u003cp>\u003cb>현재 실제 가능한 일\u003c/b>Review 프리뷰·결과표·ONE SHOT 이동/측정과 전용 Rough/Fine UI가 있습니다. 평가자가 같은 점의 결과→재측정→후보 비교를 이어보는 구성을 보완합니다. \u003ca class=\"ref\" href=\"#S10\">S10\u003c/a> \u003ca class=\"ref\" href=\"#S11\">S11\u003c/a> \u003ca class=\"ref\" href=\"#S25\">S25\u003c/a>\u003c/p>\u003cp>\u003cb>작업자에게 어떤 점이 어려운가요?\u003c/b>맵·검사·보정 기능이 각각 있어도 같은 결과를 선택한 채 다음 작업으로 이동하는 맥락과 단계 상태가 잘 보여야 합니다.\u003c/p>\u003cp>\u003cb>어떤 화면과 버튼으로 개선하나요?\u003c/b>문제점 선택 → 같은 화면의 가상 카메라/좌표 → 이동/측정 → 선택점 보정으로 보내기\u003c/p>\u003cp>\u003cb>필요한 입력\u003c/b>현재 Recipe/Glass/Run, 선택 키, 맵/표 필터, 활성 보정과 현재 가상 위치입니다.\u003c/p>\u003col>\u003cli>표 또는 맵에서 점 하나를 고릅니다.\u003c/li>\u003cli>우측 상세의 고유 키·설계좌표·현재위치·RAW를 확인합니다.\u003c/li>\u003cli>이동 후 측정을 실행하고 상태 단계·새 측정값·시도 이력을 차례로 확인합니다.\u003c/li>\u003c/ol>\u003cp>\u003cb>개선 후 실제 사용 예\u003c/b>NG 점을 선택해 이동 후 측정하면 새 시도가 추가되고 색·표·상세가 함께 갱신됩니다. 화면 이동 자체는 원측정 값을 바꾸지 않습니다.\u003c/p>\u003cp>\u003cb>완료되었다고 판단할 기준\u003c/b>이동·측정·비교에 필요한 정보가 한 작업 맥락에 모입니다.\u003c/p>\u003cp>\u003cb>실패하거나 진행을 막아야 할 조건\u003c/b>필터로 보이지 않게 된 점과 실제 선택 범위를 혼동하지 않습니다. 이동/측정 중 다른 Run을 읽거나 보정 기준을 바꾸는 충돌 작업은 완료·중지 후 진행합니다.\u003c/p>\u003c/details>\u003cdetails class=\"card\" id=\"detail-R08\">\u003csummary>\u003cb>R08 · 선택 재측정 — 기존 재검 기능 있음\u003c/b>\u003c/summary>\u003cp>\u003cb>현재 실제 가능한 일\u003c/b>ONE SHOT의 이동/현재측정/이동후측정, Rough NG_RETRY, Fine NG 재시작·행 진행 경로가 있습니다. 통합 선택 범위·완료/잔여·거래 상태 표시는 추가 UI 검토 대상입니다. \u003ca class=\"ref\" href=\"#S10\">S10\u003c/a> \u003ca class=\"ref\" href=\"#S27\">S27\u003c/a> \u003ca class=\"ref\" href=\"#S04\">S04\u003c/a>\u003c/p>\u003cp>\u003cb>작업자에게 어떤 점이 어려운가요?\u003c/b>NG 재검·행 재개가 있다는 사실과 임의 선택점의 실행 범위/중지 잔여/거래 응답을 한 곳에서 확인하는 작업감은 다릅니다. P2P와 Flying의 확대 범위를 특히 설명해야 합니다.\u003c/p>\u003cp>\u003cb>어떤 화면과 버튼으로 개선하나요?\u003c/b>선택 범위 확인 / P2P·Flying / 시작·일시정지·재개·중지 / 완료·남은 대상 / 잔여 재시도\u003c/p>\u003cp>\u003cb>필요한 입력\u003c/b>선택 키 또는 계획의 키 목록, P2P/Flying 방식, 속도, 같은 편차 유지/검출 회복 예제입니다.\u003c/p>\u003col>\u003cli>P2P로 여러 점을 골라 실행하고 진행 중 일시정지를 누릅니다.\u003c/li>\u003cli>완료 수가 멈춘 것을 확인한 뒤 재개하거나 중지합니다.\u003c/li>\u003cli>남은 대상만 재시도하여 이미 완료한 점의 측정 시도가 불필요하게 늘지 않는지 확인합니다.\u003c/li>\u003c/ol>\u003cp>\u003cb>개선 후 실제 사용 예\u003c/b>P2P 3점을 선택하면 3점입니다. 같은 행의 1점을 Flying으로 선택하면 그 Cell·Head·행의 제외되지 않은 점 전체로 확장됩니다.\u003c/p>\u003cp>\u003cb>완료되었다고 판단할 기준\u003c/b>선택·실행 범위·취소 후 남은 대상이 분명합니다.\u003c/p>\u003cp>\u003cb>실패하거나 진행을 막아야 할 조건\u003c/b>이미 실행 중인 작업을 중복 시작하지 않습니다. 일시정지 중에는 결과를 확정하지 않고, 중지 뒤 늦게 도착한 가상 응답도 완료 결과로 덮지 않습니다.\u003c/p>\u003c/details>\u003cdetails class=\"card\" id=\"detail-R09\">\u003csummary>\u003cb>R09 · 공간 맵·편차 산점도 — 기존 맵·통계 확장\u003c/b>\u003c/summary>\u003cp>\u003cb>현재 실제 가능한 일\u003c/b>결과표·Glass/Cell 프리뷰·AUTO NG 위치 강조와 통계가 있습니다. 공간 위치와 µm 편차 분포를 한 선택 키로 연결하는 표현을 확장합니다. \u003ca class=\"ref\" href=\"#S09\">S09\u003c/a> \u003ca class=\"ref\" href=\"#S11\">S11\u003c/a>\u003c/p>\u003cp>\u003cb>작업자에게 어떤 점이 어려운가요?\u003c/b>기판 어디가 나쁜지와 목표 대비 어떤 방향으로 벗어났는지가 표 하나에서 섞일 수 있습니다. 미측정/ERROR를 정상 원점으로 그리면 안 됩니다.\u003c/p>\u003cp>\u003cb>어떤 화면과 버튼으로 개선하나요?\u003c/b>Glass 전체 → Cell 상세 / 판정·출처·Head 색 / 공간 맵과 µm 산점도 연동 선택\u003c/p>\u003cp>\u003cb>필요한 입력\u003c/b>설계 X/Y mm의 공간 위치, 측정 ΔX/ΔY µm, 판정·Head·출처 필터입니다.\u003c/p>\u003col>\u003cli>Glass 전체에서 Cell을 선택해 상세로 내려갑니다.\u003c/li>\u003cli>판정 색과 Head 색을 전환하고 범례·축 단위를 읽습니다.\u003c/li>\u003cli>산점도의 튀는 점을 눌러 표·상세에서 같은 키인지 확인합니다.\u003c/li>\u003c/ol>\u003cp>\u003cb>개선 후 실제 사용 예\u003c/b>Cell 중앙에 있는 점도 편차 산점도에서는 +4/−3 µm 위치에 나타납니다. 두 그림의 점 위치는 서로 다른 뜻입니다.\u003c/p>\u003cp>\u003cb>완료되었다고 판단할 기준\u003c/b>위치와 편차가 혼동되지 않고 단위·축·Head를 확인할 수 있습니다.\u003c/p>\u003cp>\u003cb>실패하거나 진행을 막아야 할 조건\u003c/b>미측정/ERROR를 산점도 원점의 정상점으로 찍지 않습니다. 보간·수동 후보의 색을 원측정 OK 색으로 오인하게 합치지 않습니다.\u003c/p>\u003c/details>\u003cdetails class=\"card\" id=\"detail-R10\">\u003csummary>\u003cb>R10 · 기준 Shot 복사·다중 후보 편집\u003c/b>\u003c/summary>\u003cp>\u003cb>현재 코드에서 확인한 범위\u003c/b>Simple의 범위 Key-in 대체와 전용 Rough/Fine 적용이 있습니다. 임의 수동 후보의 참고점·사유·전후값을 원측정 판정과 분리해 관리하는 UI를 제안합니다. \u003ca class=\"ref\" href=\"#S04\">S04\u003c/a> \u003ca class=\"ref\" href=\"#S07\">S07\u003c/a>\u003c/p>\u003cp>\u003cb>이번 사용자 요구와 개선 이유\u003c/b>사용자가 알고 있는 기준 Shot을 지정해 여러 대상에 같은 최종 보정을 넣는 작업이 필요합니다. 자동 최근접 추정 대신 기준 key를 직접 선택하고 복사 출처를 보존합니다. 작업자가 신뢰하는 기준 Shot을 알고 있을 때 자동으로 가장 가까운 점을 고르는 대신 그 기준을 명시적으로 지정해야 합니다. 복사한 최종 보정값과 원래 측정 사실을 분리해 남깁니다.\u003c/p>\u003cp>\u003cb>개선 화면·버튼\u003c/b>실측 OK 기준 Shot 직접 선택 / 대상 다중 선택 / 기준 F 동일 복사 / 참조 key·사유·B/Δ/F 확인 / 재검증\u003c/p>\u003cp>\u003cb>입력\u003c/b>직접 고른 기준 실측 OK Shot의 고유 키·후보 F, 다중 선택 대상 Shot 키, 복사 사유와 수동 후보 포함 확인입니다.\u003c/p>\u003col>\u003cli>기준 Shot의 보정값을 선택점에 똑같이 복사 패널에서 기준 Cell·기준 실측 Shot을 직접 지정하고 복사 사유를 입력합니다.\u003c/li>\u003cli>다른 대상 Shot들을 다중 선택한 뒤 복사대상·값검토를 눌러 기준 key·F·대상 수와 전후값을 확인합니다.\u003c/li>\u003cli>같은F값으로복사를 눌러 대상 F가 기준 F와 같고 각 Δ·MANUAL/참조 key·사유가 남는지 확인한 뒤 후보를 다시 검증합니다.\u003c/li>\u003c/ol>\u003cp>\u003cb>실제 사용 예\u003c/b>기준 F=+8/−2 µm를 복사할 때 대상 A의 B=+10/−3이면 Δ=−2/+1, 대상 B의 B=+3/+4이면 Δ=+5/−6입니다. 두 대상의 최종 F는 모두 +8/−2로 같습니다.\u003c/p>\u003cp>\u003cb>실행 후 결과\u003c/b>모든 대상의 최종 F가 기준 Shot의 F와 같아집니다. 대상마다 B가 다르면 Δ=기준 F−대상 B로 각각 계산하고 출처 MANUAL·참조 key·사유를 기록합니다. 원측정/Judge/RAW는 보존합니다.\u003c/p>\u003cp>\u003cb>완료 기준\u003c/b>직접 선택한 기준 Shot의 최종 보정값이 다중 대상에 동일하게 복사되고 원측정·Judge·참조 key·사유가 남습니다.\u003c/p>\u003cp>\u003cb>진행 차단 조건·보존할 정보\u003c/b>기준을 지정하지 않거나 기준이 유효한 실측 OK가 아닌 경우, 대상이 없거나 사유가 없는 경우는 복사하지 않습니다. 자동 최근접 점 추정으로 기준을 대신하지 않으며 복사 후 범위 검증을 다시 합니다.\u003c/p>\u003c/details>\u003cdetails class=\"card\" id=\"detail-R11\">\u003csummary>\u003cb>R11 · 샘플링 미리보기 — 기존 선정 기능 있음\u003c/b>\u003c/summary>\u003cp>\u003cb>현재 실제 가능한 일\u003c/b>Rough FIRST/CENTER/LAST 대표 Y와 Head/Head+Cell 범위, Fine Cell별 1/3/5/7줄 선정이 있습니다. 실제 선정 키와 물리 스캔 범위를 먼저 보여주는 설명이 필요합니다. \u003ca class=\"ref\" href=\"#S12\">S12\u003c/a> \u003ca class=\"ref\" href=\"#S13\">S13\u003c/a> \u003ca class=\"ref\" href=\"#S28\">S28\u003c/a>\u003c/p>\u003cp>\u003cb>작업자에게 어떤 점이 어려운가요?\u003c/b>3줄이라는 설정만으로 실제 점 수·Cell/Head 선정 단위·Masking 제외·물리 스캔 횟수를 이해하기 어렵습니다.\u003c/p>\u003cp>\u003cb>어떤 화면과 버튼으로 개선하나요?\u003c/b>Fine 줄 수·Rough 대표·범위 / 고급 행 선택 / 선정점 미리보기 / 계획 실행\u003c/p>\u003cp>\u003cb>필요한 입력\u003c/b>Fine 1/3/5/7줄 또는 고급 행 번호, Rough FIRST/CENTER/LAST, Head/Head+Cell 범위입니다.\u003c/p>\u003col>\u003cli>Cell1·Fine·3줄로 선정점 미리보기를 누릅니다.\u003c/li>\u003cli>행 칩·실제 키 목록·총수에서 Masking 제외를 확인합니다.\u003c/li>\u003cli>고급에서 1,4,8을 입력해 기본 선정과 비교한 뒤 실행합니다.\u003c/li>\u003c/ol>\u003cp>\u003cb>개선 후 실제 사용 예\u003c/b>Cell1의 8×8 예제에서 3줄은 3개 행의 대상점입니다. 첫 행에 Masking이 있으면 단순 3×8과 실제 개수가 다를 수 있습니다.\u003c/p>\u003cp>\u003cb>완료되었다고 판단할 기준\u003c/b>설정의 줄 수와 물리 획득 횟수가 다를 수 있음을 확인합니다.\u003c/p>\u003cp>\u003cb>실패하거나 진행을 막아야 할 조건\u003c/b>선정 대상이 없거나 행 번호 형식이 잘못되면 실행하지 않습니다. Masking된 점은 대상에서 제외하며 계획의 줄 수를 물리 스캔 횟수로 단정하지 않습니다.\u003c/p>\u003c/details>\u003cdetails class=\"card\" id=\"detail-R12\">\u003csummary>\u003cb>R12 · Apply 상태·선택 복원 — 저장 있음·복원 제안\u003c/b>\u003c/summary>\u003cp>\u003cb>현재 실제 가능한 일\u003c/b>시간별 새 Offset 파일과 다음 준비의 최신 파일 병합이 있습니다. Offset INIT은 0 초기화이며, 이전 버전을 새 활성 버전으로 복원하는 UI와는 다릅니다. \u003ca class=\"ref\" href=\"#S02\">S02\u003c/a> \u003ca class=\"ref\" href=\"#S19\">S19\u003c/a>\u003c/p>\u003cp>\u003cb>작업자에게 어떤 점이 어려운가요?\u003c/b>활성값 저장 후 이미 준비된 Script가 그대로일 수 있습니다. INIT은 0 초기화이므로 잘못 Apply한 값을 되돌리는 기능으로 쓰기 어렵습니다.\u003c/p>\u003cp>\u003cb>어떤 화면과 버튼으로 개선하나요?\u003c/b>활성/준비 Revision 나란히 표시 / 이전 버전으로 복원 / 사유 입력 / 다음 준비 재생성\u003c/p>\u003cp>\u003cb>필요한 입력\u003c/b>활성 Revision, 준비된 Revision, 후보·Script 식별, 복원 대상과 사유입니다.\u003c/p>\u003col>\u003cli>정상 후보 적용 후 상단 활성/가공 준비 버전을 비교합니다.\u003c/li>\u003cli>다음 가공 준비를 실행하여 Script의 버전과 식별을 확인합니다.\u003c/li>\u003cli>이전 버전 복원 후 다시 준비가 필요한지 확인하고 새 복원 기록을 읽습니다.\u003c/li>\u003c/ol>\u003cp>\u003cb>개선 후 실제 사용 예\u003c/b>REV-A로 Script를 준비한 뒤 REV-B를 저장하면 활성은 B, 준비는 A입니다. 다음 준비를 실행해야 준비도 B가 됩니다.\u003c/p>\u003cp>\u003cb>완료되었다고 판단할 기준\u003c/b>복원은 기록 삭제가 아니며 적용 효력 시점을 구분합니다.\u003c/p>\u003cp>\u003cb>실패하거나 진행을 막아야 할 조건\u003c/b>복원 사유가 없으면 진행하지 않습니다. 활성 보정과 Script 기준이 다르면 새 가공 검증 전에 다시 준비해야 합니다.\u003c/p>\u003c/details>\u003cdetails class=\"card\" id=\"detail-R13\">\u003csummary>\u003cb>R13 · Shift AUTO 전환·검사 추종\u003c/b>\u003c/summary>\u003cp>\u003cb>현재 코드에서 확인한 범위\u003c/b>가공 Shift는 Scanner/Encoder 쪽 합성에 들어가지만 Review 목표식에는 직접 포함되지 않습니다. 검사 추종과 전환별 유지/초기화는 별도 정책으로 확인합니다. \u003ca class=\"ref\" href=\"#S14\">S14\u003c/a> \u003ca class=\"ref\" href=\"#S17\">S17\u003c/a> \u003ca class=\"ref\" href=\"#S18\">S18\u003c/a> \u003ca class=\"ref\" href=\"#S29\">S29\u003c/a> \u003ca class=\"ref\" href=\"#S30\">S30\u003c/a>\u003c/p>\u003cp>\u003cb>이번 사용자 요구와 개선 이유\u003c/b>기본은 Shift를 지우지 않고 유지 가공 여부를 확인해야 합니다. 사용자 요구: Shift=0 직행 / 비제로 유지 확인 / 별도 양산 옵션에서만 자동 초기화 후 AUTO를 구분합니다. 설정한 Shift를 의도치 않게 잃거나, 남아 있는 Shift를 모른 채 AUTO로 진입하지 않도록 전환 결과를 분명히 보여줘야 합니다. 기본 동작은 자동 초기화가 아닙니다.\u003c/p>\u003cp>\u003cb>개선 화면·버튼\u003c/b>AUTO 진입 / 비제로 Shift 유지·취소 확인 / 별도 양산 자동 초기화 옵션 / 전환 전후 이력 / 검사 추종·Field 검토\u003c/p>\u003cp>\u003cb>입력\u003c/b>현재 Shift X/Y, AUTO 전환 요청, 비제로 Shift 유지 확인의 사용자 선택, 별도 양산 자동 초기화 옵션과 검사 추종 정책입니다.\u003c/p>\u003col>\u003cli>Shift=0/0으로 AUTO 전환을 눌러 바로 진입하는지 확인합니다.\u003c/li>\u003cli>Shift를 입력하고 양산 자동 초기화 옵션 OFF에서 AUTO를 눌러 유지/취소를 각각 시험합니다.\u003c/li>\u003cli>양산 옵션을 ON으로 바꾼 뒤 같은 Shift로 전환하여 팝업 없이 초기화 후 AUTO가 되고 전후 이력이 남는지 봅니다.\u003c/li>\u003c/ol>\u003cp>\u003cb>실제 사용 예\u003c/b>Shift=+50/−20 µm에서 기본 설정으로 AUTO를 누르면 유지 가공 여부를 묻고, 유지하면 값은 그대로입니다. 별도 양산 자동 초기화 옵션을 켰을 때만 팝업 없이 0/0으로 바뀐 후 AUTO가 됩니다.\u003c/p>\u003cp>\u003cb>실행 후 결과\u003c/b>Shift=0은 확인 없이 AUTO, Shift≠0이고 양산 옵션 OFF이면 유지/취소 확인, 양산 옵션 ON이면 초기화→AUTO 순서로 전환합니다. 전환 전후 Shift·선택·옵션을 이력에 남깁니다.\u003c/p>\u003cp>\u003cb>완료 기준\u003c/b>0이면 직행, 비제로 기본은 유지 여부 확인, 별도 양산 옵션에서만 자동 초기화 후 AUTO라는 세 경로가 구분됩니다.\u003c/p>\u003cp>\u003cb>진행 차단 조건·보존할 정보\u003c/b>양산 옵션이 꺼져 있는데 Shift를 자동으로 0으로 만들지 않습니다. 유지 확인을 취소하면 AUTO에 진입하지 않습니다. Field 범위를 벗어난 최종 좌표는 별도로 차단합니다.\u003c/p>\u003c/details>\u003cdetails class=\"card\" id=\"detail-R14\">\u003csummary>\u003cb>R14 · 보정 효과 평가 — 평가 흐름 확장\u003c/b>\u003c/summary>\u003cp>\u003cb>현재 실제 가능한 일\u003c/b>측정 결과 저장과 다음 준비의 Offset 반영이 있습니다. 같은 홀 재촬영과 새 가공·독립점의 보정 효과 평가를 따로 읽는 UI가 필요합니다. \u003ca class=\"ref\" href=\"#S05\">S05\u003c/a> \u003ca class=\"ref\" href=\"#S19\">S19\u003c/a>\u003c/p>\u003cp>\u003cb>작업자에게 어떤 점이 어려운가요?\u003c/b>이미 가공한 홀을 다시 찍어도 위치는 바뀌지 않습니다. 앵커 적합과 새 가공의 전체/독립 위치 개선을 혼동하지 않아야 합니다.\u003c/p>\u003cp>\u003cb>어떤 화면과 버튼으로 개선하나요?\u003c/b>다음 가공 준비 → 새 가공 검증 / 가공점·홀드아웃 전후 RMS·공차 내 개수 / 기존 RAW 보존\u003c/p>\u003cp>\u003cb>필요한 입력\u003c/b>다음 준비에 동결한 보정 Revision과 Script, 새 가상 Glass, 앵커 이외의 독립 검증 위치입니다.\u003c/p>\u003col>\u003cli>후보 적용 → 다음 가공 준비 → 새 가공·독립점 검증 순서로 누릅니다.\u003c/li>\u003cli>가공점과 홀드아웃 RMS·잔여 편차를 따로 읽습니다.\u003c/li>\u003cli>작업공간으로 돌아가 기존 측정값과 RAW가 바뀌지 않았는지 확인합니다.\u003c/li>\u003c/ol>\u003cp>\u003cb>개선 후 실제 사용 예\u003c/b>같은 홀 재촬영은 반복성입니다. 새 가공의 1,024점과 앵커 외 48개 위치 비교는 이 SIM 모델의 보정 효과 평가입니다.\u003c/p>\u003cp>\u003cb>완료되었다고 판단할 기준\u003c/b>앵커에 잘 맞는 것을 전 기판 성능으로 일반화하지 않습니다.\u003c/p>\u003cp>\u003cb>실패하거나 진행을 막아야 할 조건\u003c/b>준비된 버전이 현재 활성과 다르면 검증하지 않습니다. 앵커에서 오차가 줄었다고 미측정 전 영역을 합격으로 처리하지 않습니다.\u003c/p>\u003c/details>\u003cdetails class=\"card\" id=\"detail-R15\">\u003csummary>\u003cb>R15 · 데이터 패키지·내보내기 — 저장 계약 확장\u003c/b>\u003c/summary>\u003cp>\u003cb>현재 실제 가능한 일\u003c/b>ReviewResult CSV·ReviewOffset CSV·실행/설정 이력이 별도로 존재합니다. Run의 RAW·후보·기준/적용 버전·Script를 묶어 재구성하는 계약을 제안합니다. \u003ca class=\"ref\" href=\"#S01\">S01\u003c/a> \u003ca class=\"ref\" href=\"#S02\">S02\u003c/a> \u003ca class=\"ref\" href=\"#S19\">S19\u003c/a>\u003c/p>\u003cp>\u003cb>작업자에게 어떤 점이 어려운가요?\u003c/b>결과 CSV만 있으면 어떤 설정·기준 Offset·최종 Script로 만든 결과인지 한 번에 재구성하기 어렵습니다.\u003c/p>\u003cp>\u003cb>어떤 화면과 버튼으로 개선하나요?\u003c/b>현재 결과 CSV / 전체 세션 JSON / 파일 복원 검증 / Run·RAW·후보·버전·설정·Script·로그 묶음\u003c/p>\u003cp>\u003cb>필요한 입력\u003c/b>결과·RAW·시도 이력, 계획, 후보, Revision, 적용 ID, Recipe/설정, Script와 작업 로그입니다.\u003c/p>\u003col>\u003cli>후보·적용·준비까지 진행한 세션을 JSON으로 내려받습니다.\u003c/li>\u003cli>다른 예제를 연 뒤 저장한 JSON을 복원합니다.\u003c/li>\u003cli>활성/준비 버전·과거 RAW·적용 이력이 함께 복원됐는지 확인합니다.\u003c/li>\u003c/ol>\u003cp>\u003cb>개선 후 실제 사용 예\u003c/b>CSV는 결과 교환에, 전체 세션 JSON은 후보·버전·적용 이력까지 이어서 확인하는 데 씁니다. 서로 목적이 다릅니다.\u003c/p>\u003cp>\u003cb>완료되었다고 판단할 기준\u003c/b>다른 사람이 같은 파일로 작업 의미와 버전을 재구성할 수 있습니다.\u003c/p>\u003cp>\u003cb>실패하거나 진행을 막아야 할 조건\u003c/b>형식·수치·키가 손상된 묶음은 기존 세션을 유지한 채 거부합니다. 복원된 미검증 후보는 다시 검증해야 합니다.\u003c/p>\u003c/details>\u003cdetails class=\"card\" id=\"detail-R16\" style=\"grid-column:1/-1\">\u003csummary>\u003cb>R16 · Distortion 연계·AK 4점 수동 수신 — 수동 읽기·AUTO 코드와 화면 요구\u003c/b>\u003c/summary>\u003cp>\u003cb>현재 실제 가능한 일\u003c/b>Distortion AUTO Prepare→Load→Calculate→Save와 DoReady 연결 코드가 있습니다. 수동 Load Data도 장치 LastLoad 주소에서 AK1~AK4와 선택 DK를 직접 읽습니다. 이 수동 읽기 자체가 새 측정을 요청하는 것은 아닙니다. Stage ABLE/COMPLETE는 USE=0·UNASSIGNED입니다. \u003ca class=\"ref\" href=\"#S23\">S23\u003c/a>\u003ca class=\"ref\" href=\"#S24\">S24\u003c/a>\u003ca class=\"ref\" href=\"#S33\">S33\u003c/a>\u003ca class=\"ref\" href=\"#S34\">S34\u003c/a>\u003ca class=\"ref\" href=\"#S35\">S35\u003c/a>\u003ca class=\"ref\" href=\"#S36\">S36\u003c/a>\u003c/p>\u003cp>\u003cb>어떤 화면과 버튼으로 개선하나요?\u003c/b>AUTO 단계 모니터와 별도로, 가공 SW에서 원하는 시점에 AK1~AK4의 글로벌 X/Y(mm) 8개를 수동 수신하고 취득시각·출처·유효 상태를 함께 확인하는 화면을 구성합니다. 기존 결과 읽기와 새 측정 요청 후 수신을 구분합니다.\u003c/p>\u003cdiv id=\"align-key-manual\">\u003ch3>Align Key 4개 글로벌 좌표 수동 수신\u003c/h3>\n\u003cp>\u003cb>목적:\u003c/b> AUTO Distortion 순서가 시작될 때만 확인하는 것이 아니라, 작업자가 필요한 시점에 가공 SW에서 \u003cb>“AK 4점 좌표 받기”\u003c/b>를 선택해 AK1~AK4의 글로벌 절대좌표 X/Y를 mm 단위로 확인하는 화면을 구성합니다. 카메라 Pixel, Review 오차(µm), Base−LastLoad 보정량과 다른 값입니다.\u003c/p>\n\u003cp>\u003cb>현재 기반:\u003c/b> 기존 \u003cb>Load Data\u003c/b>는 AK1~AK4와 선택 DK의 장치 LastLoad를 실제 읽기 요청으로 가져옵니다. 앱 캐시만 표시하는 기능은 아닙니다. 다만 이 경로에는 새 측정 시작 요청·새 Stage COMPLETE 확인·결과 회차의 상관 검증이 없습니다. 따라서 “방금 읽음”을 “방금 측정함”으로 표시하면 안 됩니다. \u003ca class=\"ref\" href=\"#S24\">S24\u003c/a>\u003ca class=\"ref\" href=\"#S36\">S36\u003c/a>\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>화면의 선택 모드\u003c/th>\u003cth>버튼을 누른 뒤 동작\u003c/th>\u003cth>결과의 의미\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>\u003cb>기존 결과 받기\u003c/b>\u003c/td>\u003ctd>현재 장치에 기록된 AK X/Y 8개를 읽고 성공 여부를 확인합니다. 읽기 시작·완료 시각을 남깁니다.\u003c/td>\u003ctd>지금 수신한 장치 결과입니다. 장치가 측정시각·회차를 제공하지 않으면 \u003cb>측정 최신성 미확인\u003c/b>으로 표시합니다.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>새 측정 요청 후 받기\u003c/b>\u003cbr>상대 인터페이스 검토 항목\u003c/td>\u003ctd>상대가 지원할 경우 AK 4점 측정 조건을 전달하고 요청→새 완료 확인→동일 회차의 8값 수신을 연결합니다. 요청 ID 또는 동등한 회차 식별 계약이 필요합니다.\u003c/td>\u003ctd>해당 요청의 새 결과임을 검증한 경우만 새 측정으로 표시합니다. 현재 수동 Load Data와 같은 동작으로 간주하지 않습니다.\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"card\" style=\"overflow-x:auto;margin:18px 0\">\u003csvg viewBox=\"0 0 900 190\" role=\"img\" aria-label=\"장치의 기존 결과를 수동으로 읽어 AK 4점 글로벌 좌표를 확인하는 순서\" style=\"width:100%;min-width:540px;max-height:210px\">\u003crect x=\"10\" y=\"24\" width=\"236\" height=\"110\" rx=\"12\" fill=\"#edf5fb\" stroke=\"#84a9c0\"/>\u003crect x=\"324\" y=\"24\" width=\"242\" height=\"110\" rx=\"12\" fill=\"#e4f5f1\" stroke=\"#399d88\"/>\u003crect x=\"644\" y=\"24\" width=\"246\" height=\"110\" rx=\"12\" fill=\"#fff4df\" stroke=\"#c99738\"/>\u003cg fill=\"#213f52\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"18\">\u003ctext x=\"128\" y=\"59\">Distortion 결과 영역\u003c/text>\u003ctext x=\"128\" y=\"90\">AK1~AK4 · X/Y(mm)\u003c/text>\u003ctext x=\"445\" y=\"59\">사용자가 수동 읽기\u003c/text>\u003ctext x=\"445\" y=\"90\">8개 값·수신 상태 확인\u003c/text>\u003ctext x=\"767\" y=\"59\">4점 표와 취득 정보\u003c/text>\u003ctext x=\"767\" y=\"90\">조회용 결과로 표시\u003c/text>\u003ctext x=\"450\" y=\"170\" font-size=\"16\">수신 완료는 Base 저장·보정 적용·가공 시작과 별개입니다.\u003c/text>\u003c/g>\u003cpath d=\"M258 79H309m-12-8 12 8-12 8M578 79H629m-12-8 12 8-12 8\" fill=\"none\" stroke=\"#3c6e88\" stroke-width=\"3\"/>\u003c/svg>\u003cfigcaption>기존 결과 수신의 개념도. 읽기 시각만으로 실제 측정시각이나 같은 측정 회차가 보장되지는 않습니다.\u003c/figcaption>\u003c/figure>\n\u003ch4>표시할 좌표와 상태\u003c/h4>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Key\u003c/th>\u003cth>Global X (mm)\u003c/th>\u003cth>Global Y (mm)\u003c/th>\u003cth>현재 결과 맵\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>AK1\u003c/td>\u003ctd>수신한 X1\u003c/td>\u003ctd>수신한 Y1\u003c/td>\u003ctd>POS0_CAM1X/Y · W10100 / W10102\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>AK2\u003c/td>\u003ctd>수신한 X2\u003c/td>\u003ctd>수신한 Y2\u003c/td>\u003ctd>POS0_CAM2X/Y · W10104 / W10106\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>AK3\u003c/td>\u003ctd>수신한 X3\u003c/td>\u003ctd>수신한 Y3\u003c/td>\u003ctd>POS0_CAM3X/Y · W10108 / W1010A\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>AK4\u003c/td>\u003ctd>수신한 X4\u003c/td>\u003ctd>수신한 Y4\u003c/td>\u003ctd>POS0_CAM4X/Y · W1010C / W1010E\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003cp>현재 맵은 읽기 계수 0.0001로 mm를 해석합니다. 주소는 개발 근거이며 작업자는 Key·mm 값·상태 중심으로 봅니다. 화면에는 요청 시 Recipe/Glass, 수신 시작·완료 시각, 기존 결과/새 측정 구분, 각 값의 유효 상태와 \u003cb>측정회차 확인 여부\u003c/b>를 함께 표시합니다. Recipe/Glass는 요청 문맥일 뿐 장치가 식별값을 돌려주지 않으면 결과의 동일 Glass를 검증했다고 표시하지 않습니다. \u003ca class=\"ref\" href=\"#S23\">S23\u003c/a>\u003c/p>\n\u003ch4>조작 순서와 완료 조건\u003c/h4>\u003col>\u003cli>작업자는 Recipe/Glass와 “기존 결과 받기” 모드를 확인하고 원하는 시점에 수동 수신을 실행합니다. 자동 측정·가공 거래와 충돌하면 대기 이유를 보여줍니다.\u003c/li>\u003cli>요청 중에는 중복 요청을 막고 8개 수신 진행과 실패 원인을 표시합니다. 각 좌표를 차례로 읽는 동안 장치 결과가 갱신될 수 있으므로, 회차나 래치 계약 없이 동일 측정 묶음으로 보장하지 않습니다.\u003c/li>\u003cli>8값이 모두 유효하면 한 묶음으로 화면에 갱신합니다. 일부 실패·Timeout이면 이전 정상 결과는 취득시각과 함께 유지하고 이번 실패를 따로 표시합니다. 미수신을 0으로 채우지 않습니다.\u003c/li>\u003cli>새 측정 모드가 필요하면 AK 전용 요청·DK 제외 조건, Stage ABLE/COMPLETE 주소, 결과 회차·완료·취소 계약을 상대 SW와 확정합니다. 현재 두 Stage 입력은 USE=0·UNASSIGNED이므로 검증 전 활성 기능으로 표현하지 않습니다.\u003c/li>\u003cli>좌표 수신으로 종료합니다. \u003cb>Load to Base, 보정 계산·적용, Recipe 저장, Script 준비, 가공 시작은 별도 명령\u003c/b>으로 유지합니다. 사용자가 원하는 시점에 조회할 수 있다는 요구는 실행 중 장치 거래를 끊거나 허가를 우회한다는 뜻이 아닙니다.\u003c/li>\u003c/ol>\n\u003cp class=\"small\">이 절은 가공 SW 인터페이스와 화면의 개선 요구입니다. HTML 실험실의 AUTO 가상 거래와 구분하며, AK 전용 수동 통신이나 실장비 새 측정이 이 HTML에서 실행되는 것은 아닙니다.\u003c/p>\u003c/div>\u003ch3>AUTO Distortion 단계 모니터\u003c/h3>\u003col>\u003cli>Distortion 정상 예제를 한 단계씩 진행하며 Glass/요청 ID를 읽습니다.\u003c/li>\u003cli>다른 Glass·중복·Timeout을 각각 주입하고 오류 상태를 확인합니다.\u003c/li>\u003cli>초기화 후 정상 거래를 다시 진행하여 유효 결과만 후보로 넘어가는지 봅니다.\u003c/li>\u003c/ol>\u003cp>작업자가 “AK 4점 좌표 받기”를 선택하면 장치의 기존 결과를 읽어 글로벌 X/Y(mm)를 확인하는 화면을 제안합니다. 새 측정이 필요하면 별도 모드를 선택하고 상대 완료 계약을 확인합니다. 이 버튼 계약은 설명이며 현재 SIM에 AK 전용 통신을 구현했다는 뜻이 아닙니다.\u003c/p>\u003cp>\u003cb>완료 기준\u003c/b>수동 수신 화면에서는 4점 8값·단위·취득 정보·실패 보존을 검수하고, AUTO 화면에서는 요청·동결 조건·완료·저장·다음 DoReady를 확인합니다. 현재 코드·맵 활성화·실기 성공과 제안 UI를 구분합니다.\u003c/p>\u003cp>\u003cb>차단 조건\u003c/b>자동 측정·가공 거래와 겹치는 수동 요청, 8값 중 일부 실패, 다른 Recipe/Glass 또는 확인되지 않은 측정 회차는 유효한 새 측정 결과로 확정하지 않습니다. 현재 맵과 수동 읽기만으로 측정 최신성·동일 회차를 보장하지 않습니다.\u003c/p>\u003c/details>\u003cdetails class=\"card\" id=\"detail-R17\">\u003csummary>\u003cb>R17 · 8 Head 검산·원빔 평가\u003c/b>\u003c/summary>\u003cp>\u003cb>현재 코드에서 확인한 범위\u003c/b>AK·Cell 회전·Head 배정·Masking·Offset·Shift를 포함하는 좌표 계산이 있습니다. 독립 기대값과 최종 Script를 대조하는 평가 화면을 보완합니다. \u003ca class=\"ref\" href=\"#S14\">S14\u003c/a> \u003ca class=\"ref\" href=\"#S17\">S17\u003c/a>\u003c/p>\u003cp>\u003cb>이번 사용자 요구와 개선 이유\u003c/b>원빔 평가를 레시피 생성·스캐너별 설정·가공/리뷰 대상까지 연결하는 추가 검토가 필요합니다. 기본 DOE=4의 단위·의미를 임의로 결정하면 안 됩니다. 평가 전용 원빔 조건이 레시피·스캐너 설정과 실제 가공/리뷰 대상에 함께 이어져야 합니다. 기본 DOE의 숫자 4와 원빔 옵션의 의미를 임의로 같은 개념으로 해석하지 않습니다.\u003c/p>\u003cp>\u003cb>개선 화면·버튼\u003c/b>레시피 생성 Offset·원빔 옵션 / 모든 스캐너 기본 DOE=4 표시 / 스캐너별 유효 원빔 조건 / 가공·리뷰 평가 대상 비교\u003c/p>\u003cp>\u003cb>입력\u003c/b>레시피 생성 시 Offset/원빔 옵션, 모든 스캐너의 기본 DOE 설정값 4, 특정 스캐너의 유효한 원빔 설정, 해당 조건의 가공·리뷰 대상 및 독립 좌표 fixture입니다.\u003c/p>\u003col>\u003cli>레시피 생성의 Offset·원빔 옵션과 모든 스캐너의 기본 DOE=4 표시를 확인합니다.\u003c/li>\u003cli>특정 스캐너의 유효한 원빔 설정을 지정해 해당 스캐너의 가공·리뷰 평가 범위가 함께 바뀌는지 검토합니다.\u003c/li>\u003cli>원빔 설정이 없는 스캐너의 기본 조건 유지와 독립 좌표/Mask/Script 검산 결과를 함께 확인합니다.\u003c/li>\u003c/ol>\u003cp>\u003cb>실제 사용 예\u003c/b>모든 스캐너의 기본 DOE 표기는 4로 두고 H03에 유효한 원빔 조건이 있을 때만 그 조건을 H03의 가공·리뷰 평가 대상에 반영하는 방식입니다. 숫자 4의 단위·뜻은 이 예제에서 확정하지 않습니다.\u003c/p>\u003cp>\u003cb>실행 후 결과\u003c/b>어느 스캐너가 기본 조건이고 어느 스캐너가 지정 원빔 조건인지, 그에 따른 가공/리뷰 평가 대상을 함께 검토합니다. 기존 8 Head 명목/축/Mask/Field/Revision 검산도 제공합니다.\u003c/p>\u003cp>\u003cb>완료 기준\u003c/b>기본 DOE=4의 의미를 임의 해석하지 않고 유효한 스캐너별 원빔 조건이 가공·리뷰 평가에 연결될 항목을 분명히 구분합니다.\u003c/p>\u003cp>\u003cb>진행 차단 조건·보존할 정보\u003c/b>DOE=4를 4개 Beam·4×4·Beam 번호 4 등으로 새로 해석하지 않습니다. 원빔 유효 설정이 없는 스캐너를 임의로 원빔 처리하지 않으며 실제 생산 연계·단위/의미는 추가 검토합니다.\u003c/p>\u003c/details>\u003cdetails class=\"card\" id=\"detail-R18\">\u003csummary>\u003cb>R18 · 평가 속도·사용성·이력 — 성능·이력 연결 검수\u003c/b>\u003c/summary>\u003cp>\u003cb>현재 실제 가능한 일\u003c/b>일부 Review 계획·런타임 목록은 지연 생성·증분 갱신하며 설정/결과 이력도 존재합니다. 대용량 통합 화면과 동작 중 응답성은 실제 시나리오로 확인해야 합니다. \u003ca class=\"ref\" href=\"#S01\">S01\u003c/a> \u003ca class=\"ref\" href=\"#S11\">S11\u003c/a> \u003ca class=\"ref\" href=\"#S25\">S25\u003c/a>\u003c/p>\u003cp>\u003cb>작업자에게 어떤 점이 어려운가요?\u003c/b>대용량에서 화면 재생성·동기 저장이 Stop 클릭을 방해할 수 있습니다. 기존 지연 생성/증분 갱신을 살리면서 통합 UI의 실제 입력 반응과 전후 이력을 검수해야 합니다.\u003c/p>\u003cp>\u003cb>어떤 화면과 버튼으로 개선하나요?\u003c/b>10,000점 조회 / 50행 페이지 표·Canvas 맵 / 렌더시간 / 측정 중 Stop / 설정 전후 이력\u003c/p>\u003cp>\u003cb>필요한 입력\u003c/b>10,000점 예제, 필터/페이지/선택, 측정 중 UI 상태, 설정 변경 전후와 로컬 응답시간입니다.\u003c/p>\u003col>\u003cli>10,000점 예제를 열고 Cell/판정 필터와 다음 페이지를 조작합니다.\u003c/li>\u003cli>설정을 바꾸고 전/후값이 이력에 남는지 확인합니다.\u003c/li>\u003cli>가상 측정 중 화면 조회·일시정지·중지가 반응하는지 살펴봅니다.\u003c/li>\u003c/ol>\u003cp>\u003cb>개선 후 실제 사용 예\u003c/b>전체는 10,000점이어도 표는 현재 페이지의 50행을 만듭니다. 맵은 Canvas로 그려 표의 모든 셀을 동시에 만들지 않습니다.\u003c/p>\u003cp>\u003cb>완료되었다고 판단할 기준\u003c/b>응답시간은 실행한 브라우저 측정값이며 장비 성능 보증이 아닙니다.\u003c/p>\u003cp>\u003cb>실패하거나 진행을 막아야 할 조건\u003c/b>측정 중 대상/기준을 바꾸는 충돌 조작은 막거나 중지 후 수행합니다. 이 브라우저의 시간 값을 PLC/설비 처리시간으로 일반화하지 않습니다.\u003c/p>\u003c/details>\u003c/div>\u003cp class=\"small\">표시 충돌·미연결 경로의 위험을 현장 데이터 손실이나 실제 발생 결함으로 확정하지 않았습니다. 코드·Config 정적 확인과 실기 성공은 구분하며, 이 HTML의 추가 보호·조작은 UI 설계 시뮬레이션입니다.\u003c/p>\u003cp>\u003ca href=\"#\" data-sim-view=\"workspace\">V3 시뮬레이터 열기 → 리뷰 작업공간 / 가상 설비 동작 / 상세 사용설명에서 직접 체험\u003c/a>\u003c/p>\u003c/section>\n\n\u003csection id=\"critical\">\u003ch2>04. UI 확대 전에 확인할 다섯 가지\u003c/h2>\u003col>\u003cli>\u003cb>다른 Cell 결과가 겹쳐 보일 가능성.\u003c/b> 결과표의 열 키는 Head+Shot이며 Cell이 빠져 있습니다. 같은 반올림 DesignY·Head·Shot 표시명인 복수 Cell은 동일 표 칸에 뒤 결과가 덮여 보일 수 있습니다. 조건부 코드 경로이며 실앱 재현이나 원본 CSV 소실까지 확인한 것은 아닙니다. \u003ca class=\"ref\" href=\"#S09\">S09\u003c/a>\u003c/li>\u003cli>\u003cb>CSV의 상태가 원래 의미대로 유지되는지.\u003c/b> 기존 보조 경로는 NG 외 문자열을 OK로 재구성하고, 일반 CSV Apply에는 실시간 FINE과 같은 NG 차단이 확인되지 않습니다. 이 공통 버튼 경로는 현재 미연결이므로, \u003cb>연결 복원 전\u003c/b> ERROR/미측정/NG·빈 수치와 RESULT_SOURCE 검사를 정비해야 합니다. 실제 발생 사례로 단정하지 않습니다. \u003ca class=\"ref\" href=\"#S03\">S03\u003c/a> \u003ca class=\"ref\" href=\"#S07\">S07\u003c/a> \u003ca class=\"ref\" href=\"#S08\">S08\u003c/a> \u003ca class=\"ref\" href=\"#S22\">S22\u003c/a>\u003c/li>\u003cli>\u003cb>같은 FINE이라는 이름의 계산 차이.\u003c/b> 직접 적용은 Cell+X열 기준 Lagrange, 기존 CSV 보조 계산은 Head+X 기준 선형 보간·끝값 고정입니다. 같은 모드인지 별도 정책인지 합의하고, 재불러오기 결과가 달라지지 않도록 해야 합니다. \u003ca class=\"ref\" href=\"#S05\">S05\u003c/a> \u003ca class=\"ref\" href=\"#S06\">S06\u003c/a>\u003c/li>\u003cli>\u003cb>현재 실행 중 중복 보호와 영속 보호의 차이.\u003c/b> 메모리 적용 플래그와 파일 원자 저장은 이미 있습니다. 다만 재시작·재불러오기·다른 경로 적용까지 식별할 측정/기준/적용 Revision은 Offset 5열에 없습니다. 기존 보호를 유지하면서 보완합니다. \u003ca class=\"ref\" href=\"#S02\">S02\u003c/a> \u003ca class=\"ref\" href=\"#S20\">S20\u003c/a> \u003ca class=\"ref\" href=\"#S21\">S21\u003c/a>\u003c/li>\u003cli>\u003cb>실측 OK가 보간 전체의 합격은 아님.\u003c/b> FINE은 유한성·중복·실측 상태를 검사하지만, 보간 중간값의 증폭·외삽·누적 총량·최종 Scanner X/Y 경계까지 같은 함수가 보장하는 것은 아닙니다. 독립 검증점과 최종 합성 좌표 검사가 필요합니다. \u003ca class=\"ref\" href=\"#S05\">S05\u003c/a> \u003ca class=\"ref\" href=\"#S17\">S17\u003c/a> \u003ca class=\"ref\" href=\"#S18\">S18\u003c/a>\u003c/li>\u003c/ol>\u003c/section>\n\n\u003csection id=\"ui\">\u003ch2>05. 추천 UI: 리뷰 평가 작업공간\u003c/h2>\u003cp>기존 Glass 프리뷰·NG 강조·수동 검사·전용 Apply를 재사용합니다. 큰 메뉴를 계속 바꾸는 대신 선택한 결과와 작업 단계를 유지하는 구성이 적절합니다.\u003c/p>\u003cdiv class=\"pipeline\">\u003cdiv class=\"step\">\u003cstrong>1 · 결과 선택\u003c/strong>현재 실행 / 저장 파일\u003cbr>Recipe·Glass·Run 고정\u003c/div>\u003cdiv class=\"step\">\u003cstrong>2 · 위치·편차\u003c/strong>Glass → Cell → Shot\u003cbr>맵·분포·표 연동\u003c/div>\u003cdiv class=\"step\">\u003cstrong>3 · 선택 재측정\u003c/strong>이동 / 현재 측정\u003cbr>이동 후 측정\u003c/div>\u003cdiv class=\"step\">\u003cstrong>4 · 보정 후보\u003c/strong>실측·보간·수동 표시\u003cbr>기존 → 증감 → 새 값\u003c/div>\u003cdiv class=\"step\">\u003cstrong>5 · 적용·검증\u003c/strong>저장·다음 준비 구분\u003cbr>새 가공 / 버전 복원\u003c/div>\u003c/div>\n\u003cdiv class=\"mock\">\u003cdiv class=\"mock-title\">화면 배치 검토용 예시 · 가상 데이터 · 제품 UI 구현 또는 실제 측정 결과가 아닙니다\u003c/div>\u003cdiv class=\"pillrow\">\u003clabel>Cell \u003cselect id=\"cell-select\">\u003coption value=\"1\">Cell 01 · H01\u003c/option>\u003coption value=\"2\">Cell 02 · H03\u003c/option>\u003coption value=\"3\">Cell 03 · H05\u003c/option>\u003c/select>\u003c/label>\u003clabel>표시 \u003cselect id=\"basis-select\">\u003coption value=\"measurement\">실측 판정\u003c/option>\u003coption value=\"source\">보정값 출처\u003c/option>\u003c/select>\u003c/label>\u003cspan class=\"screen-label\">점 선택 시 상세 연동\u003c/span>\u003c/div>\u003cdiv class=\"mock-body\">\u003cdiv>\u003ch3>Cell 안의 Shot 위치 맵\u003c/h3>\u003cp class=\"small\">화면의 Shot 번호는 예시입니다. 제품에서는 Cell·Shot 행/열·Beam을 함께 식별합니다.\u003c/p>\u003cdiv class=\"grid\" id=\"shot-grid\" aria-label=\"가상 Shot 위치 맵\">\u003c/div>\u003cdiv class=\"legend\">\u003cspan style=\"--dot:#257357\">실측 OK\u003c/span>\u003cspan style=\"--dot:#a33136\">실측 NG\u003c/span>\u003cspan style=\"--dot:#5b8ab7\">보간\u003c/span>\u003cspan style=\"--dot:#8a54ad\">수동 후보\u003c/span>\u003cspan style=\"--dot:#8091a0\">기존 유지/미측정\u003c/span>\u003c/div>\u003cp id=\"map-summary\" class=\"small\" aria-live=\"polite\">\u003c/p>\u003ch3>목표 중심 대비 실측 편차\u003c/h3>\u003csvg id=\"scatter\" viewBox=\"0 0 460 220\" role=\"img\" aria-label=\"가상 실측 편차 산점도\">\u003c/svg>\u003cp class=\"small\">편차 확대도이며 기판의 실제 거리 맵이 아닙니다. 공차선은 협의 후 표시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"details\">\u003ch3>선택점 상세\u003c/h3>\u003cdl id=\"point-details\" class=\"kv\" aria-live=\"polite\">\u003c/dl>\u003ch3>보정 후보 비교 · DESIGN / µm\u003c/h3>\u003cdiv class=\"revision\">\u003cdiv>현재 값 B\u003cb id=\"base-value\">\u003c/b>\u003c/div>\u003cspan>＋\u003c/span>\u003cdiv>이번 증감 Δ\u003cb id=\"delta-value\">\u003c/b>\u003c/div>\u003cspan>＝\u003c/span>\u003cdiv>새 값 F\u003cb id=\"final-value\">\u003c/b>\u003c/div>\u003c/div>\u003cp class=\"small\">현재 B가 적용된 측정의 잔여 오차로 Δ를 계산할 때의 누적 예시입니다. Simple 입력값 대체는 별도 표시해야 합니다.\u003c/p>\u003ch3>같은 공간에서 제공할 실제 작업\u003c/h3>\u003cul>\u003cli>선택 위치로 이동\u003c/li>\u003cli>현재 위치 측정 / 이동 후 측정\u003c/li>\u003cli>선택 NG 재검 · Flying 라인 범위 표시\u003c/li>\u003cli>후보 편집 · 적용 범위·전후값 검토\u003c/li>\u003cli>한 번 적용 · 적용 이력·이전 버전 복원\u003c/li>\u003c/ul>\u003cp class=\"devnote\">위 항목은 기능 제안입니다. 이 문서의 선택 조작은 예시 표시만 바꾸며 이동·측정·저장·Apply를 실행하지 않습니다.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"note\">\u003cb>색과 출처는 서로 다른 정보입니다.\u003c/b> NG가 수동 대체됐더라도 원측정 NG는 남겨야 합니다. “실측 판정”과 “적용 후보의 출처”를 전환해 보고, 한 번에 같은 색으로 합치지 않는 방식을 권장합니다.\u003c/div>\u003c/section>\n\n\u003csection id=\"correction\">\u003ch2>06. 보정의 의미와 적용 계약\u003c/h2>\u003cdiv class=\"comparison\">\u003cdiv>\u003ch3>측정 결과\u003c/h3>\u003cp>Vision 원본 Target/Hole → CameraResolution·nResolution을 반영한 mm 오차 → 방향 변환 → 표시용 µm. 촬영점의 물리 위치와 편차 산점도는 다릅니다.\u003c/p>\u003cp>현재 코드는 Target−Hole의 환산값과 Flip을 사용합니다. 단위·좌표계·Flip 스냅샷을 함께 보여줘야 합니다. \u003ca class=\"ref\" href=\"#S15\">S15\u003c/a> \u003ca class=\"ref\" href=\"#S16\">S16\u003c/a>\u003c/p>\u003c/div>\u003cdiv>\u003ch3>보정 후보와 최종 적용\u003c/h3>\u003cp>실측 편차로부터 보정 증가량을 만들고, 범위·보간 정책을 적용합니다. “측정값”과 “스캐너에 반영할 값”을 같은 칸에서 섞지 않습니다.\u003c/p>\u003cp>\u003cb>Simple: 입력값으로 대체.\u003c/b>\u003cbr>\u003cb>Rough/Fine: 기존값 + 이번 증가량.\u003c/b> DEFAULT/FIRST BEAM 고정층과 Review 보정층도 나눕니다. \u003ca class=\"ref\" href=\"#S04\">S04\u003c/a> \u003ca class=\"ref\" href=\"#S05\">S05\u003c/a>\u003c/p>\u003c/div>\u003c/div>\n\u003ch3>저장 완료와 가공 반영 완료는 다른 상태입니다\u003c/h3>\u003cdiv class=\"pipeline\">\u003cdiv class=\"step\">\u003cstrong>후보 계산·검증\u003c/strong>사용한 측정 Run\u003cbr>기준 보정 Revision\u003c/div>\u003cdiv class=\"step\">\u003cstrong>새 버전 저장\u003c/strong>적용 ID·변경 전후\u003cbr>다음 활성 버전\u003c/div>\u003cdiv class=\"step\">\u003cstrong>다음 가공 준비\u003c/strong>실제 불러온 버전\u003cbr>최종 Script 식별\u003c/div>\u003cdiv class=\"step\">\u003cstrong>새 가공 검증\u003c/strong>다른 검증점/새 가공\u003cbr>편차 개선 대조\u003c/div>\u003c/div>\u003cp>현행은 다음 가공모델 준비 때 최신 Offset을 병합합니다. 파일 저장이나 UI 갱신만으로 기존 Script가 실시간으로 바뀐다고 표시하면 안 됩니다. \u003ca class=\"ref\" href=\"#S19\">S19\u003c/a>\u003c/p>\n\u003cdiv class=\"note warn\">\u003cb>같은 홀을 다시 촬영하는 것은 측정 반복성 확인입니다.\u003c/b> 보정값을 변경해도 이미 가공된 홀의 위치는 바뀌지 않습니다. 보정 효과는 적용한 새 가공과 별도 검증점으로 확인해야 합니다. 샘플링한 점만 잘 맞는 것을 전 영역 검증으로 취급하지 않습니다.\u003c/div>\n\u003ch3>Shift는 물리 좌표로 정의해야 합니다\u003c/h3>\u003cp>현재 가공 Shift는 Review 목표식에 직접 포함되지 않습니다. 향후 “설계점 검사”와 “Shift 후 예상 가공점 검사” 중 무엇을 원하는지 정하고, 좌표계·Head 방향·회전·Flip을 반영해 목표를 계산해야 합니다. Scanner Offset 숫자를 ReviewX/MainY에 그대로 더하는 방식으로 일반화하지 않습니다. 수동→AUTO·Recipe 변경·다음 Glass·Reset의 유지/초기화 정책도 별도로 정합니다. \u003ca class=\"ref\" href=\"#S14\">S14\u003c/a> \u003ca class=\"ref\" href=\"#S17\">S17\u003c/a> \u003ca class=\"ref\" href=\"#S18\">S18\u003c/a> \u003ca class=\"ref\" href=\"#S29\">S29\u003c/a> \u003ca class=\"ref\" href=\"#S30\">S30\u003c/a>\u003c/p>\n\u003ch3>권장 데이터 계약\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>현재 확인된 저장 정보\u003c/th>\u003cth>추가 권장 정보\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>ReviewResult\u003c/td>\u003ctd>Glass/Recipe, 방법·상태·총수, Rule/Scope, Beam, Cell·Head·Shot, Design, ErrorX/Y, Judge, RESULT_SOURCE=MEASURED\u003c/td>\u003ctd>고유 RunId·Recipe/Geometry Revision, 원본 Pixel·환산/Flip 스냅샷, SIM/REAL·수신 상태, 최초/재측정 연결, 좌표 단위\u003c/td>\u003c/tr>\u003ctr>\u003ctd>보정 후보\u003c/td>\u003ctd>모드별 화면·메모리 계산값\u003c/td>\u003ctd>실측/대표점 복제/보간/수동/기존 유지 출처, 앵커 ID, 보간·외삽 방법, B/Δ/F, 적용 범위와 최대량\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ReviewOffset\u003c/td>\u003ctd>CELLID, SHOTID, REVIEWOFFSETX/Y, COORDINATE_SPACE의 5열·시간별 새 파일\u003c/td>\u003ctd>원본 측정 RunId, 기준·적용 Revision, Candidate/Apply ID, 적용자·사유, 활성 버전, 복원 대상·효력 시점\u003c/td>\u003c/tr>\u003ctr>\u003ctd>가공 실행\u003c/td>\u003ctd>다음 준비 시 최신 Offset 병합 경로\u003c/td>\u003ctd>실제 사용한 Offset/설정/레시피/Script 식별정보를 Run에 연결. 저장·업로드·RUN·새 가공 검증을 별도 상태로 기록\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"small\">위 추가 필드는 데이터 계약 제안입니다. 기존 파일 전체를 무조건 교체하라는 뜻은 아니며, 호환 가능한 버전 파일/메타데이터 묶음 방식은 구현 설계에서 결정합니다. \u003ca class=\"ref\" href=\"#S01\">S01\u003c/a> \u003ca class=\"ref\" href=\"#S02\">S02\u003c/a> \u003ca class=\"ref\" href=\"#S19\">S19\u003c/a>\u003c/p>\u003c/section>\n\n\u003csection id=\"backlog\">\u003ch2>07. 가공 SW 개선 항목과 완료 기준\u003c/h2>\u003cp>\u003cspan class=\"priority p0\">P0\u003c/span> 잘못된 표시·보정 적용을 막기 위한 선행 항목 · \u003cspan class=\"priority p1\">P1\u003c/span> 공정 평가 작업시간·편의 개선 · \u003cspan class=\"priority p2\">P2\u003c/span> 자동 연계·운영 확장. 실제 개발 범위·일정·담당자는 아직 합의되지 않았습니다.\u003c/p>\u003cdiv class=\"pillrow no-print\">\u003cbutton type=\"button\" class=\"filter\" data-filter=\"ALL\" aria-pressed=\"true\">전체\u003c/button>\u003cbutton type=\"button\" class=\"filter\" data-filter=\"P0\" aria-pressed=\"false\">P0\u003c/button>\u003cbutton type=\"button\" class=\"filter\" data-filter=\"P1\" aria-pressed=\"false\">P1\u003c/button>\u003cbutton type=\"button\" class=\"filter\" data-filter=\"P2\" aria-pressed=\"false\">P2\u003c/button>\u003clabel>검색 \u003cinput id=\"search\" type=\"search\" placeholder=\"예: Shift, 보간, 복원\">\u003c/label>\u003cspan id=\"shown-count\" class=\"small\" aria-live=\"polite\">\u003c/span>\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable id=\"requirements\">\u003cthead>\u003ctr>\u003cth>ID·우선\u003c/th>\u003cth>개선 항목\u003c/th>\u003cth>개선 내용\u003c/th>\u003cth>완료·검수 기준\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr data-priority=\"P0\" data-id=\"R01\">\u003ctd>\u003cb>R01\u003c/b>\u003cbr>\u003cspan class=\"priority p0\">P0\u003c/span>\u003c/td>\u003ctd>\u003cb>결과 식별과 맵 표시\u003c/b>\u003c/td>\u003ctd>Run·Cell·Head·Shot·Beam 키를 유지한다. 현재 Head+Shot 표의 조건부 Cell 덮어쓰기 경로를 먼저 점검한다.\u003cbr>\u003ca class=\"ref\" href=\"#S09\">S09\u003c/a>\u003c/td>\u003ctd>같은 Y·Head·Shot인 서로 다른 Cell 2개가 각각 남고, 표/맵/내보내기 수와 값이 일치한다.\u003c/td>\u003c/tr>\u003ctr data-priority=\"P0\" data-id=\"R02\">\u003ctd>\u003cb>R02\u003c/b>\u003cbr>\u003cspan class=\"priority p0\">P0\u003c/span>\u003c/td>\u003ctd>\u003cb>CSV 조회·적용 연결 정비\u003c/b>\u003c/td>\u003ctd>기존 Load 함수를 실제 조회 흐름에 연결한다. 조회와 보정 적용을 구분하고 Recipe/Glass/부분 완료·실측 여부를 표시한다.\u003cbr>\u003ca class=\"ref\" href=\"#S03\">S03\u003c/a> \u003ca class=\"ref\" href=\"#S07\">S07\u003c/a> \u003ca class=\"ref\" href=\"#S22\">S22\u003c/a> \u003ca class=\"ref\" href=\"#S26\">S26\u003c/a>\u003c/td>\u003ctd>오프라인 파일 조회는 이동 없이 가능. 다른 Recipe 파일·미완료 결과의 적용 조건이 명시되고, 잘못된 상태가 OK로 바뀌지 않는다.\u003c/td>\u003c/tr>\u003ctr data-priority=\"P0\" data-id=\"R03\">\u003ctd>\u003cb>R03\u003c/b>\u003cbr>\u003cspan class=\"priority p0\">P0\u003c/span>\u003c/td>\u003ctd>\u003cb>보정 계산 계약 통일\u003c/b>\u003c/td>\u003ctd>직접 FINE과 CSV 보조 경로의 범위·보간·외삽·좌표계를 확정한다. 동일 계산 서비스를 사용하거나 차이를 화면에 명시한다.\u003cbr>\u003ca class=\"ref\" href=\"#S05\">S05\u003c/a> \u003ca class=\"ref\" href=\"#S06\">S06\u003c/a> \u003ca class=\"ref\" href=\"#S07\">S07\u003c/a>\u003c/td>\u003ctd>동일 입력의 직접/파일 재적용 결과를 비교. Cell 경계와 무측정 열을 넘지 않고, 정의한 외삽 정책을 따른다.\u003c/td>\u003c/tr>\u003ctr data-priority=\"P0\" data-id=\"R04\">\u003ctd>\u003cb>R04\u003c/b>\u003cbr>\u003cspan class=\"priority p0\">P0\u003c/span>\u003c/td>\u003ctd>\u003cb>증감·누적·중복 적용\u003c/b>\u003c/td>\u003ctd>기존값 B, 이번 증감 Δ, 새 값 F를 분리한다. Simple 대체와 Rough/Fine 누적을 구분하고 RunId+기준 Revision 기반 적용 이력을 보존한다.\u003cbr>\u003ca class=\"ref\" href=\"#S04\">S04\u003c/a> \u003ca class=\"ref\" href=\"#S20\">S20\u003c/a> \u003ca class=\"ref\" href=\"#S21\">S21\u003c/a>\u003c/td>\u003ctd>같은 후보 두 번 클릭·재시작·재불러오기 후에도 한 번만 반영. 기준이 바뀌면 오래된 후보를 그대로 적용하지 않는다.\u003c/td>\u003c/tr>\u003ctr data-priority=\"P0\" data-id=\"R05\">\u003ctd>\u003cb>R05\u003c/b>\u003cbr>\u003cspan class=\"priority p0\">P0\u003c/span>\u003c/td>\u003ctd>\u003cb>보간 후 범위 검사\u003c/b>\u003c/td>\u003ctd>측정 OK와 최종 보정량 합격을 분리한다. 증가량·누적 총량·Scanner Field의 X/Y 경계를 전체 대상에 검사한다.\u003cbr>\u003ca class=\"ref\" href=\"#S05\">S05\u003c/a> \u003ca class=\"ref\" href=\"#S17\">S17\u003c/a> \u003ca class=\"ref\" href=\"#S18\">S18\u003c/a>\u003c/td>\u003ctd>측정점이 정상이어도 중간 보간이 크게 휘는 사례와 경계 안/밖을 검수. 실패 시 기존 유효 보정을 보존한다.\u003c/td>\u003c/tr>\u003ctr data-priority=\"P0\" data-id=\"R06\">\u003ctd>\u003cb>R06\u003c/b>\u003cbr>\u003cspan class=\"priority p0\">P0\u003c/span>\u003c/td>\u003ctd>\u003cb>단위·원시 판정·오차 Level\u003c/b>\u003c/td>\u003ctd>기존 축별 OK/NG 공차와 별도로 편차의 크기를 네 단계 Level로 표시하고 지표·경계·이름을 사용자가 편집합니다.\u003cbr>\u003ca class=\"ref\" href=\"#S15\">S15\u003c/a> \u003ca class=\"ref\" href=\"#S16\">S16\u003c/a> \u003ca class=\"ref\" href=\"#S22\">S22\u003c/a> \u003ca class=\"ref\" href=\"#S31\">S31\u003c/a> \u003ca class=\"ref\" href=\"#S32\">S32\u003c/a>\u003c/td>\u003ctd>사용자 Level 범위에 따라 오차 수준이 달라져도 기존 축별 OK/NG 판정과 원시 측정은 보존됩니다.\u003c/td>\u003c/tr>\u003ctr data-priority=\"P1\" data-id=\"R07\">\u003ctd>\u003cb>R07\u003c/b>\u003cbr>\u003cspan class=\"priority p1\">P1\u003c/span>\u003c/td>\u003ctd>\u003cb>리뷰 평가 작업공간\u003c/b>\u003c/td>\u003ctd>결과 불러오기, Glass/Cell 맵, 분포, 상세, 이동/측정, 보정 비교를 한 작업공간에 묶는다. 기존 프리뷰·전용 Apply를 재사용한다.\u003cbr>\u003ca class=\"ref\" href=\"#S10\">S10\u003c/a> \u003ca class=\"ref\" href=\"#S11\">S11\u003c/a> \u003ca class=\"ref\" href=\"#S25\">S25\u003c/a>\u003c/td>\u003ctd>선택점의 ID·위치·결과·보정 후보가 함께 바뀌고 화면 전환 없이 다음 작업을 찾을 수 있다.\u003c/td>\u003c/tr>\u003ctr data-priority=\"P1\" data-id=\"R08\">\u003ctd>\u003cb>R08\u003c/b>\u003cbr>\u003cspan class=\"priority p1\">P1\u003c/span>\u003c/td>\u003ctd>\u003cb>선택 재측정\u003c/b>\u003c/td>\u003ctd>전체/NG/선택점·Cell·Head 필터를 제공한다. PtoP 단점 재검과 Flying 라인 재검은 실행 범위를 다르게 보여준다.\u003cbr>\u003ca class=\"ref\" href=\"#S04\">S04\u003c/a> \u003ca class=\"ref\" href=\"#S10\">S10\u003c/a> \u003ca class=\"ref\" href=\"#S27\">S27\u003c/a>\u003c/td>\u003ctd>선택한 점만 또는 안내된 라인만 재검하고 이전 결과·재검 결과를 모두 보존. 취소 후 남은 범위가 명확하다.\u003c/td>\u003c/tr>\u003ctr data-priority=\"P1\" data-id=\"R09\">\u003ctd>\u003cb>R09\u003c/b>\u003cbr>\u003cspan class=\"priority p1\">P1\u003c/span>\u003c/td>\u003ctd>\u003cb>공간 맵·편차 산점도\u003c/b>\u003c/td>\u003ctd>기판 전체 → Cell → Shot/Beam으로 내려간다. 목표 중심 대비 ΔX/ΔY 분포, Head 색 구분, Cell별 통계를 연동한다.\u003cbr>\u003ca class=\"ref\" href=\"#S09\">S09\u003c/a> \u003ca class=\"ref\" href=\"#S11\">S11\u003c/a>\u003c/td>\u003ctd>실제 위치 맵과 편차 확대 산점도를 혼동하지 않음. 점 선택이 상세·표와 연동되고 분포의 단위·축척이 보인다.\u003c/td>\u003c/tr>\u003ctr data-priority=\"P1\" data-id=\"R10\">\u003ctd>\u003cb>R10\u003c/b>\u003cbr>\u003cspan class=\"priority p1\">P1\u003c/span>\u003c/td>\u003ctd>\u003cb>기준 Shot 복사·다중 후보 편집\u003c/b>\u003c/td>\u003ctd>사용자가 기준이 되는 실측 OK Shot을 직접 고르고 그 Shot의 후보 최종 보정값 F를 다중 선택한 대상 후보에 동일하게 복사합니다.\u003cbr>\u003ca class=\"ref\" href=\"#S04\">S04\u003c/a> \u003ca class=\"ref\" href=\"#S07\">S07\u003c/a>\u003c/td>\u003ctd>직접 선택한 기준 Shot의 최종 보정값이 다중 대상에 동일하게 복사되고 원측정·Judge·참조 key·사유가 남습니다.\u003c/td>\u003c/tr>\u003ctr data-priority=\"P1\" data-id=\"R11\">\u003ctd>\u003cb>R11\u003c/b>\u003cbr>\u003cspan class=\"priority p1\">P1\u003c/span>\u003c/td>\u003ctd>\u003cb>샘플링 미리보기\u003c/b>\u003c/td>\u003ctd>기본 1/3/5/7줄과 대표점은 쉽게, 사용자 라인·범위 선택은 고급 항목으로 둔다. 설계 위치/가공 순서의 처음·끝을 구분한다.\u003cbr>\u003ca class=\"ref\" href=\"#S12\">S12\u003c/a> \u003ca class=\"ref\" href=\"#S13\">S13\u003c/a> \u003ca class=\"ref\" href=\"#S28\">S28\u003c/a>\u003c/td>\u003ctd>여러 Cell·Masking·빈 행에서 실제 Head/Cell/Shot·총 검사 수를 미리 확인. “3줄”의 적용 단위가 명확하다.\u003c/td>\u003c/tr>\u003ctr data-priority=\"P1\" data-id=\"R12\">\u003ctd>\u003cb>R12\u003c/b>\u003cbr>\u003cspan class=\"priority p1\">P1\u003c/span>\u003c/td>\u003ctd>\u003cb>Apply 상태·선택 복원\u003c/b>\u003c/td>\u003ctd>초안→계산→검증→저장→다음 가공 준비 반영→새 가공 검증을 나눈다. 이전 Revision 복원은 새 활성 버전으로 저장한다.\u003cbr>\u003ca class=\"ref\" href=\"#S02\">S02\u003c/a> \u003ca class=\"ref\" href=\"#S19\">S19\u003c/a>\u003c/td>\u003ctd>INIT과 Undo가 구별됨. 복원 전후 값과 다음 준비에서 실제 선택된 버전이 일치한다.\u003c/td>\u003c/tr>\u003ctr data-priority=\"P1\" data-id=\"R13\">\u003ctd>\u003cb>R13\u003c/b>\u003cbr>\u003cspan class=\"priority p1\">P1\u003c/span>\u003c/td>\u003ctd>\u003cb>Shift AUTO 전환·검사 추종\u003c/b>\u003c/td>\u003ctd>Shift가 0이면 AUTO로 바로 전환하고, Shift가 있으면 유지 상태로 가공할지 확인합니다. 별도 양산 옵션을 켠 경우에만 팝업 없이 Shift를 0으로 초기화한 뒤 AUTO로 전환합니다.\u003cbr>\u003ca class=\"ref\" href=\"#S14\">S14\u003c/a> \u003ca class=\"ref\" href=\"#S17\">S17\u003c/a> \u003ca class=\"ref\" href=\"#S18\">S18\u003c/a> \u003ca class=\"ref\" href=\"#S29\">S29\u003c/a> \u003ca class=\"ref\" href=\"#S30\">S30\u003c/a>\u003c/td>\u003ctd>0이면 직행, 비제로 기본은 유지 여부 확인, 별도 양산 옵션에서만 자동 초기화 후 AUTO라는 세 경로가 구분됩니다.\u003c/td>\u003c/tr>\u003ctr data-priority=\"P1\" data-id=\"R14\">\u003ctd>\u003cb>R14\u003c/b>\u003cbr>\u003cspan class=\"priority p1\">P1\u003c/span>\u003c/td>\u003ctd>\u003cb>보정 효과 평가\u003c/b>\u003c/td>\u003ctd>실측 앵커 외 독립 검증점과 새 가공을 비교한다. 재촬영 반복성·보간 적합·가공 개선을 별도 지표로 보여준다.\u003cbr>\u003ca class=\"ref\" href=\"#S05\">S05\u003c/a> \u003ca class=\"ref\" href=\"#S19\">S19\u003c/a>\u003c/td>\u003ctd>동일 홀 재촬영만으로 보정 효과 합격 처리하지 않음. 적용 Revision이 다른 새 가공의 결과를 나란히 비교한다.\u003c/td>\u003c/tr>\u003ctr data-priority=\"P2\" data-id=\"R15\">\u003ctd>\u003cb>R15\u003c/b>\u003cbr>\u003cspan class=\"priority p2\">P2\u003c/span>\u003c/td>\u003ctd>\u003cb>데이터 패키지·내보내기\u003c/b>\u003c/td>\u003ctd>결과 CSV·원본 측정·후보·적용 버전·Recipe/Setting 스냅샷·Script 식별정보를 Run 단위로 묶는다.\u003cbr>\u003ca class=\"ref\" href=\"#S01\">S01\u003c/a> \u003ca class=\"ref\" href=\"#S02\">S02\u003c/a> \u003ca class=\"ref\" href=\"#S25\">S25\u003c/a>\u003c/td>\u003ctd>파일만 전달받아도 무엇을 측정·보간·편집·적용했는지 재구성 가능. 표 복사와 정식 내보내기를 구분한다.\u003c/td>\u003c/tr>\u003ctr data-priority=\"P2\" data-id=\"R16\">\u003ctd>\u003cb>R16\u003c/b>\u003cbr>\u003cspan class=\"priority p2\">P2\u003c/span>\u003c/td>\u003ctd>\u003cb>Distortion 연계·AK 4점 수동 수신\u003c/b>\u003c/td>\u003ctd>AUTO 흐름의 조건·오류를 보여주고, 원하는 시점에 AK 4점 글로벌 X/Y(mm)를 수동 수신하는 화면과 상태를 구성한다. 기존 장치 결과 읽기와 새 측정 요청의 계약을 구분한다. \u003ca href=\"#align-key-manual\">좌표·화면·절차\u003c/a>\u003cbr>\u003ca class=\"ref\" href=\"#S23\">S23\u003c/a>\u003ca class=\"ref\" href=\"#S24\">S24\u003c/a>\u003ca class=\"ref\" href=\"#S36\">S36\u003c/a>\u003c/td>\u003ctd>8값 모두 유효할 때 갱신·취득시각/출처/회차 확인 상태 표시·실패 시 이전 정상값 보존. 수신만으로 Base/보정/Recipe/Script 미변경. AUTO 미할당 맵·실기 거래 별도 검수.\u003c/td>\u003c/tr>\u003ctr data-priority=\"P2\" data-id=\"R17\">\u003ctd>\u003cb>R17\u003c/b>\u003cbr>\u003cspan class=\"priority p2\">P2\u003c/span>\u003c/td>\u003ctd>\u003cb>8 Head 검산·원빔 평가\u003c/b>\u003c/td>\u003ctd>독립 좌표 검산에 더해 레시피 생성의 Offset·원빔 옵션과 스캐너별 유효 원빔 조건을 가공·리뷰 평가에 반영하는 흐름을 검토합니다.\u003cbr>\u003ca class=\"ref\" href=\"#S14\">S14\u003c/a> \u003ca class=\"ref\" href=\"#S17\">S17\u003c/a>\u003c/td>\u003ctd>기본 DOE=4의 의미를 임의 해석하지 않고 유효한 스캐너별 원빔 조건이 가공·리뷰 평가에 연결될 항목을 분명히 구분합니다.\u003c/td>\u003c/tr>\u003ctr data-priority=\"P2\" data-id=\"R18\">\u003ctd>\u003cb>R18\u003c/b>\u003cbr>\u003cspan class=\"priority p2\">P2\u003c/span>\u003c/td>\u003ctd>\u003cb>평가 속도·사용성·이력\u003c/b>\u003c/td>\u003ctd>많은 점의 필터/맵은 가상화·비동기 갱신하고 Recipe/Setting 변경 전후·사용자·시각을 결과와 연결한다.\u003cbr>\u003ca class=\"ref\" href=\"#S01\">S01\u003c/a> \u003ca class=\"ref\" href=\"#S11\">S11\u003c/a>\u003c/td>\u003ctd>대용량 기준 데이터에서 응답시간을 측정. 측정 중 화면 조작과 중지 상태가 일관되고, 변경 이력이 결과 Run에 연결된다.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cbutton class=\"no-print\" type=\"button\" id=\"download-backlog\">개선 목록 CSV로 내려받기\u003c/button>\u003cspan id=\"export-status\" aria-live=\"polite\">\u003c/span>\u003cp class=\"small\">내려받기는 이 문서에 정리한 텍스트 목록의 추출 기능이며 제품 데이터나 장비에 접근하지 않습니다.\u003c/p>\u003c/section>\n\n\u003csection id=\"roadmap\">\u003ch2>08. 추천 진행 순서\u003c/h2>\u003cdiv class=\"cards\">\u003cdiv class=\"card\">\u003cb>1차 · 결과를 신뢰하고 볼 수 있게\u003c/b>R01 식별 키, R02 CSV 조회/판정, R03 계산 정책, R06 단위·출처를 정리합니다. 동시에 읽기 전용 맵·분포 화면을 구성할 수 있습니다.\u003c/div>\u003cdiv class=\"card\">\u003cb>2차 · 평가 작업을 연결\u003c/b>R04 중복·Revision과 R05 범위 검사를 갖춘 뒤, R07~R12의 선택 재검·후보 비교·Apply/복원을 연결합니다. 기존 전용 측정·Apply를 재사용합니다.\u003c/div>\u003cdiv class=\"card\">\u003cb>3차 · 새 가공으로 검증하고 자동화 확장\u003c/b>R13 Shift 추종·R14 독립 검증과 데이터 패키지를 확인하고, Stage/Vision 계약 후 Distortion AUTO 및 좌표 검산을 확장합니다.\u003c/div>\u003c/div>\u003cp>조회 UI 개선과 보정 계산 계약 정리는 병행할 수 있습니다. 다만 미연결 CSV 적용 버튼을 먼저 노출하기보다, 판정 보존·계산 정책·적용 중복과 범위 검사를 먼저 검수하는 순서를 권장합니다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>검토 역할 제안\u003c/th>\u003cth>핵심 확인 내용\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>공정·평가 담당\u003c/td>\u003ctd>판정 공차, 수동 대체 허용 범위, 샘플링 단위, 검증점·평가 지표, 복원 정책\u003c/td>\u003c/tr>\u003ctr>\u003ctd>가공 SW\u003c/td>\u003ctd>결과 식별·UI·보정 계산·Revision·최종 좌표·Script/실행 연결\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Vision SW\u003c/td>\u003ctd>원본 측정·검출 상태·단위/축/부호·재측정·개수/ID 계약\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Stage/설비 담당\u003c/td>\u003ctd>실제 이동·Flying 트리거·Shift/검사 좌표·Distortion 신호 및 Stop/Reset 계약\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\n\n\u003csection id=\"questions\">\u003ch2>09. 미팅 후 확인할 사항\u003c/h2>\u003cp>기능별 조작 조건과 상대 인터페이스에서 확인할 사항입니다. 현재 코드의 확인 범위와 목표 동작을 구분해 검토합니다.\u003c/p>\u003col>\u003cli value=\"1\">\u003cb>타깃 대비 측정 공차와 오차 Level:\u003c/b> 현재 축별 X/Y tolerance의 OK/NG 판정은 유지합니다. 여기에 오차 크기의 수준을 보여주는 Level을 별도로 추가하고, 사용자가 각 수준의 이름과 범위를 편집할 수 있게 합니다. 지표는 \u003cb>max(|ΔX|,|ΔY|)\u003c/b> 또는 \u003cb>√(ΔX²+ΔY²)\u003c/b>를 선택합니다. 양수 오름차순 경계 t1/t2/t3에 대해 [0,t1], (t1,t2], (t2,t3], (t3,∞)의 네 범위로 나눕니다. 2/5/10 µm는 수정 가능한 SIM 예시이며 공정 합의값이 아닙니다. ERROR/미측정은 등급 없음으로 남깁니다. Level 설정이나 색을 바꾸어도 원측정 Judge·RAW는 바꾸지 않습니다. 현재 코드 공차는 축별이며 Config 기본 0.030 mm와 test0929의 3 mm는 현장 사용값과 별개입니다. \u003ca class=\"ref\" href=\"#S15\">S15\u003c/a>\u003ca class=\"ref\" href=\"#S31\">S31\u003c/a>\u003ca class=\"ref\" href=\"#S32\">S32\u003c/a>\u003c/li>\u003cli value=\"3\">\u003cb>직접 고른 기준 실측 Shot의 보정값 복사:\u003c/b> 사용자가 기준이 되는 \u003cb>실측 OK Shot을 직접 선택\u003c/b>하고, 다른 Shot들을 다중 선택해 기준 Shot 후보의 \u003cb>최종 보정값 F와 동일한 값\u003c/b>을 복사합니다. UI에서는 기준 Cell·기준 실측 Shot·복사 사유를 지정하고 “복사대상·값검토” 후 “같은F값으로복사”를 누릅니다. 자동으로 가장 가까운 점을 추정하는 동작이 아닙니다. 대상마다 기존값 B가 다르면 Δ=기준 F−대상 B로 각각 계산합니다. 원측정·Judge·RAW를 보존하고, 복사된 후보에는 MANUAL 출처·기준 key·사유·변경 전후값을 남긴 뒤 검증합니다.\u003c/li>\u003cli value=\"5\">\u003cb>Shift가 있을 때 AUTO 진입:\u003c/b> Shift X/Y가 모두 0이면 AUTO로 바로 전환합니다. Shift가 있으면 \u003cb>현재 Shift를 유지한 상태로 가공할지 확인\u003c/b>하고 유지 또는 취소할 수 있게 합니다. 기본 동작은 자동 초기화가 아닙니다. 양산용으로 별도 \u003cb>“팝업 없이 Shift 자동 초기화 후 AUTO”\u003c/b> 옵션을 두며, 이 옵션을 켰을 때만 Shift를 0으로 초기화한 뒤 AUTO로 전환합니다. 전환 전후값과 선택·옵션을 이력에 남깁니다. 검사 추종 좌표와 최종 Field 검사는 별도로 확인합니다.\u003c/li>\u003cli value=\"6\">\u003cb>Distortion·Align Key 수동 수신:\u003c/b> 가공 SW에서 사용자가 원하는 시점에 \u003cb>Align Key 4개의 글로벌 X/Y 좌표(mm) 8개를 수동으로 요청·수신\u003c/b>하고 취득 정보와 함께 확인하는 화면이 필요합니다. 현재 Load Data에는 장치 LastLoad를 직접 읽는 기반이 있습니다. “기존 결과 받기”와 “새 측정 요청 후 받기”를 구분하고, 후자는 상대가 지원하는 요청/완료·회차 계약을 확인해야 합니다. 수신과 Base 저장·보정 적용은 별도입니다. AUTO에는 Stage ABLE→조건 준비→Process ABLE→Stage COMPLETE→Load/Calculate/Save→Process COMPLETE→신호 OFF 코드가 있으나 Stage 두 입력은 미할당입니다. \u003ca href=\"#align-key-manual\">4점 표·조작 순서·완료 조건\u003c/a>에서 상세히 검토합니다. \u003ca class=\"ref\" href=\"#S23\">S23\u003c/a>\u003ca class=\"ref\" href=\"#S24\">S24\u003c/a>\u003ca class=\"ref\" href=\"#S33\">S33\u003c/a>\u003ca class=\"ref\" href=\"#S35\">S35\u003c/a>\u003ca class=\"ref\" href=\"#S36\">S36\u003c/a>\u003c/li>\u003cli value=\"7\">\u003cb>원빔 평가 추가 검토:\u003c/b> 레시피 생성 시 Offset·원빔 옵션을 검토하고, \u003cb>기본 DOE는 모든 스캐너 4\u003c/b>라는 사용자 조건을 표시합니다. 이 숫자의 단위·의미는 아직 확정하지 않으며 4개 Beam·4×4·Beam 번호 4 등으로 새로 해석하지 않습니다. 특정 스캐너에 유효한 원빔 설정이 있으면 그 조건을 해당 스캐너의 원빔 가공과 리뷰 평가에 반영하는 동작을 검토합니다. 원빔 설정이 없는 스캐너의 조건을 임의로 바꾸지 않습니다.\u003c/li>\u003c/ol>\u003c/section>\n\n\u003csection id=\"sources\">\u003ch2>10. 코드 근거와 검토 한계\u003c/h2>\u003cp>분석 기준: 사용자 지정 \u003ca href=\"https://github.com/kjuws10-rgb/A3Drilling/tree/3a6b021af7dad60578e7fb85e3191b43b3b3c183\">A3Drilling master\u003c/a> · Commit \u003cspan class=\"key\">3a6b021af7dad60578e7fb85e3191b43b3b3c183\u003c/span>. 별도 읽기 전용 Clone에서 파일과 실제 줄 범위를 대조했습니다. 아래 36개 근거 항목은 이 Commit에 고정되어 있으며 줄 범위·파일 SHA256은 source-evidence-v2.json에 기록합니다.\u003c/p>\u003cp>세 보조 검토가 UI 명령 연결, 보정·저장 경로, 샘플링·좌표·인터페이스를 나누어 확인했습니다. UI/장비·통신·배포본을 실행한 검증은 아닙니다. 기능의 부재 판단은 조사한 Review/Correction·관련 팝업·Monitor·Offset 경로와 연결 검색 범위에 한정합니다. 조건부 결함 후보를 현장 발생 확정으로 표현하지 않았습니다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable class=\"source-table\">\u003cthead>\u003ctr>\u003cth>ID\u003c/th>\u003cth>확인 대상\u003c/th>\u003cth>파일·줄 범위\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr id=\"S01\">\u003ctd>\u003cb>S01\u003c/b>\u003c/td>\u003ctd>결과 CSV: 저장 항목·실측 행·출처\u003c/td>\u003ctd>\u003ca href=\"https://github.com/kjuws10-rgb/A3Drilling/blob/3a6b021af7dad60578e7fb85e3191b43b3b3c183/Drilling.File/ReviewResult/CReviewResultFile.cs#L10-L39\">Drilling.File/ReviewResult/CReviewResultFile.cs · 10–39줄\u003c/a>\u003c/td>\u003c/tr>\u003ctr id=\"S02\">\u003ctd>\u003cb>S02\u003c/b>\u003c/td>\u003ctd>Offset 파일: 최신 선택·새 버전 저장\u003c/td>\u003ctd>\u003ca href=\"https://github.com/kjuws10-rgb/A3Drilling/blob/3a6b021af7dad60578e7fb85e3191b43b3b3c183/Drilling.File/ReviewOffset/CReviewOffsetFile.cs#L31-L104\">Drilling.File/ReviewOffset/CReviewOffsetFile.cs · 31–104줄\u003c/a>\u003c/td>\u003c/tr>\u003ctr id=\"S03\">\u003ctd>\u003cb>S03\u003c/b>\u003c/td>\u003ctd>공통 보정 버튼 Execute·CSV Load 함수\u003c/td>\u003ctd>\u003ca href=\"https://github.com/kjuws10-rgb/A3Drilling/blob/3a6b021af7dad60578e7fb85e3191b43b3b3c183/Drilling.UI/Menu/Menus/CMenuCorrection.cs#L195-L195\">Drilling.UI/Menu/Menus/CMen
